      flex-wrap: wrap;
    }
.bar-group {
      display: flex;
      align-items: center;
      padding: var(--ewam-sp-1);
      background: var(--ewam-glass-bg);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border: 1px solid var(--ewam-bar-border);
      border: 1px solid color-mix(in srgb, var(--ewam-text) 8%, transparent);
      border-radius: var(--ewam-radius-md);
      box-shadow: var(--ewam-elev-2), var(--ewam-inset-hi);
      gap: 0;
    }
.bar-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--ewam-text-muted);
      border-radius: var(--ewam-radius-sm);
      cursor: pointer;
      transition: background var(--ewam-dur-2),
                  color var(--ewam-dur-2),
                  box-shadow var(--ewam-dur-2),
                  transform var(--ewam-dur-1);
    }
@media (hover: hover) {
.bar-btn:hover { background: var(--ewam-accent-10); color: var(--ewam-text); }
}
.bar-btn:active { transform: scale(var(--ewam-press-scale)); }
.bar-btn:focus { outline: none; }
.bar-btn:focus-visible { outline: none; box-shadow: var(--ewam-ring); }
.bar-btn.active {
      background: var(--ewam-accent-10);
      color: var(--ewam-accent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ewam-accent) 25%, transparent);
    }
.scroll-top-btn {
      position: fixed;
      bottom: calc(5rem + env(safe-area-inset-bottom, 0px));
      right: 1.2rem;
      z-index: 45;
      width: 40px;
      height: 40px;
      border-radius: var(--ewam-radius-pill);
      border: 1px solid var(--ewam-border);
      border: 1px solid color-mix(in srgb, var(--ewam-text) 8%, transparent);
      background: var(--ewam-glass-bg);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      box-shadow: var(--ewam-elev-2), var(--ewam-inset-hi);
      color: var(--ewam-text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity var(--ewam-dur-3) var(--ewam-ease-spring),
                  transform var(--ewam-dur-3) var(--ewam-ease-spring),
                  background var(--ewam-dur-2),
                  color var(--ewam-dur-2),
                  box-shadow var(--ewam-dur-2);
    }
.scroll-top-btn.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
.scroll-top-btn:hover { background: var(--ewam-accent-10); color: var(--ewam-accent); }
.scroll-top-btn:active.visible { transform: scale(var(--ewam-press-scale)); }
.scroll-top-btn:focus { outline: none; }
.scroll-top-btn:focus-visible { outline: none; box-shadow: var(--ewam-elev-2), var(--ewam-inset-hi), var(--ewam-ring); }
@media (max-width: 640px) {
.header-title { font-size: 1.15rem; }
.header-inner { padding: var(--ewam-sp-2) var(--ewam-sp-3); }
.bar-inner { gap: var(--ewam-sp-1); }
.bar-btn { width: 38px; height: 38px; }
}
@media (max-width: 420px) {
.header-inner { padding: var(--ewam-sp-2); }
.header-title { font-size: 1.05rem; }
.header-controls { gap: 0.125rem; }
.lang-btn,
      .donate-link,
      .lang-select-btn { padding-left: 0.3rem; padding-right: 0.3rem; }
}
@media (max-width: 380px) {
.bar-inner { justify-content: center; }
.bar-group { margin: 2px 0; }
}
.donate-link {
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--ewam-accent);
      text-decoration: none;
      padding: var(--ewam-sp-1) var(--ewam-sp-2);
      border: 1px solid var(--ewam-accent);
      border: 1px solid color-mix(in srgb, var(--ewam-accent) 35%, transparent);
      border-radius: var(--ewam-radius-sm);
      letter-spacing: 0.02em;
      transition: background var(--ewam-dur-2),
                  color var(--ewam-dur-2),
                  border-color var(--ewam-dur-2),
                  transform var(--ewam-dur-1);
      display: inline-flex;
      align-items: center;
    }
.donate-link:hover,
    .donate-link:focus-visible {
      background: var(--ewam-accent);
      color: #fff;
      border-color: var(--ewam-accent);
    }
.donate-link:active { transform: scale(var(--ewam-press-scale)); }
.donate-link:focus { outline: none; }
.donate-link:focus-visible { outline: none; box-shadow: var(--ewam-ring); }
@media (prefers-reduced-motion: reduce) {
.tab-indicator { transition: none; }
.bar-btn:active, .lang-btn:active, .icon-btn:active,
      .nav-btn:active, .tab-btn:active, .scroll-top-btn:active,
      .index-item:active, .donate-link:active { transform: none; }
}
.intro-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      padding: var(--ewam-sp-1) var(--ewam-sp-2);
      border-radius: var(--ewam-radius-sm);
      border: 1px solid var(--ewam-border);
      background: transparent;
      color: var(--ewam-text-muted);
      cursor: pointer;
      transition: background var(--ewam-dur-2),
                  color var(--ewam-dur-2),
                  border-color var(--ewam-dur-2),
                  transform var(--ewam-dur-1);
    }
.intro-btn svg { width: 13px; height: 13px; flex: none; }
@media (hover: hover) {
.intro-btn:hover { color: var(--ewam-accent); border-color: var(--ewam-accent); }
}
.intro-btn:active { transform: scale(var(--ewam-press-scale)); }
.intro-btn:focus { outline: none; }
.intro-btn:focus-visible { outline: none; box-shadow: var(--ewam-ring); }
.intro-btn[aria-expanded="true"] {
      background: var(--ewam-card);
      color: var(--ewam-accent);
      border-color: var(--ewam-accent);
      box-shadow: var(--ewam-elev-1);
    }
@media (max-width: 420px) {
.intro-btn-label { display: none; }
.intro-btn { padding-left: 0.35rem; padding-right: 0.35rem; }
}
:root { --source-blue:#073763; }
.dark { --source-blue:#96bde6; }
.header-inner {
      height:80px; grid-template-areas:"lead title controls" "search search search";
      grid-template-columns:1fr auto 1fr; grid-template-rows:27px 26px;
      row-gap:4px; align-content:center;
    }
.header-title { font-size:1.4rem; }
.sticky-stack button,.bottom-bar button { -webkit-user-select:none; user-select:none; }
@media(max-width:600px) {
.header-inner { height:73px; padding:4px 12px; column-gap:6px; }
.header-title { font-size:1.15rem; }
.intro-btn-label { display:none; }
}
@media(max-width:380px) {
.header-inner { height:71px; padding:4px 8px; }
.header-title { font-size:1.05rem; }
}
.bar-inner { display:block; max-width:36rem; }
.bar-btn:disabled { opacity:0.35; cursor:default; transform:none; }
.tab-syllable { font:24px/1.4 'Jomolhari',serif; width:32px; text-align:center; }

/* Match Ewam's shared controls, with sutra-specific language and glossary views. */
[hidden] { display:none !important; }
.reader-shell { min-height:100vh; background:var(--ewam-bg); color:var(--ewam-text); padding-bottom:80px;
  font:17px/1.65 'EB Garamond',Georgia,serif; font-feature-settings:"kern","liga","onum" 1; }
.header-inner { height:80px; grid-template-areas:"lead title controls" "options options options";
  grid-template-columns:1fr auto 1fr; grid-template-rows:27px 26px; row-gap:4px; align-content:center; }
.header-options { grid-area:options; display:flex; align-items:center; justify-content:center; }
.language-selector,.script-selector { display:flex; align-items:center; gap:6px; }
.script-selector { padding-left:6px; border-left:1px solid var(--ewam-border); }
.tabs-bar .tab-btn { line-height:1.65; }
.tab-btn.active::after { content:""; position:absolute; height:2px; bottom:0; left:0; right:0; background:var(--ewam-accent); }
.bar-inner { display:block; max-width:36rem; }
.reader-toolbar { display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); gap:2px; margin:0; }
.reader-toolbar .bar-btn { width:100%; min-width:0; }
.bar-btn { font:13.3333px Arial; padding:0; }
.bar-btn:disabled { opacity:0.35; cursor:default; transform:none; }
.fullscreen .reader-toolbar { display:flex; width:max-content; margin-left:auto; }
.fullscreen .reader-toolbar .bar-btn:not(#btnFS),.fullscreen .scroll-top-btn,.fullscreen .page-navigation { display:none; }
.fullscreen .reader-toolbar #btnFS { width:40px; }
.reader-timer { position:absolute; bottom:100%; left:50%; transform:translateX(-50%); pointer-events:auto;
  background:var(--ewam-glass-bg); border:1px solid var(--ewam-border); border-radius:6px; padding:4px 8px; margin-bottom:8px; }
.page-navigation { position:fixed; bottom:var(--reader-bar-h,74px); left:50%; transform:translateX(-50%);
  z-index:45; display:flex; align-items:center; justify-content:space-between; gap:12px;
  width:min(20rem,calc(100% - 32px)); height:36px; background:var(--ewam-bg); }
.page-navigation .bar-btn { width:40px; height:32px; }
.page-position { font:12px/1.5 'Inter',sans-serif; color:var(--ewam-text-muted); text-align:center; }
.reader-main { width:100%; }
.introduction-main { max-width:56rem; margin:0 auto; padding:32px 16px; }
.content-area { max-width:56rem; margin:0 auto; padding:32px 16px 64px; }
.section-block { margin-bottom:40px; }
.section-heading { margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--ewam-accent-10);
  font:500 0.7rem/1.65 'Inter',sans-serif; letter-spacing:0.14em; text-transform:uppercase; color:var(--ewam-accent); break-after:avoid-column; }
.sutra-title { font:600 2em/1.25 'EB Garamond',serif; text-align:center; color:var(--ewam-accent); margin:0 0 16px; overflow-wrap:anywhere; }
.sutra-title-text { text-align:center; color:var(--ewam-text-muted); font-style:italic; margin-bottom:32px; overflow-wrap:anywhere; }
.sutra-paragraph { line-height:1.65; text-align:justify; margin:16px 0; overflow-wrap:anywhere; orphans:2; widows:2; }
.sutra-paragraph.native-script { line-height:1.85; }
.sutra-footer { margin-top:32px; padding:32px 0; font:12px/1.65 'Inter',sans-serif; text-align:center; color:var(--ewam-text-muted); }
.index-item { display:block; width:100%; padding:16px; font:13px/1.65 'Inter',sans-serif; color:var(--ewam-text); }
.index-item:hover { background:var(--ewam-accent-10); }
.index-item.is-current { background:var(--ewam-accent-10); color:var(--ewam-accent); font-weight:700; box-shadow:inset 3px 0 var(--ewam-accent); }
html.paged-reading,.paged-reading body { height:100%; overflow:hidden; overflow-anchor:none; }
.paged-reading *,.paged-reading *::before,.paged-reading *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; }
.paged-reading .content-area { position:fixed; top:var(--page-top); left:0; right:0; height:var(--page-height); padding:0 16px; overflow:hidden; touch-action:none; }
.paged-reading .section-block { display:none; margin:0; }
.paged-reading .section-block.page-section { display:block; width:var(--page-width); height:100%; column-width:var(--page-width); column-gap:32px; column-fill:auto; }
.paged-reading .sutra-title { line-height:1.65; }
.paged-reading .scroll-top-btn { bottom:calc(var(--reader-bar-h,74px) + 44px); }
@media(max-width:600px) {
  .header-inner { height:73px; padding:4px 12px; column-gap:6px; }
  .header-title { font-size:1.15rem; }
  .intro-btn-label { display:none; }
  .intro-btn { padding-left:0.35rem; padding-right:0.35rem; }
  .bar-btn { height:38px; }
  .tab-btn { font-size:0.75rem; padding:0.5rem 0; gap:0.3rem; }
}
@media(max-width:380px) {
  .header-inner { height:71px; padding:4px 8px; }
  .header-title { font-size:1.05rem; }
  .header-controls { gap:0.125rem; }
  .language-selector,.script-selector { gap:4px; }
  .donate-link { padding-left:8px; padding-right:8px; }
}
@media (orientation:landscape) and (max-height:480px) {
  .paged-reading .header-inner { height:48px; grid-template-areas:"lead title options controls";
    grid-template-columns:auto auto minmax(0,1fr) auto; grid-template-rows:28px; column-gap:12px; }
  .paged-reading .header-title { font-size:1.05rem; }
  .paged-reading .intro-btn-label { display:none; }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; }
}

me="Input";var Ay=[{section:0,title:{english:"The Noble Perfection of Wisdom, the Vajra-Cutter"},content:{english:["In the language of India: Ārya Vajracchedikā Prajñāpāramitā Nāma Mahāyāna Sūtra","In the language of Tibet: ’Phags pa shes rab kyi pha rol tu phyin pa rdo rje gcod pa zhes bya ba theg pa chen po’i mdo","Homage to all the Buddhas and Bodhisattvas."]}},{section:1,title:{english:"The Setting"},content:{english:["Thus have I heard at one time. The Blessed One was dwelling in Shravasti, in Jeta’s Grove, the garden of Anathapindada, together with a great assembly of one thousand two hundred fifty monks, and with very many Bodhisattvas, great beings.","Then, at the time of the forenoon, the Blessed One, having put on his lower and upper Dharma robes, took up his alms bowl and went into the great city of Shravasti for alms. Then the Blessed One, having gone for alms in the great city of Shravasti, partook of his meal and completed the act of eating. Having finished his later-day alms round, he put away his alms bowl and Dharma robes, washed his feet, arranged his seat, sat down cross-legged, straightened his body, and established mindfulness before him. Then, many monks went to where the Blessed One was, and having arrived, they bowed their heads to the feet of the Blessed One, circumambulated him three times, and sat down to one side."]}},{section:2,title:{english:"Subhuti's Question"},content:{english:["Furthermore, at that time, the Venerable Subhuti was present, having joined that very assembly. Then, the Venerable Subhuti rose from his seat, draped his upper robe over one shoulder, placed the kneecap of his right knee upon the ground, and having bent toward the Blessed One where he was, he joined his palms and spoke this to the Blessed One:","“Wonderful indeed, O Blessed One! Wonderful indeed, O Sugata! How the Tathagata, the Arhat, the Perfectly and Completely Awakened One, confers the unsurpassed welfare upon the Bodhisattvas, the great beings; how the Tathagata, in utmost skill, entrusts the Bodhisattvas, the great beings, with the supreme charge—this, O Blessed One, is truly marvelous! This, O Sugata, is truly marvelous!”","“Blessed One, for those who have correctly entered the Bodhisattva vehicle, how should they abide? How should they practice? How should they completely control their minds?”","After he had spoken thus, the Blessed One spoke these words to the Venerable Subhuti: “Excellent, excellent, Subhuti! It is just so. It is just so. The Tathagata confers the supreme welfare upon the Bodhisattvas, the great beings. The Tathagata entrusts the Bodhisattvas, the great beings, with the supreme charge. Therefore, Subhuti, listen, and keep this well and truly in your mind, and I shall explain to you how those who have correctly entered the Bodhisattva vehicle should abide, how they should practice, and how they should completely control their minds.”","Having replied, “So be it, Blessed One,” the Venerable Subhuti listened as the Blessed One had instructed."]}},{section:3,title:{english:"The Bodhisattva's Vow"},content:{english:["The Blessed One spoke these words to the Venerable Subhuti: “Subhuti, here, one who has correctly entered the Bodhisattva vehicle should generate this thought: ‘However many beings are included in the category of beings—whether they are born from an egg, born from a womb, born from moisture, or born miraculously; whether they have form or are formless; whether they have perception, are without perception, or are neither with nor without perception; in whatever conceivable realm of beings there may be—all these I shall lead to pass into nirvana in the realm of nirvana without any remainder of aggregates.’ Yet, even though countless beings are thus led to nirvana, not a single being has been led to nirvana. One should generate the mind thinking in this way.","“For what reason? Subhuti, if a perception of a ‘being’ were to arise for a Bodhisattva, they should not be called a ‘Bodhisattva.’ For what reason? Subhuti, they should not be called a ‘Bodhisattva’ for whom a perception of a being, a perception of a life, or a perception of a person arises.”"]}},{section:4,title:{english:"Giving Without Abiding"},content:{english:["“Furthermore, Subhuti, a Bodhisattva should give a gift without abiding in things. They should give a gift without abiding in anything at all. They should give a gift without abiding in form. Likewise, they should give a gift without abiding in sound, smell, taste, touch, or dharmas. Subhuti, a Bodhisattva gives a gift in this way, without even abiding in the perception of a characteristic.",`“For what reason? Subhuti, for a Bodhisattva who gives a gift without abiding, the measure of their heap of merit is not easy to grasp. What do you think, Subhuti? Is the measure of the space in the eastern direction easy to grasp?”
Subhuti replied: “Blessed One, it is not.”
The Blessed One said: “Subhuti, likewise, is the measure of the space in the southern, western, northern, upper, and lower directions, the intermediate directions, and the ten directions easy to grasp?”
Subhuti replied: “Blessed One, it is not.”
The Blessed One said: “Subhuti, just so, for a Bodhisattva who gives a gift without abiding in anything, the measure of their heap of merit is not easy to grasp.”`]}},{section:5,title:{english:"Seeing Without Marks"},content:{english:[`“Subhuti, what do you think? Is the Tathagata to be seen by the perfection of his marks?”
Subhuti replied: “Blessed One, it is not so. The Tathagata is not to be seen by the perfection of his marks. For what reason? Because that which was spoken of by the Tathagata as the ‘perfection of marks’ is itself not a perfection of marks.”
After he had said this, the Blessed One spoke these words to the Venerable Subhuti: “Subhuti, inasmuch as there is a perfection of marks, there is falsehood. Inasmuch as there is no perfection of marks, there is no falsehood. Thus, the Tathagata is to be seen through marks and the absence of marks.”`]}},{section:6,title:{english:"The Rarity of True Faith"},content:{english:["After he had spoken thus, the Venerable Subhuti spoke these words to the Blessed One: “Blessed One, in the future time, in the final five hundred years when the holy Dharma is being destroyed, will there be any beings who, upon hearing the words of such sutras being explained, will generate a correct perception?”","The Blessed One said: “Subhuti, do not say such a thing as, ‘In the future time, in the final five hundred years when the holy Dharma is being destroyed, will there be any beings who, upon hearing the words of such sutras being explained, will generate a correct perception?’ Subhuti, in the future time, in the final five hundred years when the holy Dharma is being destroyed, there will arise Bodhisattvas, great beings, who are endowed with morality, endowed with good qualities, and endowed with wisdom. And Subhuti, those Bodhisattvas, those great beings, will not have served just one Buddha; they will not have generated roots of virtue under just one Buddha. Rather, Subhuti, there will arise those Bodhisattvas, those great beings, who have served many hundreds of thousands of Buddhas and generated roots of virtue under many hundreds of thousands of Buddhas. Subhuti, those who, upon hearing the explanation of the words of such sutras, will find even a single thought of faith, are known by the Tathagata. Subhuti, they are seen by the Tathagata. Subhuti, all those beings will generate and gather an immeasurable heap of merit.”"]}},{section:7,title:{english:"No Dharma, No Non-Dharma"},content:{english:["“For what reason? Subhuti, for those Bodhisattvas, those great beings, a perception of a self will not arise; a perception of a being is not entertained, a perception of a life is not entertained, and a perception of a person will not arise. Subhuti, for those Bodhisattvas, those great beings, a perception of dharma and a perception of no-dharma will also not arise; for them, a perception of no-perception will also not arise.","“For what reason? Subhuti, if for those Bodhisattvas, those great beings, a perception of dharma were to arise, that very thing would become for them a grasping at a self, a grasping at a being, a grasping at a life, and a grasping at a person. If a perception of the non-existence of dharma were to arise, that very thing would become for them a grasping at a self, a grasping at a being, a grasping at a life, and a grasping at a person. For what reason? Subhuti, a Bodhisattva should not wrongly grasp at dharma, and they should not grasp at non-dharma either. Therefore, thinking of this, the Tathagata has taught: ‘Those who know this Dharma discourse is like a raft should abandon even dharmas—to say nothing of non-dharmas!’”"]}},{section:8,title:{english:"The Merit of Understanding is Supreme"},content:{english:[`The Blessed One said: “Subhuti, what do you think? If some son or daughter of good family were to fill this trichiliocosm with the seven precious jewels and give it as a gift, would that son or daughter of good family thereby generate a great heap of merit?”
Subhuti replied: “It would be great, Blessed One. It would be great, Sugata. That son or daughter of good family would thereby generate a great heap of merit. For what reason? Because that very heap of merit is no-heap; therefore, the Tathagata speaks of a ‘heap of merit, a heap of merit.’”
The Blessed One said: “Subhuti, if a son or daughter of good family were to fill this trichiliocosm with the seven precious jewels and give it as a gift, compared to one who, having taken from this Dharma discourse even so much as a four-line verse, explains it to others and correctly and thoroughly reveals it, this latter one would, from that cause, generate a far greater, innumerable, and immeasurable heap of merit. For what reason? Subhuti, it is from this that the unexcelled, perfect, and complete awakening of the Tathagatas, the Arhats, the Perfectly and Completely Awakened Ones, has arisen; it is from this that the Buddhas, the Blessed Ones, are born. For what reason, Subhuti? That which is called ‘Buddha-dharmas, Buddha-dharmas’ was taught by the Tathagata as no Buddha-dharmas; therefore, it is called ‘Buddha-dharmas.’”`]}},{section:9,title:{english:"The Four Fruits are Not Attained"},content:{english:[`“Subhuti, what do you think? Does a stream-enterer think, ‘I have obtained the fruit of stream-entry’?”
Subhuti replied: “Blessed One, it is not so. For what reason? Blessed One, because he has not entered into anything, he is called a ‘stream-enterer.’ He has not entered form, nor sound, nor smell, nor taste, nor touch, nor dharmas; therefore, he is called a ‘stream-enterer.’ For what reason? Blessed One, if a stream-enterer were to think, ‘I have obtained the fruit of stream-entry,’ that very thought would be for him a grasping at a self, a grasping at a being, a grasping at a life, and a grasping at a person.”`,`The Blessed One said: “Subhuti, what do you think? Does a once-returner think, ‘I have obtained the fruit of once-returning’?”
Subhuti replied: “Blessed One, it is not so. For what reason? Because there is no dharma that has entered into the state of once-returning; therefore, one is called a ‘once-returner.’ Blessed One, if a once-returner were to think, ‘I have obtained the fruit of once-returning,’ that very thought would be for him a grasping at a self, a grasping at a being, a grasping at a life, and a grasping at a person.”`,`The Blessed One said: “Subhuti, what do you think? Does a non-returner think, ‘I have obtained the fruit of non-returning’?”
Subhuti replied: “Blessed One, it is not so. For what reason? Because there is no dharma that has entered into the state of non-returning; therefore, one is called a ‘non-returner.’”`,`The Blessed One said: “Subhuti, what do you think? Does an Arhat think, ‘I have attained Arhatship’?”
Subhuti replied: “Blessed One, it is not so. For what reason? Because there is no dharma whatsoever called an ‘Arhat.’ Blessed One, if an Arhat were to think, ‘I have attained Arhatship,’ that very thought would be for him a grasping at a self, a grasping at a being, a grasping at a life, and a grasping at a person. Blessed One, I have been pointed out by the Tathagata, the Arhat, the Perfectly and Completely Awakened One, as the foremost of those who dwell without affliction. Blessed One, although I am an Arhat free from desire, Blessed One, I do not think, ‘I am an Arhat.’ Blessed One, if I were to think, ‘I have attained Arhatship,’ the Tathagata would not have prophesied of me: ‘The son of good family, Subhuti, is the foremost of those who dwell without affliction; because he dwells nowhere, he is called one who dwells without affliction.’”`]}},{section:10,title:{english:"Adorning the Pure Land"},content:{english:[`The Blessed One said: “Subhuti, what do you think? Is there any dharma that the Tathagata received from the Tathagata, the Arhat, the Perfectly and Completely Awakened One, Dipamkara?”
Subhuti replied: “Blessed One, it is not so. There is no dharma whatsoever that the Tathagata received from the Tathagata, the Arhat, the Perfectly and Completely Awakened One, Dipamkara.”
The Blessed One said: “Subhuti, if any Bodhisattva were to say, ‘I will accomplish the adornments of a Buddha-field,’ they would be speaking falsely. For what reason? Subhuti, that which is called ‘adornments of a field, adornments of a field’ was taught by the Tathagata as no-adornments; therefore, it is called ‘adornments of a field.’ Therefore, Subhuti, a Bodhisattva, a great being, should thus generate a mind that does not abide. They should generate a mind that does not abide in anything. They should generate a mind not abiding in form. They should generate a mind not abiding in sound, smell, taste, touch, or dharmas. Subhuti, it is like this: for example, if there were a person whose body was like this: like the king of mountains, Mount Meru. Subhuti, what do you think? Would that body be great?”
Subhuti replied: “Blessed One, that body would be great. Sugata, that body would be great. For what reason? Because the Tathagata taught that it is no-thing, it is called a ‘great body.’ Because it is no-thing, it is called a ‘body.’”`]}},{section:11,title:{english:"The Merit of Upholding the Dharma is Supreme"},content:{english:[`The Blessed One said: “Subhuti, what do you think? If there were as many Ganges rivers as there are grains of sand in the river Ganges, would the grains of sand in all of them be many?”
Subhuti replied: “Blessed One, the Ganges rivers themselves would be many; what need is there to mention the grains of sand in them?”
The Blessed One said: “Subhuti, have faith in this! Understand this! As many grains of sand as there are in those Ganges rivers, if a man or woman were to fill that many chiliocosms with the seven precious jewels and give them as a gift to the Tathagatas, the Arhats, the Perfectly and Completely Awakened Ones—Subhuti, what do you think, would that man or woman thereby generate a great heap of merit?”
Subhuti replied: “It would be great, Blessed One. It would be great, Sugata. That man or woman would thereby generate a great heap of merit.”
The Blessed One said: “Subhuti, compared to one who fills that many chiliocosms with the seven precious jewels and gives them as a gift to the Tathagatas, the Arhats, the Perfectly and Completely Awakened Ones, one who, having taken from this Dharma discourse even so much as a four-line verse, explains and reveals it correctly and thoroughly to others—that one would, from that cause, generate a far greater, innumerable, and immeasurable heap of merit.”`]}},{section:12,title:{english:"Honoring the Teaching"},content:{english:["“Furthermore, Subhuti, whatever region of the earth where even a four-line verse from this Dharma discourse is recited or taught, that region of the earth becomes a stupa for the world with its gods, humans, and asuras. What need is there to mention one who takes up this Dharma discourse, writes it, holds it, maintains it, reads it, masters it, and does it with a mind in accord with the Dharma? They are endowed with the highest wonder. In that region of the earth, either the Teacher or a master who is like a Guru resides.”"]}},{section:13,title:{english:"The Name of the Discourse"},content:{english:[`After he had spoken thus, the Venerable Subhuti spoke these words to the Blessed One: “Blessed One, what is the name of this Dharma discourse, and how should I hold it in mind?”
After he had spoken thus, the Blessed One spoke these words to the Venerable Subhuti: “Subhuti, this Dharma discourse is called ‘The Perfection of Wisdom’; thus, you should hold it in mind. For what reason? Subhuti, that very Perfection of Wisdom which was taught by the Tathagata was taught by the Tathagata as no-perfection; therefore, it is called the ‘Perfection of Wisdom.’`,`“Subhuti, what do you think? Is there any dharma that has been taught by the Tathagata?”
Subhuti replied: “No indeed, Blessed One. There is no dharma whatsoever that has been taught by the Tathagata.”`,`The Blessed One said: “Subhuti, what do you think? As many particles of earth as there are in the trichiliocosm, would that be many?”
Subhuti replied: “It would be great, Blessed One. It would be great, Sugata. For what reason? That which was taught by the Tathagata as ‘particles of earth’ was taught by the Tathagata as no-particles; therefore, it is called ‘particles of earth.’ That which was taught by the Tathagata as the ‘chiliocosm’ was taught by the Tathagata as no-system; therefore, it is called the ‘chiliocosm.’”`,`The Blessed One said: “Subhuti, what do you think? Is the Tathagata, the Arhat, the Perfectly and Completely Awakened One, to be seen by the thirty-two marks of a great being?”
Subhuti replied: “No indeed, Blessed One. The Tathagata, the Arhat, the Perfectly and Completely Awakened One, is not to be seen by the thirty-two marks of a great being. For what reason? Those thirty-two marks of a great being that were taught by the Tathagata were taught by the Tathagata as no-marks; therefore, they are called the ‘thirty-two marks of a great being.’”`,"The Blessed One said: “Furthermore, Subhuti, if a man or woman were to give away as many bodies as there are grains of sand in the river Ganges, and do so day after day; and if another, having taken from this Dharma discourse even so much as a four-line verse, were to teach and explain it to others, this latter one would, from that cause, generate a far greater, innumerable, and immeasurable heap of merit.”"]}},{section:14,title:{english:"The Perfection of the Teaching is No-Perfection"},content:{english:["After he had spoken thus, the Venerable Subhuti, moved by the force of the Dharma, shed tears. Having wiped his tears, he spoke these words to the Blessed One: “That this Dharma discourse has been taught by the Tathagata in such a way is wonderful, O Blessed One! It is wonderful, O Sugata! Blessed One, since wisdom arose in me, I have never before heard such a Dharma discourse. For what reason? Blessed One, those beings who, upon hearing this sutra explained, will generate a correct perception will be endowed with the highest wonder. For what reason? Blessed One, that which is a correct perception is itself no-perception; therefore, the Tathagata speaks of a ‘correct perception.’”","“Blessed One, that I am able to comprehend and have faith in this Dharma discourse as it is being explained is no wonder for me. But, Blessed One, in a later time, in the final five hundred years, those beings who take up this Dharma discourse, write it, hold it, maintain it, read it, and master it—they will be endowed with the highest wonder.”",`“Furthermore, Blessed One, for them, a perception of a self will not arise, nor a perception of a being, a perception of a life, or a perception of a person. For what reason? Blessed One, that which is a perception of a self, a perception of a being, a perception of a life, and a perception of a person is itself a being free from all perceptions. For what reason? Because the Buddhas, the Blessed Ones, are free from all perceptions.”
After he had spoken thus, the Blessed One spoke these words to the Venerable Subhuti: “Subhuti, it is just so. It is just so. Those beings who, upon hearing this sutra explained, are not frightened, are not terrified, and are not alarmed in any way, will be endowed with the highest wonder. For what reason? Subhuti, this supreme perfection was taught by the Tathagata. That supreme perfection which was taught by the Tathagata was also taught by immeasurable, countless Buddhas, the Blessed Ones; therefore, it is called the ‘supreme perfection.’”`]}},{section:15,title:{english:"The Merit of Upholding the Teaching"},content:{english:["“Furthermore, Subhuti, that which is the Tathagata's perfection of patience is itself no-perfection. For what reason? Subhuti, at the time when the king of Kalinga severed my limbs and joints, at that time, I had no perception of a self, nor a perception of a being, nor a perception of a life, nor a perception of a person. I had no perception whatsoever, nor was I without perception. For what reason? Subhuti, if at that time I had a perception of a self, at that time a perception of ill-will would also have arisen. If I had a perception of a being, a perception of a life, or a perception of a person, at that time a perception of ill-will would also have arisen. Subhuti, I remember that in a past time, for five hundred lifetimes, I was the sage known as ‘Forbearance-Proclaimer.’ Even at that time, I had no perception of a self, no perception of a being, no perception of a life, and no perception of a person. Therefore, Subhuti, a Bodhisattva, a great being, having completely abandoned all perceptions, should generate the mind set on unexcelled, perfect, and complete awakening. They should generate a mind that does not abide in form. They should generate a mind that does not abide in sound, smell, taste, or touch. They should generate a mind that does not abide in dharma. They should generate a mind that does not abide in no-dharma. They should generate a mind that does not abide in anything whatsoever. For what reason? Because that which abides is itself non-abiding. Therefore, the Tathagata taught these words: ‘A Bodhisattva should give a gift without abiding in anything.’”"]}},{section:16,title:{english:"The Purification of Karma"},content:{english:["“Furthermore, Subhuti, a Bodhisattva should thus give gifts for the benefit of all beings. That which is called a ‘perception of a being’ is itself no-perception. And those who were taught by the Tathagata as ‘all beings’ are themselves no-beings. For what reason? Subhuti, the Tathagata is a speaker of reality, a speaker of truth, a speaker of thusness. The Tathagata is not a speaker of falsehood. Furthermore, Subhuti, in the dharma that the Tathagata fully and perfectly awakened to or taught, there is no truth and no falsehood. Subhuti, it is like this: for example, a person with eyes who has entered into darkness will not see anything. A Bodhisattva who has fallen into substantiality while giving a gift should be seen in the same way. Furthermore, Subhuti, it is like this: for example, a person with eyes who, when the night has passed and the sun has risen, sees various kinds of forms. A Bodhisattva who has not fallen into substantiality while giving a gift should be seen in the same way. Furthermore, Subhuti, those sons or daughters of good family who take up this Dharma discourse, hold it, maintain it, read it, master it, and correctly and thoroughly teach it to others are known by the Tathagata. They are seen by the Tathagata, and all those beings will generate an immeasurable heap of merit.”","“Furthermore, Subhuti, if a man or woman were, in the morning, to give away as many bodies as there are grains of sand in the river Ganges; and at midday and in the evening, again give away as many bodies as there are grains of sand in the river Ganges; and in this way, give away their bodies for many tens of millions of billions of eons; compared to one who, having heard this Dharma discourse, does not reject it, that one, from that cause, would generate a far greater, innumerable, and immeasurable heap of merit. What need is there to mention one who writes it down, takes it up, holds it, maintains it, reads it, masters it, and correctly and thoroughly teaches it to others?”","“Furthermore, Subhuti, this Dharma discourse is inconceivable and unequaled. Its fruition is also to be understood as inconceivable. This Dharma discourse was taught by the Tathagata for the benefit of beings who have correctly entered the supreme vehicle, and for the benefit of beings who have correctly entered the ultimate vehicle. Those who take up this Dharma discourse, hold it, maintain it, read it, master it, and correctly and thoroughly teach it to others are known by the Tathagata. They are seen by the Tathagata, and all those beings will be endowed with an immeasurable heap of merit. They will be endowed with an inconceivable, unequaled, unmeasurable, and limitless heap of merit. All those beings will carry my awakening on their shoulders. For what reason? Subhuti, this Dharma discourse cannot be heard by those who are inclined to the lesser. It cannot be heard, received, held, read, or mastered by those who hold a view of a self, a view of a being, a view of a life, or a view of a person. That is not possible.”","“Furthermore, Subhuti, whatever region of the earth this sutra is taught, that region will become worthy of offerings from the world with its gods, humans, and asuras. That region will become worthy of prostration and circumambulation. That region will become like a stupa.”","“Furthermore, Subhuti, those sons or daughters of good family who take up, hold, maintain, read, and master the words of such a sutra will be tormented, and they will be greatly tormented. For what reason? Subhuti, those unwholesome karmic deeds of those beings from previous lives which would lead to a lower rebirth will be exhausted by their being tormented in this very life. They will have purified those unwholesome karmic deeds of previous lives which would lead to a lower rebirth, and they will also attain the awakening of a Buddha.”","“Subhuti, I remember that in a past time, countless, and even more countless eons ago, long, long before the Tathagata, the Arhat, the Perfectly and Completely Awakened One, Dipamkara, there were eighty-four hundred thousand million billion Buddhas whom I pleased, and having pleased them, did not displease them. Subhuti, that merit from having pleased those Buddhas and Blessed Ones and not having displeased them, compared to the heap of merit of one who, in the final time, the final five hundred years, in the time of the destruction of the holy Dharma, takes up, holds, maintains, reads, and masters such sutras, and correctly and thoroughly teaches them to others—Subhuti, this latter heap of merit does not approach one-hundredth part of the former heap of merit, nor one-thousandth, nor one-hundred-thousandth, nor one-ten-millionth, nor one-hundred-millionth, nor one-billionth, nor one-hundred-billionth part. It withstands no number, fraction, calculation, analogy, or comparison.”","“Subhuti, if I were to state the heap of merit of those sons or daughters of good family, as much of a heap of merit as those sons or daughters of good family would at that time generate and receive, beings would go mad and their minds would be disturbed. Furthermore, Subhuti, this Dharma discourse taught by the Tathagata is inconceivable and unequaled. Its fruition is also to be regarded as inconceivable.”"]}},{section:17,title:{english:"No Attainment, No Dharma"},content:{english:[`Then the Venerable Subhuti spoke these words to the Blessed One: “Blessed One, for those who have correctly entered the Bodhisattva vehicle, how should they abide? How should they practice? How should they completely control their minds?”
The Blessed One spoke these words to the Venerable Subhuti: “Subhuti, here, one who has correctly entered the Bodhisattva vehicle should generate this thought: ‘All beings I shall lead to pass into nirvana in the realm of nirvana without any remainder of aggregates.’ Yet, even though countless beings are thus led to nirvana, no being has been led to nirvana. For what reason? Subhuti, if a perception of a being were to arise for a Bodhisattva, they should not be called a ‘Bodhisattva,’ up to the point where if a perception of a person were to arise, they should not be called a ‘Bodhisattva.’ For what reason? Subhuti, there is no dharma whatsoever called ‘one who has entered the Bodhisattva vehicle.’”`,`“Subhuti, what do you think? Is there any dharma that the Tathagata fully and perfectly awakened to as unexcelled, perfect, and complete awakening in the presence of the Tathagata Dipamkara?”
After he had spoken thus, the Venerable Subhuti spoke these words to the Blessed One: “Blessed One, there is no dharma whatsoever that the Tathagata fully and perfectly awakened to as unexcelled, perfect, and complete awakening in the presence of the Tathagata, the Arhat, the Perfectly and Completely Awakened One, Dipamkara.”
After he had spoken thus, the Blessed One spoke these words to the Venerable Subhuti: “It is just so, Subhuti, it is just so. There is no dharma whatsoever that the Tathagata fully and perfectly awakened to as unexcelled, perfect, and complete awakening in the presence of the Tathagata, the Arhat, the Perfectly and Completely Awakenced One, Dipamkara. Subhuti, if there were any dharma that the Tathagata fully and perfectly awakened to, the Tathagata Dipamkara would not have prophesied of me: ‘Young Brahmin, in a future time, you will become a Tathagata, an Arhat, a Perfectly and Completely Awaked One, named Shakyamuni.’ Since, Subhuti, there is no dharma whatsoever that was fully and perfectly awakened to as unexcelled, perfect, and complete awakening, therefore I was prophesied by the Tathagata Dipamkara: ‘Young Brahmin, in a future time, you will become a Tathagata, an Arhat, a Perfectly and Completely Awaked One, named Shakyamuni.’”`,"“For what reason? ‘Tathagata,’ Subhuti, is an epithet for true thusness. If someone were to say, ‘The Tathagata, the Arhat, the Perfectly and Completely Awakened One, has fully and perfectly awakened to unexcelled, perfect, and complete awakening,’ they would be speaking falsely. Subhuti, they would be slandering me by wrongly grasping. For what reason? There is no dharma whatsoever that the Tathagata has fully and perfectly awakened to as unexcelled, perfect, and complete awakening. Subhuti, in the dharma that the Tathagata has fully and perfectly awakened to or taught, there is neither truth nor falsehood. Therefore, the Tathagata teaches: ‘All dharmas are Buddha-dharmas.’ For what reason? ‘All dharmas,’ Subhuti, were taught by the Tathagata as no-dharmas; therefore, they are called ‘all dharmas, Buddha-dharmas.’”",`“Subhuti, it is like this: for example, a person with a human body, a great body.”
The Venerable Subhuti said: “Blessed One, that which was taught by the Tathagata as a ‘person with a human body, a great body,’ was taught by the Tathagata as no-body. Therefore, it is called a ‘body endowed, a great body.’”
The Blessed One said: “It is just so, Subhuti. A Bodhisattva who says, ‘I shall lead beings to pass beyond sorrow into nirvana,’ should not be called a ‘Bodhisattva.’ For what reason? Subhuti, is there any dharma whatsoever called a ‘Bodhisattva’?”
Subhuti replied: “No indeed, Blessed One.”
The Blessed One said: “Subhuti, therefore the Tathagata teaches: ‘All dharmas are without a self, without a life, without a person.’ Furthermore, Subhuti, if a Bodhisattva were to say, ‘I will accomplish the adornments of a Buddha-field,’ they should be described in the same way. For what reason? ‘Adornments of a field, adornments of a field,’ Subhuti, were taught by the Tathagata as no-adornments; therefore, it is called ‘adornments of a field.’ Subhuti, a Bodhisattva who has faith that ‘dharmas are selfless, dharmas are selfless’ is called a ‘Bodhisattva, a great being’ by the Tathagata, the Arhat, the Perfectly and Completely Awakened One.”`]}},{section:18,title:{english:"The Five Eyes"},content:{english:[`“Subhuti, what do you think? Does the Tathagata possess the fleshly eye?”
Subhuti replied: “Blessed One, it is so. The Tathagata possesses the fleshly eye.”
The Blessed One said: “Subhuti, what do you think? Does the Tathagata possess the divine eye?”
Subhuti replied: “Blessed One, it is so. The Tathagata possesses the divine eye.”
The Blessed One said: “Subhuti, what do you think? Does the Tathagata possess the wisdom eye?”
Subhuti replied: “Blessed One, it is so. The Tathagata possesses the wisdom eye.”
The Blessed One said: “Subhuti, what do you think? Does the Tathagata possess the Dharma eye?”
Subhuti replied: “Blessed One, it is so. The Tathagata possesses the Dharma eye.”
The Blessed One said: “Subhuti, what do you think? Does the Tathagata possess the Buddha eye?”
Subhuti replied: “Blessed One, it is so. The Tathagata possesses the Buddha eye.”`]}},{section:19,title:{english:"The Ungraspable Mind"},content:{english:[`The Blessed One said: “Subhuti, what do you think? If there were as many Ganges rivers as there are grains of sand in the river Ganges, and if there were as many chiliocosms as the grains of sand in all of those, would those chiliocosms be many?”
Subhuti replied: “Blessed One, it is so. Those chiliocosms would be many.”
The Blessed One said: “Subhuti, as many beings as there are in those chiliocosms, I fully know the stream of their various minds. For what reason? Subhuti, that which is called ‘the stream of mind, the stream of mind’ was taught by the Tathagata as no-stream; therefore, it is called ‘the stream of mind.’ For what reason? Subhuti, past mind cannot be apprehended, future mind cannot be apprehended, and present mind cannot be apprehended.”`]}},{section:20,title:{english:"Merit is Not Merit"},content:{english:[`“Subhuti, what do you think? If someone were to fill this trichiliocosm with the seven precious jewels and give it as a gift, would that son or daughter of good family thereby generate a great heap of merit?”
Subhuti replied: “Great, Blessed One. Great, Sugata.”
The Blessed One said: “Subhuti, it is just so. It is just so. That son or daughter of good family would thereby generate a great heap of merit. Furthermore, Subhuti, if a heap of merit existed, the Tathagata would not have said ‘heap of merit, heap of merit.’”`]}},{section:21,title:{english:"The Body is No-Body"},content:{english:[`“Subhuti, what do you think? Is the Tathagata to be seen by the perfection of his form-body?”
Subhuti replied: “No indeed, Blessed One. The Tathagata is not to be seen by the perfection of his form-body. For what reason? Blessed One, that which is called the ‘perfection of the form-body’ was taught by the Tathagata as no-perfection; therefore, it is called the ‘perfection of the form-body.’”`]}},{section:22,title:{english:"There is Nothing to be Said"},content:{english:[`“Subhuti, what do you think? Is the Tathagata to be seen by the perfection of his marks?”
Subhuti replied: “No indeed, Blessed One. The Tathagata is not to be seen by the perfection of his marks. For what reason? That perfection of marks which was taught by the Tathagata was taught by the Tathagata as no-perfection of marks; therefore, it is called the ‘perfection of marks.’”`]}},{section:23,title:{english:"Beings are Not Beings"},content:{english:[`The Blessed One said: “Subhuti, what do you think? Does it occur to the Tathagata, ‘I have taught the Dharma’?”
Subhuti replied: “No indeed, Blessed One. It does not occur to the Tathagata, ‘I have taught the Dharma.’”
The Blessed One said: “Subhuti, whoever would say, ‘The Tathagata has taught the Dharma,’ would be speaking falsely. They would be slandering me by wrongly grasping. For what reason? ‘A teaching of the Dharma, a teaching of the Dharma,’ Subhuti, is a dharma that cannot be apprehended as a teaching of the Dharma.”
Then, the Venerable Subhuti spoke these words to the Blessed One: “Blessed One, in the future, will there be any beings who, upon hearing a teaching of this kind, will truly believe?”
The Blessed One said: “Subhuti, they are not beings, and they are not non-beings. For what reason? Subhuti, those who are called ‘beings’ were taught by the Tathagata as no-beings; therefore, they are called ‘beings.’”`]}},{section:24,title:{english:"Awakening is Not Attainable"},content:{english:[`“Subhuti, what do you think? Is there any dharma that the Tathagata fully awakened to as unexcelled, perfect, and complete awakening?”
The Venerable Subhuti replied: “No indeed, Blessed One. There is no dharma whatsoever that the Tathagata fully awakened to as unexcelled, perfect, and complete awakening.”
The Blessed One said: “It is just so, Subhuti, it is just so. Not even the slightest dharma is found or perceived therein. Therefore, it is called ‘unexcelled, perfect, and complete awakening.’”`]}},{section:25,title:{english:"The Equality of All Things"},content:{english:["“Furthermore, Subhuti, that dharma is equal; there is nothing unequal in it. Therefore, it is called ‘unexcelled, perfect, and complete awakening.’ Through no-self, no-being, no-life, and no-person, that equal unexcelled, perfect, and complete awakening is fully realized by means of all wholesome dharmas. For what reason? ‘Wholesome dharmas, wholesome dharmas,’ Subhuti, were taught by the Tathagata as no-dharmas; therefore, they are called ‘wholesome dharmas.’”"]}},{section:26,title:{english:"The Dharmakāya is Beyond Form and Sound"},content:{english:["“Furthermore, Subhuti, if a son or daughter of good family were to take heaps of the seven precious jewels as numerous as all the Mount Merus in the trichiliocosm and give them as a gift, and if another were to take from this Perfection of Wisdom, from this Dharma discourse, even so much as a four-line verse, and teach it to others, this latter heap of merit, Subhuti, compared to the former heap of merit, would not approach one-hundredth part, up to the point where it would not withstand any comparison.”","“Subhuti, what do you think? Does it occur to the Tathagata, ‘I have liberated beings’? You should not see it that way, Subhuti. For what reason? There is no being whatsoever that has been liberated by the Tathagata. If there were any being that had been liberated by the Tathagata, that would itself be for the Tathagata a grasping at a self, a grasping at a being, a grasping at a life, and a grasping at a person. ‘Grasping at a self,’ Subhuti, is spoken of by the Tathagata as no-grasping, yet it is grasped by ordinary, childish beings. ‘Ordinary, childish beings,’ Subhuti, were taught by the Tathagata as no-beings; therefore, they are called ‘ordinary, childish beings.’”"]}},{section:27,title:{english:"No Annihilation"},content:{english:[`“Subhuti, what do you think? Is the Tathagata to be seen by the perfection of marks?”
Subhuti replied: “No indeed, Blessed One. As I understand the meaning of what the Blessed One has taught, the Tathagata is not to be seen by the perfection of marks.”
The Blessed One said: “Excellent, excellent, Subhuti! It is just so, Subhuti. It is just as you say. The Tathagata is not to be seen by the perfection of marks. For what reason? Subhuti, if the Tathagata were to be seen by the perfection of marks, then a wheel-turning king would also be a Tathagata. Therefore, the Tathagata is not to be seen by the perfection of marks.”
The Venerable Subhuti spoke these words to the Blessed One: “As I understand the meaning of what the Blessed One has taught, the Tathagata is not to be seen by the perfection of marks.”
Then, at that time, the Blessed One spoke these verses:`,`“Those who saw me by my form,
And those who knew me by my voice,
Have entered upon a mistaken path;
Such people will not see me.`,`The Buddhas are to be seen from the Dharma;
The guides have the Dharma-body.
And since the nature of Dharma is not to be known,
It cannot be perceived.”`]}},{section:28,title:{english:"Merit Not to be Grasped"},content:{english:["“Subhuti, what do you think? If you think that the Tathagata fully and perfectly awakened to unexcelled, perfect, and complete awakening through the perfection of marks, you should not see it that way, Subhuti. The Tathagata did not fully and perfectly awaken to unexcelled, perfect, and complete awakening through the perfection of marks. Subhuti, if you were to think that those who have correctly entered the Bodhisattva vehicle speak of the destruction or annihilation of any dharma, you should not see it that way, Subhuti. Those who have correctly entered the Bodhisattva vehicle do not speak of the destruction or annihilation of any dharma.”",`“Furthermore, Subhuti, if a son or daughter of good family were to fill chiliocosms as numerous as the grains of sand in the river Ganges with the seven precious jewels and give them as a gift, and if a Bodhisattva gains forbearance in the awareness that all dharmas are selfless and unborn, this latter one would, from that cause, generate a far greater, innumerable, and immeasurable heap of merit. Furthermore, Subhuti, a Bodhisattva should not grasp at a heap of merit.”
The Venerable Subhuti asked: “Blessed One, should a Bodhisattva not grasp at a heap of merit?”
The Blessed One said: “Subhuti, it should be grasped, yet not wrongly grasped; therefore, it is said ‘to be grasped.’”`]}},{section:29,title:{english:"Beyond Action"},content:{english:["“Furthermore, Subhuti, if someone were to say that the Tathagata goes or comes, stands, sits, or lies down, that person does not understand the meaning of my teaching. For what reason? ‘Tathagata,’ Subhuti, is one who has not gone anywhere, nor come from anywhere. Therefore, he is called ‘Tathagata, Arhat, Perfectly and Completely Awakened One.’”"]}},{section:30,title:{english:"Worlds are Not Worlds"},content:{english:[`“Furthermore, Subhuti, if a son or daughter of good family were to take all the particles of earth in the trichiliocosm and grind them into a collection of fine atoms like this, what do you think, Subhuti? Would that collection of fine atoms be great?”
Subhuti replied: “Blessed One, it would be so. That collection of fine atoms would be great. For what reason? Blessed One, if a collection of fine atoms existed, the Blessed One would not have spoken of a ‘collection of fine atoms.’ For what reason? That which was spoken of by the Blessed One as a ‘collection of fine atoms’ was taught by the Tathagata as no-collection; therefore, it is called a ‘collection of fine atoms.’ That which was spoken of by the Tathagata as the ‘trichiliocosm’ was taught by the Tathagata as no-system; therefore, it is called the ‘trichiliocosm.’ For what reason? Blessed One, if a chiliocosm existed, that would itself be a grasping at a solid entity. That which was taught by the Tathagata as a ‘grasping at a solid entity’ was taught by the Tathagata as no-grasping; therefore, it is called a ‘grasping at a solid entity.’”
The Blessed One said: “Subhuti, this ‘grasping at a solid entity’ is itself a mere convention. That dharma is inexpressible, yet it is grasped by ordinary, childish beings.”`]}},{section:31,title:{english:"Views are No-Views"},content:{english:[`“Subhuti, if someone were to say, ‘The Tathagata taught a view of a self, the Tathagata taught a view of a being, a view of a life, and a view of a person,’ would that one be speaking correctly?”
Subhuti replied: “Blessed One, it is not so. Sugata, it is not so. For what reason? Blessed One, that which was taught by the Tathagata as a ‘view of a self’ was taught by the Tathagata as no-view; therefore, it is called a ‘view of a self.’”
The Blessed One said: “Subhuti, one who has correctly entered the Bodhisattva vehicle should thus know all dharmas, see them, and have faith in them. They should know them, see them, and have faith in such a way that they do not abide even in the perception of a dharma. For what reason? ‘A perception of a dharma, a perception of a dharma,’ Subhuti, was taught by the Tathagata as no-perception; therefore, it is called a ‘perception of a dharma.’”`]}},{section:32,title:{english:"The Final Verse and Conclusion"},content:{english:["“Furthermore, Subhuti, if a Bodhisattva, a great being, were to fill immeasurable and innumerable chiliocosms with the seven precious jewels and give them as a gift, and if a son or daughter of good family were to take from this Perfection of Wisdom, having written down even so much as a four-line verse, hold it, maintain it, read it, master it, and correctly and thoroughly teach it to others, this latter one would, from that cause, generate a far greater, innumerable, and immeasurable heap of merit. And how should one teach it? One should teach it in such a way that one does not teach. Thus, it is called ‘to teach correctly and thoroughly.’",`Like a star, mirage, a lamp
Illusion, dew drops, bubbles and
A Dream, or lightning or like clouds
All compounded things regard.”`,"After the Blessed One had spoken thus, the Elder Subhuti, and those monks, and those Bodhisattvas, and the four-fold assembly of monks, nuns, laymen, and laywomen, and the world with its gods, humans, asuras, and gandharvas, rejoiced and highly praised what the Blessed One had said.","The Mahāyāna Sūtra called ‘The Noble Perfection of Wisdom, the Vajra-Cutter’ is complete.","Namo Bhagavate Prajñāpāramitāye! Oṃ naditadyathā: iliśi iliśi, miliśi miliśi, bhinayan bhinayan. Namo Bhagavate Pratyaṃprati: iriti iriti, miriti miriti, śuriti śuriti, uśuri uśuri, bhuyuye bhuyuye svāhā!","By reciting this heart-mantra of the Vajra-Cutter once, it becomes equal to reading the Vajra-Cutter nineteen thousand times.","Ye dharmā hetuprabhavā hetuṃ teṣāṃ tathāgato hyavadat, teṣāṃ ca yo nirodha evaṃ vādī mahāśramaṇaḥ svāhā."]}}];var Dy=[{section:0,title:{tibetan:"འཕགས་པ་ཤེས་རབ་ཀྱི་ཕ་རོལ་ཏུ་ཕྱིན་པ་རྡོ་རྗེ་གཅོད་པ།"},content:{tibetan:[`རྒྱ་གར་སྐད་དུ། ཨཱརྻ་བཛྲ་ཙྪེ་ད་ཀ་པྲཛྙཱ་པ་ར་མི་ཏ་ནཱ་མ་མ་ཧཱ་ཡ་ན་སཱུ་ཏྲ།
བོད་སྐད་དུ། འཕགས་པ་ཤེས་རབ་ཀྱི་ཕ་རོལ་ཏུ་ཕྱིན་པ་རྡོ་རྗེ་གཅོད་པ་ཞེས་བྱ་བ་ཐེག་པ་ཆེན་པོའི་མདོ། །`,"སངས་རྒྱས་དང་བྱང་ཆུབ་སེམས་དཔའ་ཐམས་ཅད་ལ་ཕྱག་འཚལ་ལོ། །"]}},{section:1,title:{},content:{tibetan:["འདི་སྐད་བདག་གིས་ཐོས་པ་དུས་གཅིག་ན། བཅོམ་ལྡན་འདས་མཉན་ཡོད་ན་རྒྱལ་བུ་རྒྱལ་བྱེད་ཀྱི་ཚལ་མགོན་མེད་ཟས་སྦྱིན་གྱི་ཀུན་དགའ་ར་བ་ན། དགེ་སློང་སྟོང་ཉིས་བརྒྱ་ལྔ་བཅུའི་དགེ་སློང་གི་དགེ་འདུན་ཆེན་པོ་དང༌། བྱང་ཆུབ་སེམས་དཔའ་སེམས་དཔའ་ཆེན་པོ་རབ་ཏུ་མང་པོ་དག་དང་ཐབས་གཅིག་ཏུ་བཞུགས་སོ། །དེ་ནས་བཅོམ་ལྡན་འདས་སྔ་དྲོའི་དུས་ཀྱི་ཚེ། ཤམ་ཐབས་དང་ཆོས་གོས་སྐུ་ལ་གསོལ་ཏེ། ལྷུང་བཟེད་བསྣམས་ནས་མཉན་ཡོད་ཀྱི་གྲོང་ཁྱེར་ཆེན་པོར་བསོད་སྙོམས་ཀྱི་ཕྱིར་གཤེགས་སོ། །དེ་ནས་བཅོམ་ལྡན་འདས་མཉན་ཡོད་ཀྱི་གྲོང་ཁྱེར་ཆེན་པོར་བསོད་སྙོམས་ཀྱི་ཕྱིར་གཤེགས་ནས་ཞལ་ཟས་གསོལ་ཏེ་ཟས་ཀྱི་བྱ་བ་མཛད་དེ། ཟས་ཕྱི་མའི་བསོད་སྙོམས་སྤངས་ནས་ལྷུང་བཟེད་དང་ཆོས་གོས་བཞག་ནས། ཞབས་བསིལ་ཏེ་གདན་བཤམས་པ་ལ་སྐྱིལ་མོ་ཀྲུང་བཅས་ནས་སྐུ་དྲང་པོར་བསྲངས་ཏེ། དྲན་པ་མངོན་དུ་བཞག་ནས་བཞུགས་སོ། །དེ་ནས་དགེ་སློང་མང་པོས་བཅོམ་ལྡན་འདས་ག་ལ་བ་དེར་དོང་སྟེ་ལྷགས་ནས། བཅོམ་ལྡན་འདས་ཀྱི་ཞབས་ལ་མགོ་བོས་ཕྱག་འཚལ་ཏེ་ལན་གསུམ་བསྐོར་བ་བྱས་ནས་ཕྱོགས་གཅིག་ཏུ་འཁོད་དོ། །"]}},{section:2,title:{},content:{tibetan:["ཡང་དེའི་ཚེ་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་འཁོར་དེ་ཉིད་དུ་འདུས་པར་གྱུར་ཏེ་འདུག་གོ །དེ་ནས་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་སྟན་ལས་ལངས་ཏེ་བླ་གོས་ཕྲག་པ་གཅིག་ཏུ་གཟར་ནས་པུས་མོ་གཡས་པའི་ལྷ་ང་ས་ལ་བཙུགས་ཏེ། བཅོམ་ལྡན་འདས་ག་ལ་བ་དེར་ལོགས་སུ་ཐལ་མོ་སྦྱར་བ་བཏུད་ནས། བཅོམ་ལྡན་འདས་ལ་འདི་སྐད་ཅེས་གསོལ་ཏོ། །བཅོམ་ལྡན་འདས་དེ་བཞིན་གཤེགས་པ་དགྲ་བཅོམ་པ་ཡང་དག་པར་རྫོགས་པའི་སངས་རྒྱས་ཀྱིས་བྱང་ཆུབ་སེམས་དཔའ་སེམས་དཔའ་ཆེན་པོ་རྣམས་ལ་ཕན་གདགས་པའི་དམ་པ་ཇི་སྙེད་པས་ཕན་གདགས་པ་དང༌། དེ་བཞིན་གཤེགས་པས་བྱང་ཆུབ་སེམས་དཔའ་སེམས་དཔའ་ཆེན་པོ་རྣམས་ལ་ཡོངས་སུ་གཏད་པའི་དམ་པ་ཇི་སྙེད་པས་ཡོངས་སུ་གཏད་པ་ནི། བཅོམ་ལྡན་འདས་ངོ་མཚར་ལགས་སོ། །བདེ་བར་གཤེགས་པ་ངོ་མཚར་ལགས་སོ། །བཅོམ་ལྡན་འདས་བྱང་ཆུབ་སེམས་དཔའི་ཐེག་པ་ལ་ཡང་དག་པར་ཞུགས་པས་ཇི་ལྟར་གནས་པར་བགྱི། ཇི་ལྟར་བསྒྲུབ་པར་བགྱི། ཇི་ལྟར་སེམས་རབ་ཏུ་བཟུང་བར་བགྱི། དེ་སྐད་ཅེས་གསོལ་བ་དང༌། བཅོམ་ལྡན་འདས་ཀྱིས་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་ལ་འདི་སྐད་ཅེས་བཀའ་སྩལ་ཏོ། །རབ་འབྱོར་ལེགས་སོ་ལེགས་སོ། །རབ་འབྱོར་དེ་དེ་བཞིན་ནོ། །དེ་དེ་བཞིན་ཏེ། དེ་བཞིན་གཤེགས་པས་བྱང་ཆུབ་སེམས་དཔའ་སེམས་དཔའ་ཆེན་པོ་རྣམས་ལ་ཕན་གདགས་པའི་དམ་པས་ཕན་གདགས་སོ།། དེ་བཞིན་གཤེགས་པས་བྱང་ཆུབ་སེམས་དཔའ་སེམས་དཔའ་ཆེན་པོ་རྣམས་ལ་ཡོངས་སུ་གཏད་པའི་དམ་པས་ཡོངས་སུ་གཏད་དོ། །རབ་འབྱོར་དེའི་ཕྱིར་ཉོན་ལ་ལེགས་པར་རབ་ཏུ་ཡིད་ལ་ཟུངས་ཤིག་དང༌། བྱང་ཆུབ་སེམས་དཔའི་ཐེག་པ་ལ་ཡང་དག་པར་ཞུགས་པས་ཇི་ལྟར་གནས་པར་བྱ་བ་དང༌། ཇི་ལྟར་བསྒྲུབ་པར་བྱ་བ་དང༌། ཇི་ལྟར་སེམས་རབ་ཏུ་བཟུང་བར་བྱ་བ་ངས་ཁྱོད་ལ་བཤད་དོ། །བཅོམ་ལྡན་འདས་དེ་དེ་བཞིན་ནོ། །ཞེས་གསོལ་ནས། ཚེ་དང་ལྡན་པ་རབ་འབྱོར་བཅོམ་ལྡན་འདས་ཀྱི་ལྟར་མཉན་པ་དང༌།"]}},{section:3,title:{},content:{tibetan:["བཅོམ་ལྡན་འདས་ཀྱིས་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་ལ་འདི་སྐད་ཅེས་བཀའ་སྩལ་ཏོ། །རབ་འབྱོར་འདི་ལ་བྱང་ཆུབ་སེམས་དཔའི་ཐེག་པ་ལ་ཡང་དག་པར་ཞུགས་པས། འདི་སྙམ་དུ་བདག་གིས་སེམས་ཅན་ཇི་ཙམ་སེམས་ཅན་དུ་བསྡུ་བས་བསྡུས་པ། སྒོ་ང་ལས་སྐྱེས་པའམ། མངལ་ལས་སྐྱེས་པའམ། དྲོད་གཤེར་ལས་སྐྱེས་པའམ། རྫུས་ཏེ་སྐྱེས་པའམ། གཟུགས་ཅན་ནམ། གཟུགས་ཅན་མ་ཡིན་པའམ། འདུ་ཤེས་ཅན་ནམ། འདུ་ཤེས་མེད་འདུ་ཤེས་མེད་མིན་ནམ། སེམས་ཅན་གྱི་ཁམས་ཇི་ཙམ་སེམས་ཅན་དུ་གདགས་པའི་བརྟགས་པ་དེ་དག་ཐམས་ཅད་ཕུང་པོ་ལྷག་མ་མེད་པའི་མྱ་ངན་ལས་འདས་པའི་དབྱིངས་སུ་ཡོངས་སུ་མྱ་ངན་ལས་འདའོ། །དེ་ལྟར་སེམས་ཅན་ཚད་མེད་པ་ཡོངས་སུ་མྱ་ངན་ལས་འདས་ཀྱང༌། སེམས་ཅན་གང་ཡང་ཡོངས་སུ་མྱ་ངན་ལས་འདས་པར་འགྱུར་བ་མེད་དོ་སྙམ་དུ་སེམས་བསྐྱེད་པར་བྱའོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་གལ་ཏེ་བྱང་ཆུབ་སེམས་དཔའ་སེམས་ཅན་དུ་འདུ་ཤེས་འཇུག་ན། དེ་བྱང་ཆུབ་སེམས་དཔའ་ཞེས་མི་བྱ་བའི་ཕྱིར་རོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་གང་སེམས་ཅན་དུ་འདུ་ཤེས་འཇུག་གམ། སྲོག་ཏུ་འདུ་ཤེས་འཇུག་གམ། གང་ཟག་ཏུ་འདུ་ཤེས་འཇུག་ན། དེ་བྱང་ཆུབ་སེམས་དཔའ་ཞེས་མི་བྱ་བའི་ཕྱིར་རོ། །"]}},{section:4,title:{},content:{tibetan:["ཡང་རབ་འབྱོར་བྱང་ཆུབ་སེམས་དཔའ་དངོས་པོ་ལ་མི་གནས་པར་སྦྱིན་པ་བྱིན་པར་བྱའོ། །ཅི་ལ་ཡང་མི་གནས་པར་སྦྱིན་པ་བྱིན་པར་བྱའོ། །གཟུགས་ལ་ཡང་མི་གནས་པར་སྦྱིན་པ་བྱིན་པར་བྱའོ། །དེ་བཞིན་དུ་སྒྲ་དང༌། དྲི་དང་རོ་དང༌། རེག་བྱ་དང༌། ཆོས་ལ་ཡང་མི་གནས་པར་སྦྱིན་པ་བྱིན་པར་བྱའོ། །རབ་འབྱོར་ཅི་ནས་ཀྱང་མཚན་མར་འདུ་ཤེས་པ་ལ་ཡང་མི་གནས་པར་དེ་ལྟར་བྱང་ཆུབ་སེམས་དཔས་སྦྱིན་པ་བྱིན་ནོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་བྱང་ཆུབ་སེམས་དཔས་གང་མི་གནས་པར་སྦྱིན་པ་བྱིན་པ་དེའི་བསོད་ནམས་ཀྱི་ཕུང་པོ་ནི། རབ་འབྱོར་ཚད་གཟུང་བར་སླ་བ་མ་ཡིན་པའི་ཕྱིར་རོ། །རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། ཤར་ཕྱོགས་ཀྱི་ནམ་མཁའི་ཚད་གཟུང་བར་སླ་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་ནི་མ་ལགས་སོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་དེ་བཞིན་དུ་ལྷོ་དང༌། ནུབ་དང༌། བྱང་དང༌། སྟེང་དང༌། འོག་གི་ཕྱོགས་དང༌། ཕྱོགས་མཚམས་དང༌། ཕྱོགས་བཅུའི་ནམ་མཁའི་ཚད་བཟུང་བར་སླ་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་ནི་མ་ལགས་སོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་དེ་བཞིན་དུ་བྱང་ཆུབ་སེམས་དཔའ་གང་ལ་ཡང་མི་གནས་པར་སྦྱིན་པ་བྱིན་པ་དེའི་བསོད་ནམས་ཀྱི་ཕུང་པོ་ནི། རབ་འབྱོར་ཚད་བཟུང་བར་སླ་བ་མ་ཡིན་པའི་ཕྱིར་རོ། །"]}},{section:5,title:{},content:{tibetan:["རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། མཚན་ཕུན་སུམ་ཚོགས་པས་དེ་བཞིན་གཤེགས་པར་བལྟ་བར་བྱ་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་ནི་མ་ལགས་སོ། །མཚན་ཕུན་སུམ་ཚོགས་པས་དེ་བཞིན་གཤེགས་པར་བལྟ་བར་མི་བགྱི་ལགས་སོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། དེ་བཞིན་གཤེགས་པས་མཚན་ཕུན་སུམ་ཚོགས་པ་ཞེས་གང་གསུངས་པ་དེ་ཉིད། མཚན་ཕུན་སུམ་ཚོགས་པ་མ་མཆིས་པའི་སླད་དུའོ། །དེ་སྐད་ཅེས་གསོལ་པ་དང༌། བཅོམ་ལྡན་འདས་ཀྱིས་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་ལ་འདི་སྐད་ཅེས་བཀའ་སྩལ་ཏོ། །རབ་འབྱོར་ཇི་ཙམ་དུ་མཚན་ཕུན་སུམ་ཚོགས་པ་དེ་ཙམ་དུ་བརྫུན་ནོ། །ཇི་ཙམ་དུ་མཚན་ཕུན་སུམ་ཚོགས་པ་མེད་པ་དེ་ཙམ་དུ་མི་བརྫུན་ཏེ། དེ་ལྟར་ན་དེ་བཞིན་གཤེགས་པ་ལ་མཚན་དང་མཚན་མ་མེད་པར་བལྟའོ། །"]}},{section:6,title:{},content:{tibetan:["དེ་སྐད་ཅེས་བཀའ་སྩལ་པ་དང༌། བཅོམ་ལྡན་འདས་ལ་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་གྱིས་འདི་སྐད་ཅེས་གསོལ་ཏོ། །བཅོམ་ལྡན་འདས་མ་འོངས་པའི་དུས་ལྔ་བརྒྱའི་ཐ་མ་ལ། དམ་པའི་ཆོས་རབ་ཏུ་རྣམ་པར་འཇིག་པར་འགྱུར་བ་ན་སེམས་ཅན་གང་ལ་ལ་དག་འདི་ལྟ་བུའི་མདོ་སྡེའི་ཚིག་བཤད་པ་དག་ལ་ཡང་དག་པར་འདུ་ཤེས་བསྐྱེད་པར་འགྱུར་བ་འབྱུང་བ་ལྟ་མཆིས་ལགས་སམ། བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་གང་ཁྱོད་འདི་སྐད་དུ་མ་འོངས་པའི་དུས་ལྔ་བརྒྱའི་ཐ་མ་ལ། དམ་པའི་ཆོས་རབ་ཏུ་རྣམ་པར་འཇིག་པར་འགྱུར་བ་ན། སེམས་ཅན་གང་ལ་ལ་དག་འདི་ལྟ་བུའི་མདོ་སྡེའི་ཚིག་བཤད་པ་དག་ལ་ཡང་དག་པར་འདུ་ཤེས་བསྐྱེད་པར་འགྱུར་བ་འབྱུང་བ་ལྟ་མཆིས་ལགས་སམ་ཞེས་ཁྱོད་དེ་སྐད་མ་ཟེར་ཅིག། རབ་འབྱོར་མ་འོངས་པའི་དུས་ལྔ་བརྒྱའི་ཐ་མ་ལ་དམ་པའི་ཆོས་རབ་ཏུ་རྣམ་པར་འཇིག་པར་འགྱུར་བ་ན། བྱང་ཆུབ་སེམས་དཔའ་སེམས་དཔའ་ཆེན་པོ་ཚུལ་ཁྲིམས་དང་ལྡན་པ། ཡོན་ཏན་དང་ལྡན་པ། ཤེས་རབ་དང་ལྡན་པ་དག་འབྱུང་སྟེ། རབ་འབྱོར་བྱང་ཆུབ་སེམས་དཔའ་སེམས་དཔའ་ཆེན་པོ་དེ་དག་ཀྱང་སངས་རྒྱས་གཅིག་ལ་བསྙེན་བཀུར་བྱས་པ་མ་ཡིན། སངས་རྒྱས་གཅིག་ལ་དགེ་བའི་རྩ་བ་བསྐྱེད་པ་མ་ཡིན་གྱི། རབ་འབྱོར་སངས་རྒྱས་འབུམ་ཕྲག་དུ་མ་ལ་བསྙེན་བཀུར་བྱས་ཤིང་སངས་རྒྱས་འབུམ་ཕྲག་དུ་མ་ལ་དགེ་བའི་རྩ་བ་དག་བསྐྱེད་པའི་བྱང་ཆུབ་སེམས་དཔའ་སེམས་དཔའ་ཆེན་པོ་དེ་དག་འབྱུང་ངོ། །རབ་འབྱོར་གང་དག་འདི་ལྟ་བུའི་མདོ་སྡེའི་བཤད་པ་དག་ལ་སེམས་དད་པ་གཅིག་ཙམ་རྙེད་པར་འགྱུར་བ་དེ་དག་ནི། དེ་བཞིན་གཤེགས་པས་མཁྱེན་ཏོ། རབ་འབྱོར་དེ་དག་ནི་དེ་བཞིན་གཤེགས་པས་གཟིགས་ཏེ། རབ་འབྱོར་སེམས་ཅན་དེ་དག་ཐམས་ཅད་ནི་བསོད་ནམས་ཀྱི་ཕུང་པོ་དཔག་ཏུ་མེད་པ་བསྐྱེད་ཅིང་ཡོངས་སུ་སྡུད་པར་འགྱུར་རོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་བྱང་ཆུབ་སེམས་དཔའ་སེམས་དཔའ་ཆེན་པོ་དེ་དག་ནི། བདག་ཏུ་འདུ་ཤེས་འཇུག་པར་མི་འགྱུར་ཞིང༌། སེམས་ཅན་དུ་འདུ་ཤེས་པ་མ་ཡིན། སྲོག་ཏུ་འདུ་ཤེས་པ་མ་ཡིན། གང་ཟག་ཏུ་འདུ་ཤེས་འཇུག་པར་མི་འགྱུར་བའི་ཕྱིར་རོ། །རབ་འབྱོར་བྱང་ཆུབ་སེམས་དཔའ་སེམས་དཔའ་ཆེན་པོ་དེ་དག་ཀྱང་ཆོས་སུ་འདུ་ཤེས་པ་དང༌། ཆོས་མེད་པར་ཡང་འདུ་ཤེས་མི་འཇུག་སྟེ། དེ་དག་ནི་འདུ་ཤེས་མེད་པར་ཡང་འཇུག་པར་མི་འགྱུར་རོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་གལ་ཏེ་བྱང་ཆུབ་སེམས་དཔའ་སེམས་དཔའ་ཆེན་པོ་དེ་དག་ནི། ཆོས་སུ་འདུ་ཤེས་འཇུག་ན་ཡང་དེ་ཉིད་དེ་དག་གིས་བདག་ཏུ་འཛིན་པར་འགྱུར་ཞིང༌། སེམས་ཅན་དུ་འཛིན་པ་དང༌། སྲོག་ཏུ་འཛིན་པ་དང༌། གང་ཟག་ཏུ་འཛིན་པར་འགྱུར་བའི་ཕྱིར་རོ། །གལ་ཏེ་ཆོས་བདག་མེད་པར་འདུ་ཤེས་འཇུག་ན་ཡང་དེ་ཉིད་དེ་དག་གིས་བདག་ཏུ་འཛིན་པར་འགྱུར་ཞིང༌། སེམས་ཅན་དུ་འཛིན་པ་དང༌། སྲོག་ཏུ་འཛིན་པ་དང༌། གང་ཟག་ཏུ་འཛིན་པར་འགྱུར་བའི་ཕྱིར་རོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་བྱང་ཆུབ་སེམས་དཔའ་ཆོས་ཀྱང་ལོག་པར་བཟུང་བར་མི་བྱ་སྟེ། ཆོས་མ་ཡིན་པ་ཡང་མི་བཟུང་བའི་ཕྱིར་རོ། །དེ་བས་ན་དེ་ལས་དགོངས་ཏེ་དེ་བཞིན་གཤེགས་པས་ཆོས་ཀྱི་རྣམ་གྲངས་འདི་གཟིངས་ལྟ་བུར་ཤེས་པ་རྣམས་ཀྱིས་ཆོས་རྣམས་ཀྱང་སྤང་བར་བྱ་ན། ཆོས་མ་ཡིན་པ་རྣམས་ལྟ་ཅི་སྨོས་ཞེས་གསུངས་སོ། །"]}},{section:7,title:{},content:{tibetan:["གཞན་ཡང་བཅོམ་ལྡན་འདས་ཀྱིས་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་ལ་འདི་སྐད་ཅེས་བཀའ་སྩལ་ཏོ། །རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། དེ་བཞིན་གཤེགས་པས་གང་བླ་ན་མེད་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་ཏུ་མངོན་པར་རྫོགས་པར་སངས་རྒྱས་པའི་ཆོས་དེ་གང་ཡང་ཡོད་སྙམ་མམ། དེ་བཞིན་གཤེགས་པས་ཆོས་དེ་གང་ཡང་བསྟན་སྙམ་མམ། དེ་སྐད་ཅེས་བཀའ་སྩལ་པ་དང༌། བཅོམ་ལྡན་འདས་ལ་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་གྱིས་འདི་སྐད་ཅེས་གསོལ་ཏོ། །བཅོམ་ལྡན་འདས་བདག་གིས་བཅོམ་ལྡན་འདས་ཀྱིས་གསུངས་པའི་དོན་འཚལ་བ་ལྟར་ན། དེ་བཞིན་གཤེགས་པས་གང་བླ་ན་མེད་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་ཏུ་མངོན་པར་རྫོགས་པར་སངས་རྒྱས་པའི་ཆོས་དེ་གང་ཡང་མ་མཆིས་ལགས་སོ། །དེ་བཞིན་གཤེགས་པས་བསྟན་པའི་ཆོས་དེ་གང་ཡང་མ་མཆིས་ལགས་སོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། དེ་བཞིན་གཤེགས་པས་ཆོས་དེ་གང་ཡང་མངོན་པར་རྫོགས་པར་སངས་རྒྱས་པའམ། བསྟན་པ་དེ་ནི་གཟུང་དུ་མ་མཆིས་བརྗོད་དུ་མ་མཆིས་ཏེ། དེ་ནི་ཆོས་ཀྱང་མ་ལགས་ཆོས་མ་མཆིས་པ་ཡང་མ་ལགས་པའི་སླད་དུའོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། འཕགས་པའི་གང་ཟག་རྣམས་ནི་འདུས་མ་བྱས་ཀྱིས་རབ་ཏུ་ཕྱེ་བའི་སླད་དུའོ། །"]}},{section:8,title:{},content:{tibetan:["བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། རིགས་ཀྱི་བུའམ། རིགས་ཀྱི་བུ་མོ་གང་ལ་ལ་ཞིག་གིས་སྟོང་གསུམ་གྱི་སྟོང་ཆེན་པོའི་འཇིག་རྟེན་གྱི་ཁམས་འདི་རིན་པོ་ཆེ་སྣ་བདུན་གྱིས་རབ་ཏུ་གང་བར་བྱས་ཏེ་སྦྱིན་པ་བྱིན་ན། རིགས་ཀྱི་བུའམ། རིགས་ཀྱི་བུ་མོ་དེ་གཞི་དེ་ལས་བསོད་ནམས་ཀྱི་ཕུང་པོ་མང་དུ་བསྐྱེད་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་མང་ལགས་སོ། །བདེ་བར་གཤེགས་པ་མང་ལགས་སོ། །རིགས་ཀྱི་བུའམ། རིགས་ཀྱི་བུ་མོ་དེ་དེའི་གཞི་ལས་བསོད་ནམས་ཀྱི་ཕུང་པོ་མང་དུ་བསྐྱེད་དོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། བསོད་ནམས་ཀྱི་ཕུང་པོ་དེ་ཉིད་ཕུང་པོ་མ་མཆིས་པའི་སླད་དུ་སྟེ། དེ་བས་ན་དེ་བཞིན་གཤེགས་པས་བསོད་ནམས་ཀྱི་ཕུང་པོ་བསོད་ནམས་ཀྱི་ཕུང་པོ་ཞེས་གསུངས་སོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་རིགས་ཀྱི་བུའམ་རིགས་ཀྱི་བུ་མོ་གང་གིས་སྟོང་གསུམ་གྱི་སྟོང་ཆེན་པོའི་འཇིག་རྟེན་གྱི་ཁམས་འདི་རིན་པོ་ཆེ་སྣ་བདུན་གྱིས་རབ་ཏུ་གང་བར་བྱས་ཏེ་སྦྱིན་པ་བྱིན་པ་བས། གང་གིས་ཆོས་ཀྱི་རྣམ་གྲངས་འདི་ལས་ཐ་ན་ཚིག་བཞི་པའི་ཚིགས་སུ་བཅད་པ་ཙམ་བཟུང་ནས་གཞན་དག་ལ་འཆད་ཅིང་ཡང་དག་པར་རབ་ཏུ་སྟོན་ན། གཞི་དེ་ལས་བསོད་ནམས་ཀྱི་ཕུང་པོ་ཆེས་མང་དུ་གྲངས་མེད་དཔག་ཏུ་མེད་པ་བསྐྱེད་དོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་དེ་བཞིན་གཤེགས་པ་དགྲ་བཅོམ་པ་ཡང་དག་པར་རྫོགས་པའི་སངས་རྒྱས་རྣམས་ཀྱི་བླ་ན་མེད་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་ནི་འདི་ལས་བྱུང་སྟེ། སངས་རྒྱས་བཅོམ་ལྡན་འདས་རྣམས་ཀྱང་འདི་ལས་སྐྱེས་པའི་ཕྱིར་རོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་སངས་རྒྱས་ཀྱི་ཆོས་རྣམས་སངས་རྒྱས་ཀྱི་ཆོས་རྣམས་ཞེས་བྱ་བ་ནི། སངས་རྒྱས་ཀྱི་ཆོས་དེ་དག་མེད་པར་དེ་བཞིན་གཤེགས་པས་གསུངས་པའི་ཕྱིར་ཏེ། དེས་ན་སངས་རྒྱས་ཀྱི་ཆོས་རྣམས་ཞེས་བྱའོ། །"]}},{section:9,title:{},content:{tibetan:["རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། རྒྱུན་དུ་ཞུགས་པ་འདི་སྙམ་དུ་བདག་གིས་རྒྱུན་དུ་ཞུགས་པའི་འབྲས་བུ་ཐོབ་བོ་སྙམ་དུ་སེམས་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་ནི་མ་ལགས་སོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། བཅོམ་ལྡན་འདས་དེ་ནི་ཅི་ལ་ཡང་ཞུགས་པ་མ་མཆིས་པའི་སླད་དུ་སྟེ། དེས་ན་རྒྱུན་དུ་ཞུགས་པ་ཞེས་བགྱིའོ། །གཟུགས་ལ་ཡང་མ་ཞུགས། སྒྲ་ལ་ཡང་མ་ལགས། དྲི་ལ་ཡང་མ་ལགས། རོ་ལ་ཡང་མ་ལགས། རེག་བྱ་ལ་ཡང་མ་ལགས། ཆོས་རྣམས་ལ་ཡང་མ་ཞུགས་ཏེ། དེས་ན་རྒྱུན་དུ་ཞུགས་པ་ཞེས་བགྱིའོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། བཅོམ་ལྡན་འདས་གལ་ཏེ་རྒྱུན་དུ་ཞུགས་པ་འདི་སྙམ་དུ་བདག་གིས་རྒྱུན་དུ་ཞུགས་པའི་འབྲས་བུ་ཐོབ་བོ་སྙམ་དུ་སེམས་པར་གྱུར་ན། དེ་ཉིད་དེའི་བདག་ཏུ་འཛིན་པར་འགྱུར་ལགས་སོ། །སེམས་ཅན་དུ་འཛིན་པ་དང༌། སྲོག་ཏུ་འཛིན་པ་དང༌། གང་ཟག་ཏུ་འཛིན་པར་འགྱུར་ལགས་སོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། ལན་ཅིག་ཕྱིར་འོང་བ་འདི་སྙམ་དུ་བདག་གིས་ལན་ཅིག་ཕྱིར་འོང་བའི་འབྲས་བུ་ཐོབ་བོ་སྙམ་དུ་སེམས་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་ནི་མ་ལགས་སོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། གང་ལན་ཅིག་ཕྱིར་འོང་བ་ཉིད་དུ་ཞུགས་པའི་ཆོས་དེ་གང་ཡང་མ་མཆིས་པའི་སླད་དུ་སྟེ། དེས་ན་ལན་ཅིག་ཕྱིར་འོང་བ་ཞེས་བགྱིའོ། །བཅོམ་ལྡན་འདས་གལ་ཏེ་ལན་ཅིག་ཕྱིར་འོང་བ་འདི་སྙམ་དུ་བདག་གིས་ལན་ཅིག་ཕྱིར་འོང་བའི་འབྲས་བུ་ཐོབ་བོ་སྙམ་དུ་སེམས་པར་གྱུར་ན། དེ་ཉིད་དེའི་བདག་ཏུ་འཛིན་པར་འགྱུར་ལགས་སོ། །སེམས་ཅན་དུ་འཛིན་པ་དང༌། སྲོག་ཏུ་འཛིན་པ་དང༌། གང་ཟག་ཏུ་འཛིན་པར་འགྱུར་ལགས་སོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། ཕྱིར་མི་འོང་བ་འདི་སྙམ་དུ་བདག་གིས་ཕྱིར་མི་འོང་བའི་འབྲས་བུ་ཐོབ་བོ་སྙམ་དུ་སེམས་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་ནི་མ་ལགས་སོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། གང་ཕྱིར་མི་འོང་བ་ཉིད་དུ་ཞུགས་པའི་ཆོས་དེ་གང་ཡང་མ་མཆིས་པའི་སླད་དུ་སྟེ། དེའི་ཕྱིར་ཕྱིར་མི་འོང་བ་ཞེས་བགྱིའོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། དགྲ་བཅོམ་པ་འདི་སྙམ་དུ་བདག་གིས་དགྲ་བཅོམ་པ་ཉིད་ཐོབ་བོ་སྙམ་དུ་སེམས་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་ནི་མ་ལགས་སོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། གང་དག་དགྲ་བཅོམ་པ་ཞེས་བགྱི་བའི་ཆོས་དེ་གང་ཡང་མ་མཆིས་པའི་སླད་དུའོ། །བཅོམ་ལྡན་འདས་གལ་ཏེ་དགྲ་བཅོམ་པ་འདི་སྙམ་དུ་བདག་གིས་དགྲ་བཅོམ་པ་ཉིད་ཐོབ་བོ་སྙམ་དུ་སེམས་པར་གྱུར་ན། དེ་ཉིད་དེའི་བདག་ཏུ་འཛིན་པར་འགྱུར་ལགས་སོ། །སེམས་ཅན་དུ་འཛིན་པ་དང༌། སྲོག་ཏུ་འཛིན་པ་དང༌། གང་ཟག་ཏུ་འཛིན་པར་འགྱུར་ལགས་སོ། །བཅོམ་ལྡན་འདས་བདག་ནི་དེ་བཞིན་གཤེགས་པ་དགྲ་བཅོམ་པ་ཡང་དག་པར་རྫོགས་པའི་སངས་རྒྱས་ཀྱིས་ཉོན་མོངས་པ་མེད་པར་གནས་པ་རྣམས་ཀྱི་མཆོག་ཏུ་བསྟན་ཏེ། བཅོམ་ལྡན་འདས་བདག་འདོད་ཆགས་དང་བྲལ་བ་དགྲ་བཅོམ་པ་ལགས་ཀྱང༌། བཅོམ་ལྡན་འདས་བདག་འདི་སྙམ་དུ་བདག་ནི་དགྲ་བཅོམ་པའོ་སྙམ་དུ་མི་སེམས་ལགས་སོ། །བཅོམ་ལྡན་འདས་གལ་ཏེ་འདི་སྙམ་དུ་བདག་གིས་དགྲ་བཅོམ་པ་ཉིད་ཐོབ་བོ་སྙམ་དུ་སེམས་པར་གྱུར་ན། དེ་བཞིན་གཤེགས་པས་བདག་ལ་རིགས་ཀྱི་བུ་རབ་འབྱོར་ནི་ཉོན་མོངས་པ་མེད་པར་གནས་པ་རྣམས་ཀྱི་མཆོག་ཡིན་ཏེ། ཅི་ལ་ཡང་མི་གནས་པས་ན་ཉོན་མོངས་པ་མེད་པར་གནས་པ་ཞེས་ལུང་མི་སྟོན་ལགས་སོ། །"]}},{section:10,title:{},content:{tibetan:["བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། དེ་བཞིན་གཤེགས་པས་དེ་བཞིན་གཤེགས་པ་དགྲ་བཅོམ་པ་ཡང་དག་པར་རྫོགས་པའི་སངས་རྒྱས་མར་མེ་མཛད་ལས་གང་བླངས་པའི་ཆོས་དེ་གང་ཡང་ཡོད་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་ནི་མ་ལགས་སོ། །དེ་བཞིན་གཤེགས་པས་དེ་བཞིན་གཤེགས་པ་དགྲ་བཅོམ་པ་ཡང་དག་པར་རྫོགས་པའི་སངས་རྒྱས་མར་མེ་མཛད་ལས་གང་བླངས་པའི་ཆོས་དེ་གང་ཡང་ཡོད་པ་ཡེ་མ་མཆིས་ལགས་སོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་བྱང་ཆུབ་སེམས་དཔའ་གང་ལ་ལ་ཞིག་འདི་སྐད་དུ་བདག་གིས་ཞིང་བཀོད་པ་རྣམས་སྒྲུབ་བོ་ཞེས་ཟེར་ན་དེ་མི་བདེན་པར་སྨྲའོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་ཞིང་བཀོད་པ་རྣམས་ཞིང་བཀོད་པ་རྣམས་ཞེས་བྱ་བ་ནི། བཀོད་པ་དེ་དག་མེད་པར་དེ་བཞིན་གཤེགས་པས་གསུངས་པའི་ཕྱིར་ཏེ། དེས་ན་ཞིང་བཀོད་པ་རྣམས་ཞེས་བྱའོ། །རབ་འབྱོར་དེ་ལྟ་བས་ན། བྱང་ཆུབ་སེམས་དཔའ་སེམས་དཔའ་ཆེན་པོས་འདི་ལྟར་མི་གནས་པར་སེམས་བསྐྱེད་པར་བྱ་སྟེ། ཅི་ལ་ཡང་མི་གནས་པར་སེམས་བསྐྱེད་པར་བྱའོ། །གཟུགས་ལ་ཡང་མི་གནས་པར་སེམས་བསྐྱེད་པར་བྱའོ། །སྒྲ་དང༌། དྲི་དང༌། རོ་དང༌། རེག་བྱ་དང༌། ཆོས་ལ་ཡང་མི་གནས་པར་སེམས་བསྐྱེད་པར་བྱའོ། །རབ་འབྱོར་འདི་ལྟ་སྟེ་དཔེར་ན་སྐྱེས་བུ་ཞིག་ལུས་འདི་ལྟ་བུར་གྱུར་ཏེ། འདི་ལྟ་སྟེ་རིའི་རྒྱལ་པོ་རི་རབ་ཙམ་དུ་གྱུར་ན། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། ལུས་དེ་ཆེ་བ་ཡིན་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་ལུས་དེ་ཆེ་བ་ལགས་སོ། །བདེ་བར་གཤེགས་པ་ལུས་དེ་ཆེ་བ་ལགས་སོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། དེ་བཞིན་གཤེགས་པས་དེ་དངོས་པོ་མ་མཆིས་པར་གསུངས་པའི་སླད་དུ་སྟེ། དེས་ན་ལུས་དེ་ཆེ་བ་ཞེས་བགྱིའོ། །དེ་དངོས་པོ་མ་མཆིས་པས་དེས་ན་ལུས་ཞེས་བྱའོ། །"]}},{section:11,title:{},content:{tibetan:["བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། གང་གཱའི་ཀླུང་གི་བྱེ་མ་ཇི་སྙེད་པ་གང་གཱའི་ཀླུང་ཡང་དེ་སྙེད་ཁོ་ནར་གྱུར་ལ། དེ་དག་གི་བྱེ་མ་གང་ཡིན་པ་དེ་དག་མང་བ་ཡིན་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་གང་གའི་ཀླུང་དེ་དག་ཉིད་ཀྱང་མང་ལགས་ན། དེ་དག་གི་བྱེ་མ་ལྟ་སྨོས་ཀྱང་ཅི་འཚལ། བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་ཁྱོད་མོས་པར་བྱའོ། །ཁྱོད་ཀྱིས་ཁོང་དུ་ཆུད་པར་བྱའོ། །གང་གཱའི་ཀླུང་དེ་དག་གི་བྱེ་མ་ཇི་སྙེད་པ་དེ་སྙེད་ཀྱི་འཇིག་རྟེན་གྱི་ཁམས་ན་སྐྱེས་པའམ། བུད་མེད་ལ་ལ་ཞིག་གིས་རིན་པོ་ཆེ་སྣ་བདུན་གྱིས་རབ་ཏུ་གང་བར་བྱས་ཏེ། དེ་བཞིན་གཤེགས་པ་དགྲ་བཅོམ་པ་ཡང་དག་པར་རྫོགས་པའི་སངས་རྒྱས་རྣམས་ལ་སྦྱིན་པ་བྱིན་ན། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། སྐྱེས་པའམ་བུད་མེད་དེ་གཞི་དེ་ལས་བསོད་ནམས་མང་དུ་བསྐྱེད་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་མང་ལགས་སོ། །བདེ་བར་གཤེགས་པ་མང་ལགས་སོ། །སྐྱེས་པའམ་བུད་མེད་དེ་གཞི་དེ་ལས་བསོད་ནམས་མང་དུ་བསྐྱེད་པ་ལགས་སོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་གང་གིས་འཇིག་རྟེན་གྱི་ཁམས་དེ་སྙེད་རིན་པོ་ཆེ་སྣ་བདུན་གྱིས་རབ་ཏུ་གང་བར་བྱས་ཏེ། དེ་བཞིན་གཤེགས་པ་དགྲ་བཅོམ་པ་ཡང་དག་པར་རྫོགས་པའི་སངས་རྒྱས་རྣམས་ལ་སྦྱིན་པ་བྱིན་པ་བས། གང་གིས་ཆོས་ཀྱི་རྣམ་གྲངས་འདི་ལས་ཐ་ན་ཚིག་བཞི་པའི་ཚིགས་སུ་བཅད་པ་ཙམ་བཟུང་ནས། གཞན་དག་ལ་ཡང་དག་པར་རབ་ཏུ་བཤད་དེ་ཡང་དག་པར་རབ་ཏུ་བསྟན་ན། དེ་ཉིད་གཞི་དེ་ལས་བསོད་ནམས་ཆེས་མང་དུ་གྲངས་མེད་དཔག་ཏུ་མེད་པ་བསྐྱེད་དོ། །"]}},{section:12,title:{},content:{tibetan:["ཡང་རབ་འབྱོར་ས་ཕྱོགས་གང་ན་ཆོས་ཀྱི་རྣམ་གྲངས་འདི་ལས་ཐ་ན་ཚིག་བཞི་པའི་ཚིགས་སུ་བཅད་པ་ཙམ་འདོན་ཏམ། སྟོན་པའི་ས་ཕྱོགས་དེ་ནི་ལྷ་དང་མི་དང་ལྷ་མ་ཡིན་དུ་བཅས་པའི་འཇིག་རྟེན་གྱི་མཆོད་རྟེན་དུ་གྱུར་པ་ཡིན་ན་སུ་ཞིག་ཆོས་ཀྱི་རྣམ་གྲངས་འདི་ལེན་པ་དང༌། འབྲི་བ་དང༌། འཛིན་པ་དང༌། འཆང་བ་དང༌། ཀློག་པ་དང༌། ཀུན་ཆུབ་པར་བྱེད་པ་དང༌། ཚུལ་བཞིན་དུ་ཡིད་ལ་བྱེད་པ་དེ་ངོ་མཚར་རབ་དང་ལྡན་པར་གྱུར་བ་ལྟ་ཅི་སྨོས་ཏེ། ས་ཕྱོགས་དེ་ན་སྟོན་པའམ། བླ་མ་ལྟ་བུ་གང་ཡང་རུང་བར་གནས་སོ། །"]}},{section:13,title:{},content:{tibetan:["དེ་སྐད་ཅེས་བཀའ་བསྩལ་པ་དང༌། བཅོམ་ལྡན་འདས་ལ་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་གྱིས་འདི་སྐད་ཅེས་གསོལ་ཏོ། །བཅོམ་ལྡན་འདས་ཆོས་ཀྱི་རྣམ་གྲངས་འདིའི་མིང་ཅི་ལགས། འདི་ཇི་ལྟར་གཟུང་བར་བགྱི། དེ་སྐད་ཅེས་གསོལ་པ་དང༌། བཅོམ་ལྡན་འདས་ཀྱིས་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་ལ་འདི་སྐད་ཅེས་བཀའ་སྩལ་ཏོ། །རབ་འབྱོར་ཆོས་ཀྱི་རྣམ་གྲངས་འདིའི་མིང་ཤེས་རབ་ཀྱི་ཕ་རོལ་ཏུ་ཕྱིན་པ་ཞེས་བྱ་སྟེ་འདི་དེ་ལྟར་ཟུངས་ཤིག །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་དེ་བཞིན་གཤེགས་པས་ཤེས་རབ་ཀྱི་ཕ་རོལ་ཏུ་ཕྱིན་པ་གང་གསུངས་པ་དེ་ཉིད་ཕ་རོལ་ཏུ་ཕྱིན་པ་མེད་པའི་ཕྱིར་ཏེ། དེས་ན་ཤེས་རབ་ཀྱི་ཕ་རོལ་ཏུ་ཕྱིན་པ་ཞེས་བྱའོ། །རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། དེ་བཞིན་གཤེགས་པས་གསུངས་པའི་ཆོས་དེ་གང་ཡང་ཡོད་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་བཞིན་གཤེགས་པས་གང་གསུངས་པའི་ཆོས་དེ་གང་ཡང་མ་མཆིས་ལགས་སོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། སྟོང་གསུམ་གྱི་སྟོང་ཆེན་པོའི་འཇིག་རྟེན་གྱི་ཁམས་ན་སའི་རྡུལ་ཇི་སྙེད་ཡོད་པ་དེ་མང་བ་ཡིན་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་སའི་རྡུལ་དེ་མང་ལགས་སོ། །བདེ་བར་གཤེགས་པ་མང་ལགས་སོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། བཅོམ་ལྡན་འདས་སའི་རྡུལ་གང་ལགས་པ་དེ་རྡུལ་མ་མཆིས་པར་དེ་བཞིན་གཤེགས་པས་གསུངས་པའི་སླད་དུ་སྟེ། དེས་ན་སའི་རྡུལ་ཞེས་བགྱིའོ། །འཇིག་རྟེན་གྱི་ཁམས་གང་ལགས་པ་དེ་དག་ཁམས་མ་མཆིས་པར་དེ་བཞིན་གཤེགས་པས་གསུངས་པའི་སླད་དུ་སྟེ། དེས་ན་འཇིག་རྟེན་གྱི་ཁམས་ཞེས་བགྱིའོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། སྐྱེས་བུ་ཆེན་པོའི་མཚན་སུམ་ཅུ་རྩ་གཉིས་པོ་དེ་དག་གིས་དེ་བཞིན་གཤེགས་པ་དགྲ་བཅོམ་པ་ཡང་དག་པར་རྫོགས་པའི་སངས་རྒྱས་སུ་བལྟ་བར་བྱ་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། །བཅོམ་ལྡན་འདས་དེ་ནི་མ་ལགས་སོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། སྐྱེས་བུ་ཆེན་པོའི་མཚན་སུམ་ཅུ་རྩ་གཉིས་གང་དག་དེ་བཞིན་གཤེགས་པས་གསུངས་པ་དེ་དག་མཚན་མ་མཆིས་པར་དེ་བཞིན་གཤེགས་པས་གསུངས་པའི་སླད་དུ་སྟེ། དེས་ན་སྐྱེས་བུ་ཆེན་པོའི་མཚན་སུམ་ཅུ་རྩ་གཉིས་རྣམས་ཞེས་བགྱིའོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་སྐྱེས་པའམ། བུད་མེད་གང་ལ་ལ་ཞིག་གིས་ལུས་གང་གཱའི་ཀླུང་གི་བྱེ་མ་སྙེད་ཡོངས་སུ་བཏང་བ་བས། གང་གིས་ཆོས་ཀྱི་རྣམ་གྲངས་འདི་ལས་ཐ་ན་ཚིག་བཞི་པའི་ཚིགས་སུ་བཅད་པ་ཙམ་བཟུང་སྟེ་གཞན་དག་ལ་ཡང་དག་པར་བསྟན་ན། དེ་ཉིད་གཞི་དེ་ལས་བསོད་ནམས་ཆེས་མང་དུ་གྲངས་མེད་དཔག་ཏུ་མེད་པ་བསྐྱེད་དོ། །"]}},{section:14,title:{},content:{tibetan:["དེ་ནས་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་ཆོས་ཀྱི་ཤུགས་ཀྱིས་མཆི་མ་ཕྱུང་སྟེ། དེས་མཆི་མ་ཕྱིས་ནས་བཅོམ་ལྡན་འདས་ལ་འདི་སྐད་ཅེས་གསོལ་ཏོ། །ཆོས་ཀྱི་རྣམ་གྲངས་འདི་དེ་བཞིན་གཤེགས་པ་ཇི་སྙེད་པས་གསུངས་པ་ནི། བཅོམ་ལྡན་འདས་ངོ་མཚར་ལགས་སོ། །བདེ་བར་གཤེགས་པ་ངོ་མཚར་ལགས་སོ། །བཅོམ་ལྡན་འདས་བདག་གིས་ཡེ་ཤེས་སྐྱེས་ཚུན་ཆད་བདག་གིས་ཆོས་ཀྱི་རྣམ་གྲངས་འདི་སྔོན་ནམ་ཡང་མ་ཐོས་ལགས་སོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། བཅོམ་ལྡན་འདས་མདོ་སྡེ་བཤད་པ་འདི་ལ་གང་དག་ཡང་དག་པར་འདུ་ཤེས་བསྐྱེད་པར་འགྱུར་བའི་སེམས་ཅན་དེ་དག་ནི་ངོ་མཚར་རབ་དང་ལྡན་པར་འགྱུར་ལགས་སོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། བཅོམ་ལྡན་འདས་ཡང་དག་པར་འདུ་ཤེས་པ་གང་ལགས་པ་དེ་ཉིད་འདུ་ཤེས་མ་མཆིས་པའི་སླད་དུ་སྟེ། དེས་ན་ཡང་དག་པར་འདུ་ཤེས་ཞེས་དེ་བཞིན་གཤེགས་པས་གསུངས་སོ། །བཅོམ་ལྡན་འདས་བདག་ནི་ཆོས་ཀྱི་རྣམ་གྲངས་འདི་བཤད་པ་ལ་རྟོག་ཅིང་མོས་པ་ནི། བདག་ལ་ངོ་མཚར་མ་ལགས་ཀྱིས། བཅོམ་ལྡན་འདས་སླད་མའི་ཚེ་སླད་མའི་དུས་ལྔ་བརྒྱའི་ཐ་མ་ལ་སེམས་ཅན་གང་དག་ཆོས་ཀྱི་རྣམ་གྲངས་འདི་ལེན་པ་དང༌། འབྲི་བ་དང༌། འཛིན་པ་དང༌། འཆང་བ་དང༌། ཀློག་པ་དང༌། ཀུན་ཆུབ་པར་བྱེད་པ་དེ་དག་ནི་ངོ་མཚར་རབ་དང་ལྡན་པར་འགྱུར་ལགས་སོ། །ཡང་བཅོམ་ལྡན་འདས་དེ་དག་ནི་བདག་ཏུ་འདུ་ཤེས་འཇུག་པར་མི་འགྱུར་ཞིང༌། སེམས་ཅན་དུ་འདུ་ཤེས་པ་དང༌། སྲོག་ཏུ་འདུ་ཤེས་པ་དང༌། གང་ཟག་ཏུ་འདུ་ཤེས་འཇུག་པར་མི་འགྱུར་ལགས་སོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། བཅོམ་ལྡན་འདས་བདག་ཏུ་འདུ་ཤེས་པ་དང༌། སེམས་ཅན་དུ་འདུ་ཤེས་པ་དང༌། སྲོག་ཏུ་འདུ་ཤེས་པ་དང༌། གང་ཟག་ཏུ་འདུ་ཤེས་པ་གང་ལགས་པ་དེ་ཉིད་འདུ་ཤེས་ཐམས་ཅད་དང་བྲལ་བའི་སླད་དུའོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། སངས་རྒྱས་བཅོམ་ལྡན་འདས་རྣམས་ནི་འདུ་ཤེས་ཐམས་ཅད་དང་བྲལ་བའི་སླད་དུའོ། །དེ་སྐད་ཅེས་གསོལ་པ་དང༌། བཅོམ་ལྡན་འདས་ཀྱིས་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་ལ་འདི་སྐད་ཅེས་བཀའ་བསྩལ་ཏོ། །རབ་འབྱོར་དེ་དེ་བཞིན་ནོ། །དེ་དེ་བཞིན་ཏེ། སེམས་ཅན་གང་དག་མདོ་སྡེ་འདི་བཤད་པ་ལ་མི་སྐྲག་ཅིང་མི་དངངས་ལ་ཀུན་ཏུ་དངངས་པར་མི་འགྱུར་བ་དེ་དག་ནི་ངོ་མཚར་རབ་དང་ལྡན་པར་འགྱུར་རོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་ཕ་རོལ་ཏུ་ཕྱིན་པ་དམ་པ་འདི་ནི་དེ་བཞིན་གཤེགས་པས་གསུངས་ཏེ། ཕ་རོལ་ཏུ་ཕྱིན་པ་དམ་པ་གང་དེ་བཞིན་གཤེགས་པས་གསུངས་པ་དེ་སངས་རྒྱས་བཅོམ་ལྡན་འདས་དཔག་ཏུ་མེད་ཚད་མེད་པ་རྣམས་ཀྱིས་ཀྱང་གསུངས་པའི་ཕྱིར་ཏེ། དེས་ན་ཕ་རོལ་ཏུ་ཕྱིན་པ་དམ་པ་ཞེས་བྱའོ། །"]}},{section:15,title:{},content:{tibetan:["ཡང་རབ་འབྱོར་དེ་བཞིན་གཤེགས་པས་བཟོད་པའི་ཕ་རོལ་ཏུ་ཕྱིན་པ་གང་ཡིན་པ་དེ་ཉིད་ཕ་རོལ་ཏུ་ཕྱིན་པ་མེད་དོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་གང་གི་ཚེ་ཀ་ལིངྒའི་རྒྱལ་པོས། ངའི་ཡན་ལག་དང་ཉིང་ལག་རྣམས་བཅད་པར་གྱུར་པ་དེའི་ཚེ་ང་ལ་བདག་ཏུ་འདུ་ཤེས་སམ། སེམས་ཅན་དུ་འདུ་ཤེས་སམ། སྲོག་ཏུ་འདུ་ཤེས་སམ། གང་ཟག་ཏུ་འདུ་ཤེས་ཀྱང་མ་བྱུང་ཞིང༌། ང་ལ་འདུ་ཤེས་ཅི་ཡང་མེད་ལ་འདུ་ཤེས་མེད་པར་གྱུར་པ་ཡང་མ་ཡིན་པའི་ཕྱིར་རོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་གལ་ཏེ་དེའི་ཚེ་ང་ལ་བདག་ཏུ་འདུ་ཤེས་བྱུང་ན། དེའི་ཚེ་གནོད་སེམས་ཀྱི་འདུ་ཤེས་ཀྱང་འབྱུང་ལ། སེམས་ཅན་དུ་འདུ་ཤེས་པ་དང༌། སྲོག་ཏུ་འདུ་ཤེས་པ་དང༌། གང་ཟག་ཏུ་འདུ་ཤེས་བྱུང་ན། དེའི་ཚེ་གནོད་སེམས་ཀྱི་འདུ་ཤེས་ཀྱང་འབྱུང་བའི་ཕྱིར་རོ། །རབ་འབྱོར་ངས་མངོན་པར་ཤེས་ཏེ། འདས་པའི་དུས་ན། ང་ཚེ་རབས་ལྔ་བརྒྱར་བཟོད་པ
