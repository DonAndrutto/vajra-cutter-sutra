་སྨྲ་བ་ཞེས་བྱ་བའི་དྲང་སྲོང་དུ་གྱུར་པ་དེའི་ཚེ་ན་ཡང༌། ང་ལ་བདག་ཏུ་འདུ་ཤེས་མ་བྱུང༌། སེམས་ཅན་དུ་འདུ་ཤེས་དང༌། སྲོག་ཏུ་འདུ་ཤེས་དང༌། གང་ཟག་ཏུ་འདུ་ཤེས་མ་བྱུང་ངོ། །རབ་འབྱོར་དེ་ལྟ་བས་ན། བྱང་ཆུབ་སེམས་དཔའ་སེམས་དཔའ་ཆེན་པོས་འདུ་ཤེས་ཐམས་ཅད་རྣམ་པར་སྤངས་ཏེ། བླ་ན་མེད་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་ཏུ་སེམས་བསྐྱེད་པར་བྱའོ། །གཟུགས་ལ་ཡང་མི་གནས་པར་སེམས་བསྐྱེད་པར་བྱའོ། །སྒྲ་དང་དྲི་དང་རོ་དང༌། རེག་བྱ་ལ་ཡང་མི་གནས་པར་སེམས་བསྐྱེད་པར་བྱའོ། །ཆོས་ལ་ཡང་མི་གནས་པར་སེམས་བསྐྱེད་པར་བྱའོ། །ཆོས་མེད་པ་ལ་ཡང་མི་གནས་པར་སེམས་བསྐྱེད་པར་བྱའོ། །ཅི་ལ་ཡང་མི་གནས་པར་སེམས་བསྐྱེད་པར་བྱའོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། གནས་པ་གང་ཡིན་པ་དེ་ཉིད་མི་གནས་པའི་ཕྱིར་ཏེ། དེ་བས་ན་དེ་བཞིན་གཤེགས་པས་འདི་སྐད་དུ། བྱང་ཆུབ་སེམས་དཔའ་གང་ལ་ཡང་མི་གནས་པར་སྦྱིན་པ་བྱིན་པར་བྱའོ། །ཞེས་གསུངས་སོ། །"]}},{section:16,title:{},content:{tibetan:["ཡང་རབ་འབྱོར་རིགས་ཀྱི་བུའམ། རིགས་ཀྱི་བུ་མོ་གང་དག་འདི་ལྟ་བུའི་མདོ་སྡེའི་ཚིག་འདི་དག་ལེན་པ་དང༌། འཛིན་པ་དང༌། འཆང་བ་དང༌། ཀློག་པ་དང༌། ཀུན་ཆུབ་པར་བྱེད་པ་དེ་དག་ནི་མནར་བར་འགྱུར། ཤིན་ཏུ་མནར་བར་འགྱུར་རོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་སེམས་ཅན་དེ་དག་ནི་ཚེ་རབས་སྔ་མའི་མི་དགེ་བའི་ལས་ངན་སོང་དུ་སྐྱེ་བར་འགྱུར་བ་གང་དག་བྱས་པ་དེ་དག་ཚེ་འདི་ཉིད་ལ་མནར་བས། ཚེ་རབས་སྔ་མའི་མི་དགེ་བའི་ལས་ངན་སོང་དུ་སྐྱེ་བར་འགྱུར་བ་གང་དག་བྱས་པ་དེ་དག་བྱང་བར་གྱུར་ཏེ། སངས་རྒྱས་ཀྱི་བྱང་ཆུབ་ཀྱང་ཐོབ་པར་འགྱུར་རོ། །རབ་འབྱོར་ངས་མངོན་པར་ཤེས་ཏེ། འདས་པའི་དུས་བསྐལ་པ་གྲངས་མེད་པའི་ཡང་ཆེས་གྲངས་མེད་པ་ན། དེ་བཞིན་གཤེགས་པ་དགྲ་བཅོམ་པ་ཡང་དག་པར་རྫོགས་པའི་སངས་རྒྱས་མར་མེ་མཛད་ཀྱི་སྔ་རོལ་གྱི་ཡང་ཆེས་སྔ་རོལ་ན། སངས་རྒྱས་བྱེ་བ་ཁྲག་ཁྲིག་འབུམ་ཕྲག་བརྒྱད་ཅུ་རྩ་བཞི་དག་བྱུང་བ་དེས་མཉེས་པར་བྱས་ཏེ། མ་མཉེས་པར་མ་བྱས་ནས་ཐུགས་འབྱུང་བར་མ་བྱས་ཏེ། རབ་འབྱོར་སངས་རྒྱས་བཅོམ་ལྡན་འདས་དེ་དག་ངས་མཉེས་པར་བྱས་ནས་ཐུགས་འབྱུང་བར་མ་བྱས་པ་གང་ཡིན་པ་དང༌། ཕྱི་མའི་དུས་ལྔ་བརྒྱའི་ཐ་མར་གྱུར་པ་ན། མདོ་སྡེ་འདི་ལེན་པ་དང༌། འབྲི་བ་དང༌། འཛིན་པ་དང༌། འཆང་བ་དང༌། ཀློག་པ་དང༌། ཀུན་ཆུབ་པར་བྱེད་པ་གང་ཡིན་པ་ལས། རབ་འབྱོར་བསོད་ནམས་ཀྱི་ཕུང་པོ་འདི་ལ་བསོད་ནམས་ཀྱི་ཕུང་པོ་སྔ་མ་དེས་བརྒྱའི་ཆར་ཡང་ཉེ་བར་མི་འགྲོ། སྟོང་གི་ཆ་དང༌། འབུམ་གྱི་ཆ་དང༌། གྲངས་དང༌། ཚད་དང༌། བགྲང་བ་དང༌། དཔེ་དང་ཟླ་དང་རྒྱུར་ཡང་མི་བཟད་དོ། །རབ་འབྱོར་གལ་ཏེ་དེའི་ཚེ། རིགས་ཀྱི་བུའམ། རིགས་ཀྱི་བུ་མོ་གང་དག་བསོད་ནམས་ཀྱི་ཕུང་པོ་ཇི་སྙེད་རབ་ཏུ་འཛིན་པར་འགྱུར་བའི་རིགས་ཀྱི་བུའམ། རིགས་ཀྱི་བུ་མོ་དེ་དག་གི་བསོད་ནམས་ཀྱི་ཕུང་པོ་ངས་བརྗོད་ན། སེམས་ཅན་རྣམས་མྱོས་མྱོས་པར་འགྱུར་ཞིང་སེམས་འཁྲུགས་པར་འགྱུར་རོ། །ཡང་རབ་འབྱོར་ཆོས་ཀྱི་རྣམ་གྲངས་འདི་བསམ་གྱིས་མི་ཁྱབ་སྟེ། འདིའི་རྣམ་པར་སྨིན་པ་ཡང་བསམ་གྱིས་མི་ཁྱབ་པ་ཉིད་དུ་རིག་པར་བྱའོ། །"]}},{section:17,title:{},content:{tibetan:["དེ་ནས་བཅོམ་ལྡན་འདས་ལ་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་གྱིས་འདི་སྐད་ཅེས་གསོལ་ཏོ། །བཅོམ་ལྡན་འདས་བྱང་ཆུབ་སེམས་དཔའི་ཐེག་པ་ལ་ཡང་དག་པར་ཞུགས་པ་རྣམས་ཀྱིས། ཇི་ལྟར་གནས་པར་བགྱི། ཇི་ལྟར་བསྒྲུབ་པར་བགྱི། ཇི་ལྟར་སེམས་རབ་ཏུ་གཟུང་བར་བགྱི། དེ་སྐད་ཅེས་གསོལ་པ་དང༌། བཅོམ་ལྡན་འདས་ཀྱིས་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་ལ་འདི་སྐད་བཀའ་བསྩལ་ཏོ། །རབ་འབྱོར་འདི་ལ་བྱང་ཆུབ་སེམས་དཔའི་ཐེག་པ་ལ་ཡང་དག་པར་ཞུགས་པས་འདི་སྙམ་དུ་བདག་གིས་སེམས་ཅན་ཐམས་ཅད་ཕུང་པོ་ལྷག་མ་མེད་པའི་མྱ་ངན་ལས་འདས་པའི་དབྱིངས་སུ་ཡོངས་སུ་མྱ་ངན་ལས་འདའོ། །དེ་ལྟར་སེམས་ཅན་ཚད་མེད་པ་ཡོངས་སུ་མྱ་ངན་ལས་འདས་ཀྱང་སེམས་ཅན་གང་ཡང་ཡོངས་སུ་མྱ་ངན་ལས་འདས་པར་གྱུར་པ་མེད་དོ་སྙམ་དུ་སེམས་བསྐྱེད་པར་བྱའོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་གལ་ཏེ་བྱང་ཆུབ་སེམས་དཔའ་སེམས་ཅན་དུ་འདུ་ཤེས་འཇུག་ན་དེ་བྱང་ཆུབ་སེམས་དཔའ་ཞེས་མི་བྱ་ལ། གང་ཟག་གི་བར་དུ་འདུ་ཤེས་འཇུག་ན་ཡང༌། དེ་བྱང་ཆུབ་སེམས་དཔའ་ཞེས་མི་བྱ་བའི་ཕྱིར་རོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་བྱང་ཆུབ་སེམས་དཔའི་ཐེག་པ་ལ་ཡང་དག་པར་ཞུགས་པ་ཞེས་བྱ་བའི་ཆོས་དེ་གང་ཡང་མེད་པའི་ཕྱིར་རོ། །རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། དེ་བཞིན་གཤེགས་པས་དེ་བཞིན་གཤེགས་པ་མར་མེ་མཛད་ལས་གང་བླ་ན་མེད་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་ཏུ་མངོན་པར་རྫོགས་པར་སངས་རྒྱས་པའི་ཆོས་གང་ཡང་ཡོད་སྙམ་མམ། དེ་སྐད་ཅེས་བཀའ་སྩལ་པ་དང༌། བཅོམ་ལྡན་འདས་ལ་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་གྱིས་འདི་སྐད་ཅེས་གསོལ་ཏོ། །བཅོམ་ལྡན་འདས་དེ་བཞིན་གཤེགས་པས་དེ་བཞིན་གཤེགས་པ་མར་མེ་མཛད་ལས་གང་བླ་ན་མེད་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་ཏུ་མངོན་པར་རྫོགས་པར་སངས་རྒྱས་པའི་ཆོས་དེ་གང་ཡང་མ་མཆིས་སོ། །དེ་སྐད་ཅེས་གསོལ་པ་དང༌། བཅོམ་ལྡན་འདས་ཀྱིས་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་ལ་འདི་སྐད་ཅེས་བཀའ་སྩལ་ཏོ། །རབ་འབྱོར་དེ་དེ་བཞིན་ནོ། །དེ་དེ་བཞིན་ཏེ། དེ་བཞིན་གཤེགས་པས་དེ་བཞིན་གཤེགས་པ་མར་མེ་མཛད་ལས་གང་བླ་ན་མེད་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་ཏུ་མངོན་པར་རྫོགས་པར་སངས་རྒྱས་པའི་ཆོས་དེ་གང་ཡང་མེད་དོ། །རབ་འབྱོར་གལ་ཏེ་དེ་བཞིན་གཤེགས་པས་གང་མངོན་པར་རྫོགས་པར་སངས་རྒྱས་པའི་ཆོས་དེ་འགའ་ཞིག་ཡོད་པར་གྱུར་ན། དེ་བཞིན་གཤེགས་པ་མར་མེ་མཛད་ཀྱིས་ང་ལ་བྲམ་ཟེའི་ཁྱེའུ་ཁྱོད་མ་འོངས་པའི་དུས་ན། དེ་བཞིན་གཤེགས་པ་དགྲ་བཅོམ་པ་ཡང་དག་པར་རྫོགས་པའི་སངས་རྒྱས་ཤཱཀྱ་ཐུབ་པ་ཞེས་བྱ་བར་འགྱུར་རོ། །ཞེས་ལུང་མི་སྟོན་པ་ཞིག་ན། རབ་འབྱོར་འདི་ལྟར་དེ་བཞིན་གཤེགས་པས་གང་བླ་ན་མེད་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་ཏུ་མངོན་པར་རྫོགས་པར་སངས་རྒྱས་པའི་ཆོས་དེ་གང་ཡང་མེད་པས་དེའི་ཕྱིར་དེ་བཞིན་གཤེགས་པ་མར་མེ་མཛད་ཀྱིས་ང་ལ་བྲམ་ཟེའི་ཁྱེའུ་ཁྱོད་མ་འོངས་པའི་དུས་ན་དེ་བཞིན་གཤེགས་པ་དགྲ་བཅོམ་པ་ཡང་དག་པར་རྫོགས་པའི་སངས་རྒྱས་ཤཱཀྱ་ཐུབ་པ་ཞེས་བྱ་བར་འགྱུར་རོ་ཞེས་ལུང་བསྟན་ཏོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་དེ་བཞིན་གཤེགས་པ་ཞེས་པ་ནི། ཡང་དག་པའི་དེ་བཞིན་ཉིད་ཀྱི་ཚིག་བླ་དྭགས་ཡིན་པའི་ཕྱིར་རོ། །ཡང་རབ་འབྱོར་གང་ལ་ལ་ཞིག་འདི་སྐད་དུ། དེ་བཞིན་གཤེགས་པ་དགྲ་བཅོམ་པ་ཡང་དག་པར་རྫོགས་པའི་སངས་རྒྱས་ཀྱིས་བླ་ན་མེད་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་ཏུ་མངོན་པར་རྫོགས་པར་སངས་རྒྱས་སོ་ཞེས་ཟེར་ན། དེ་ལོག་པར་སྨྲ་བ་ཡིན་ནོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་དེ་བཞིན་གཤེགས་པས་གང་བླ་ན་མེད་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་ཏུ་མངོན་པར་རྫོགས་པར་སངས་རྒྱས་པའི་ཆོས་དེ་གང་ཡང་མེད་པའི་ཕྱིར་རོ། །རབ་འབྱོར་དེ་བཞིན་གཤེགས་པས་ཆོས་གང་མངོན་པར་རྫོགས་པར་སངས་རྒྱས་པའམ། བསྟན་པ་དེ་ལ་བདེན་པ་ཡང་མེད། རྫུན་པ་ཡང་མེད་དོ། །དེ་བས་ན་དེ་བཞིན་གཤེགས་པས་ཆོས་ཐམས་ཅད་སངས་རྒྱས་ཀྱི་ཆོས་ཞེས་གསུངས་སོ། །རབ་འབྱོར་ཆོས་ཐམས་ཅད་ཅེས་བྱ་བ་ནི། དེ་དག་ཐམས་ཅད་ཆོས་མེད་པ་ཡིན་ཏེ། དེས་ན་ཆོས་ཐམས་ཅད་སངས་རྒྱས་ཀྱི་ཆོས་ཞེས་བྱའོ། །རབ་འབྱོར་འདི་ལྟ་སྟེ་དཔེར་ན། སྐྱེས་བུ་ཞིག་མིའི་ལུས་དང་ལྡན་ཞིང་ལུས་ཆེན་པོར་གྱུར་པ་བཞིན་ནོ། །ཚེ་དང་ལྡན་པ་རབ་འབྱོར་གྱིས་གསོལ་པ། །བཅོམ་ལྡན་འདས་དེ་བཞིན་གཤེགས་པས་སྐྱེས་བུ་མིའི་ལུས་དང་ལྡན་ཞིང་ལུས་ཆེན་པོ་ཞེས་གང་གསུངས་པ་དེ་དེ་བཞིན་གཤེགས་པས་ལུས་མ་མཆིས་པར་གསུངས་ཏེ། དེས་ན་ལུས་དང་ལྡན་ཞིང་ལུས་ཆེན་པོ་ཞེས་བགྱིའོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་དེ་དེ་བཞིན་ནོ། །དེ་དེ་བཞིན་ཏེ། བྱང་ཆུབ་སེམས་དཔའ་གང་འདི་སྐད་དུ་བདག་གིས་སེམས་ཅན་རྣམས་ཡོངས་སུ་མྱ་ངན་ལས་འདའོ་ཞེས་ཟེར་ན། དེ་བྱང་ཆུབ་སེམས་དཔའ་ཞེས་མི་བྱའོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་བྱང་ཆུབ་སེམས་དཔའ་ཞེས་བྱ་བའི་ཆོས་དེ་གང་ཡང་ཡོད་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་ནི་མ་ལགས་སོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་དེ་བས་ན། དེ་བཞིན་གཤེགས་པས་ཆོས་ཐམས་ཅད་ནི་སེམས་ཅན་མེད་པ། སྲོག་མེད་པ་གང་ཟག་མེད་པའོ། །ཞེས་གསུངས་སོ། །ཡང་རབ་འབྱོར་བྱང་ཆུབ་སེམས་དཔའ་གང་ཞིག་འདི་སྐད་དུ། བདག་གིས་ཞིང་བཀོད་པ་རྣམས་བསྒྲུབ་བོ་ཞེས་ཟེར་ན། དེ་ཡང་དེ་བཞིན་དུ་བརྗོད་པར་བྱའོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་ཞིང་བཀོད་པ་རྣམས་ཞིང་བཀོད་པ་རྣམས་ཞེས་བྱ་བ་ནི། དེ་དག་བཀོད་པ་མེད་པར་དེ་བཞིན་གཤེགས་པས་གསུངས་པའི་ཕྱིར་ཏེ། དེས་ན་ཞིང་བཀོད་པ་རྣམས་ཞེས་བྱའོ། །རབ་འབྱོར་བྱང་ཆུབ་སེམས་དཔའ་གང་ཞིག་འདི་སྐད་དུ། ཆོས་རྣམས་ནི་བདག་མེད་པ་ཆོས་རྣམས་ནི་བདག་མེད་པའོ་ཞེས་མོས་པ་དེ་ནི། དེ་བཞིན་གཤེགས་པ་དགྲ་བཅོམ་པ་ཡང་དག་པར་རྫོགས་པའི་སངས་རྒྱས་ཀྱིས། བྱང་ཆུབ་སེམས་དཔའ་སེམས་དཔའ་ཆེན་པོ་ཞེས་བརྗོད་དོ། །"]}},{section:18,title:{},content:{tibetan:["རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། དེ་བཞིན་གཤེགས་པ་ལ་ཤའི་སྤྱན་མངའ་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་དེ་ལྟར་ལགས་ཏེ། དེ་བཞིན་གཤེགས་པ་ལ་ཤའི་སྤྱན་མངའོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། དེ་བཞིན་གཤེགས་པ་ལ་ལྷའི་སྤྱན་མངའ་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་དེ་ལྟར་ལགས་ཏེ། དེ་བཞིན་གཤེགས་པ་ལ་ལྷའི་སྤྱན་མངའོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། དེ་བཞིན་གཤེགས་པ་ལ་ཤེས་རབ་ཀྱི་སྤྱན་མངའ་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་ལྟར་ལགས་ཏེ། དེ་བཞིན་གཤེགས་པ་ལ་ཤེས་རབ་ཀྱི་སྤྱན་མངའོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། དེ་བཞིན་གཤེགས་པ་ལ་ཆོས་ཀྱི་སྤྱན་མངའ་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་ལྟར་ལགས་ཏེ། དེ་བཞིན་གཤེགས་པ་ལ་ཆོས་ཀྱི་སྤྱན་མངའོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། དེ་བཞིན་གཤེགས་པ་ལ་སངས་རྒྱས་ཀྱི་སྤྱན་མངའ་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་དེ་ལྟར་ལགས་ཏེ། དེ་བཞིན་གཤེགས་པ་ལ་སངས་རྒྱས་ཀྱི་སྤྱན་མངའོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། གང་གའི་ཀླུང་གི་བྱེ་མ་ཇི་སྙེད་པ་གང་གའི་ཀླུང་ཡང་དེ་སྙེད་ཁོ་ནར་གྱུར་ལ། དེ་དག་གི་བྱེ་མ་དེ་སྙེད་ཀྱི་འཇིག་རྟེན་གྱི་ཁམས་སུ་གྱུར་ན། འཇིག་རྟེན་གྱི་ཁམས་དེ་དག་མང་བ་ཡིན་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་དེ་ལྟར་ལགས་ཏེ། འཇིག་རྟེན་གྱི་ཁམས་དེ་དག་མང་ལགས་སོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་འཇིག་རྟེན་གྱི་ཁམས་དེ་དག་སེམས་ཅན་ཇི་སྙེད་ཡོད་པ་དེ་དག་གིས་བསམ་པ་ཐ་དད་པས་སེམས་ཀྱི་རྒྱུན་ངས་རབ་ཏུ་ཤེས་སོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་སེམས་ཀྱི་རྒྱུན་སེམས་ཀྱི་རྒྱུན་ཞེས་བྱ་བ་ནི། དེ་རྒྱུན་མེད་པར་དེ་བཞིན་གཤེགས་པས་གསུངས་པའི་ཕྱིར་ཏེ། དེས་ན་སེམས་ཀྱི་རྒྱུན་ཞེས་བྱའོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་འདས་པའི་སེམས་ཀྱང་དམིགས་སུ་མེད། མ་འོངས་པའི་སེམས་ཀྱང་དམིགས་སུ་མེད། ད་ལྟར་བྱུང་བའི་སེམས་ཀྱང་དམིགས་སུ་མེད་པའི་ཕྱིར་རོ། །"]}},{section:19,title:{},content:{tibetan:["རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། གང་གིས་སྟོང་གསུམ་གྱི་སྟོང་ཆེན་པོའི་འཇིག་རྟེན་གྱི་ཁམས་འདི་རིན་པོ་ཆེ་སྣ་བདུན་གྱིས་རབ་ཏུ་གང་བར་བྱས་ཏེ་སྦྱིན་པ་བྱིན་ན། རིགས་ཀྱི་བུའམ། རིགས་ཀྱི་བུ་མོ་དེ་གཞི་དེ་ལས་བསོད་ནམས་མང་དུ་བསྐྱེད་དམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་མང་ལགས་སོ། །བདེ་བར་གཤེགས་པ་མང་ལགས་སོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་དེ་དེ་བཞིན་ནོ། །དེ་དེ་བཞིན་ཏེ། རིགས་ཀྱི་བུའམ། རིགས་ཀྱི་བུ་མོ་དེ་གཞི་དེ་ལས་བསོད་ནམས་ཀྱི་ཕུང་པོ་མང་དུ་བསྐྱེད་དོ། །ཡང་རབ་འབྱོར་གལ་ཏེ་བསོད་ནམས་ཀྱི་ཕུང་པོ་བསོད་ནམས་ཀྱི་ཕུང་པོར་གྱུར་པ་ན། བསོད་ནམས་ཀྱི་ཕུང་པོ་བསོད་ནམས་ཀྱི་ཕུང་པོ་ཞེས་དེ་བཞིན་གཤེགས་པ་མི་གསུངས་སོ། །"]}},{section:20,title:{},content:{tibetan:["རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། གཟུགས་ཀྱི་སྐུ་ཡོངས་སུ་གྲུབ་པས་དེ་བཞིན་གཤེགས་པར་བལྟ་བར་བྱ་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་ནི་མ་ལགས་སོ། །གཟུགས་ཀྱི་སྐུ་ཡོངས་སུ་གྲུབ་པས་དེ་བཞིན་གཤེགས་པར་བལྟ་བར་མི་བགྱི་ལགས་སོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། བཅོམ་ལྡན་འདས་གཟུགས་ཀྱི་སྐུ་ཡོངས་སུ་གྲུབ་པ་ཞེས་བགྱི་བ་ནི། དེ་ཡོངས་སུ་གྲུབ་པ་མ་མཆིས་པར་དེ་བཞིན་གཤེགས་པས་གསུངས་པའི་སླད་དུ་སྟེ། དེས་ན་གཟུགས་ཀྱི་སྐུ་ཡོངས་སུ་གྲུབ་པ་ཞེས་བགྱིའོ། །རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། མཚན་ཕུན་སུམ་ཚོགས་པས་དེ་བཞིན་གཤེགས་པར་བལྟ་བར་བྱ་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་ནི་མ་ལགས་སོ། །མཚན་ཕུན་སུམ་ཚོགས་པས་དེ་བཞིན་གཤེགས་པར་བལྟ་བར་མི་བགྱི་ལགས་སོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། དེ་བཞིན་གཤེགས་པས་མཚན་ཕུན་སུམ་ཚོགས་པ་གང་གསུངས་པ་དེ། མཚན་ཕུན་སུམ་ཚོགས་པ་མ་མཆིས་པར་དེ་བཞིན་གཤེགས་པས་གསུངས་པའི་སླད་དུ་སྟེ། དེས་ན་མཚན་ཕུན་སུམ་ཚོགས་པ་ཞེས་བགྱིའོ། །"]}},{section:21,title:{},content:{tibetan:["བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། དེ་བཞིན་གཤེགས་པས་འདི་སྙམ་དུ་ངས་ཆོས་བསྟན་ཏོ་ཞེས་དགོངས་སོ་སྙམ་ན། རབ་འབྱོར་དེ་དེ་ལྟར་མི་བལྟ་སྟེ། དེ་བཞིན་གཤེགས་པས་གང་བསྟན་པའི་ཆོས་དེ་གང་ཡང་མེད་པའི་ཕྱིར་རོ། །རབ་འབྱོར་སུ་ཞིག་འདི་སྐད་དུ། དེ་བཞིན་གཤེགས་པས་ཆོས་བསྟན་ཏོ་ཞེས་ཟེར་ན། རབ་འབྱོར་དེ་ནི་མེད་པ་དང་ལོག་པར་ཟིན་པས་ང་ལ་སྐུར་བར་འགྱུར་རོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་ཆོས་བསྟན་པ་ཞེས་བྱ་བ་ནི། གང་ཆོས་བསྟན་པ་ཆོས་བསྟན་པ་ཞེས་བྱ་བར་དམིགས་པར་འགྱུར་བའི་ཆོས་དེ་གང་ཡང་མེད་པའི་ཕྱིར་རོ། །དེ་ནས་བཅོམ་ལྡན་འདས་ལ་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་གྱིས་འདི་སྐད་ཅེས་གསོལ་ཏོ། །བཅོམ་ལྡན་འདས་མ་འོངས་པའི་དུས་ན། སེམས་ཅན་གང་དག་འདི་ལྟ་བུའི་ཆོས་བཤད་པ་འདི་ཐོས་ནས། མངོན་པར་ཡིད་ཆེས་པར་འགྱུར་བ་འབྱུང་བ་ལྟ་མཆིས་ལགས་སམ། བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་དེ་དག་ནི་སེམས་ཅན་ཡང་མ་ཡིན། སེམས་ཅན་མེད་པ་ཡང་མ་ཡིན་ནོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་སེམས་ཅན་རྣམས་ཞེས་བྱ་བ་ནི། དེ་བཞིན་གཤེགས་པས་དེ་དག་སེམས་ཅན་མེད་པར་གསུངས་པའི་ཕྱིར་ཏེ། དེ་བས་ན་སེམས་ཅན་རྣམས་ཞེས་བྱའོ། །"]}},{section:22,title:{},content:{tibetan:["རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། དེ་བཞིན་གཤེགས་པས་གང་བླ་ན་མེད་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་ཏུ་མངོན་པར་རྫོགས་པར་སངས་རྒྱས་པའི་ཆོས་དེ་གང་ཡང་ཡོད་སྙམ་མམ། ཚེ་དང་ལྡན་པ་རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་བཞིན་གཤེགས་པས་གང་བླ་ན་མེད་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་ཏུ་མངོན་པར་རྫོགས་པར་སངས་རྒྱས་པའི་ཆོས་དེ་གང་ཡང་མ་མཆིས་ལགས་སོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་དེ་དེ་བཞིན་ནོ། །དེ་དེ་བཞིན་ཏེ། དེ་ལ་ཆོས་ཅུང་ཟད་ཀྱང་མི་དམིགས་ཤིང་མེད་དེ། དེས་ན་བླ་ན་མེད་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་ཅེས་བྱའོ། །"]}},{section:23,title:{},content:{tibetan:["ཡང་རབ་འབྱོར་ཆོས་དེ་ནི་མཉམ་པ་སྟེ། དེ་ལ་མི་མཉམ་པ་དང་མཉམ་པ་གང་ཡང་མེད་པས། དེས་ན་བླ་ན་མེད་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་ཅེས་བྱའོ། །བླ་ན་མེད་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་དེ་ནི་བདག་མེད་པ་དང༌། སེམས་ཅན་མེད་པ་དང༌། སྲོག་མེད་པ་དང༌། གང་ཟག་མེད་པར་མཉམ་པ་སྟེ། དགེ་བའི་ཆོས་ཐམས་ཅད་ཀྱིས་མངོན་པར་རྫོགས་པར་སངས་རྒྱས་སོ། །རབ་འབྱོར་དགེ་བའི་ཆོས་རྣམས་དགེ་བའི་ཆོས་རྣམས་ཞེས་བྱ་བ་ནི། དེ་དག་ཆོས་མེད་པ་ཉིད་དུ་དེ་བཞིན་གཤེགས་པས་གསུངས་ཏེ། དེས་ན་དགེ་བའི་ཆོས་རྣམས་ཞེས་བྱའོ། །"]}},{section:24,title:{},content:{tibetan:["ཡང་རབ་འབྱོར་རིགས་ཀྱི་བུའམ། རིགས་ཀྱི་བུ་མོ་གང་ལ་ལ་ཞིག་གིས་སྟོང་གསུམ་གྱི་སྟོང་ཆེན་པོའི་འཇིག་རྟེན་གྱི་ཁམས་ན་རིའི་རྒྱལ་པོ་རི་རབ་དག་ཇི་སྙེད་ཡོད་པ་དེ་ཙམ་གྱི་རིན་པོ་ཆེ་སྣ་བདུན་གྱི་ཕུང་པོ་མངོན་པར་བསྡུས་ཏེ་སྦྱིན་པ་བྱིན་པ་བས། གང་གིས་ཤེས་རབ་ཀྱི་ཕ་རོལ་ཏུ་ཕྱིན་པ་འདི་ལས་ཐ་ན་ཚིག་བཞི་པའི་ཚིགས་སུ་བཅད་པ་གཅིག་ཙམ་བཟུང་ནས། གཞན་དག་ལ་ཡང་དག་པར་བསྟན་ན། རབ་འབྱོར་བསོད་ནམས་ཀྱི་ཕུང་པོ་འདི་ལ་བསོད་ནམས་ཀྱི་ཕུང་པོ་སྔ་མ་དེས་བརྒྱའི་ཆར་ཡང་ཉེ་བར་མི་ཕོད་པ་ནས། རྒྱུའི་བར་དུ་ཡང་མི་བཟོད་དོ། །"]}},{section:25,title:{},content:{tibetan:["རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། དེ་བཞིན་གཤེགས་པས་འདི་སྙམ་དུ་ངས་སེམས་ཅན་རྣམས་དཀྲོལ་ལོ་ཞེས་དགོངས་སོ་སྙམ་ན། རབ་འབྱོར་དེ་དེ་ལྟར་མི་ལྟའོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་དེ་བཞིན་གཤེགས་པས་གང་དཀྲོལ་བའི་སེམས་ཅན་གང་ཡང་མེད་པའི་ཕྱིར་རོ། །རབ་འབྱོར་གལ་ཏེ་དེ་བཞིན་གཤེགས་པས་སེམས་ཅན་གང་ལ་ལ་ཞིག་དཀྲོལ་བར་གྱུར་ན། འདི་ཉིད་དེ་བཞིན་གཤེགས་པའི་བདག་ཏུ་འཛིན་པ་འགྱུར། སེམས་ཅན་དུ་འཛིན་པ་དང༌། སྲོག་ཏུ་འཛིན་པ་དང༌། གང་ཟག་ཏུ་འཛིན་པར་འགྱུར་རོ། །རབ་འབྱོར་བདག་ཏུ་འཛིན་ཅེས་བྱ་བ་ནི། འཛིན་པ་མེད་པར་དེ་བཞིན་གཤེགས་པས་གསུངས་ན། དེ་ཡང་བྱིས་པ་སོ་སོའི་སྐྱེ་བོ་རྣམས་ཀྱིས་བཟུང་ངོ༌། །རབ་འབྱོར་བྱིས་པ་སོ་སོའི་སྐྱེ་བོ་རྣམས་ཞེས་བྱ་བ་ནི། དེ་དག་སྐྱེ་བོ་མེད་པ་ཉིད་དུ་དེ་བཞིན་གཤེགས་པས་གསུངས་ཏེ། དེས་ན་བྱིས་པ་སོ་སོའི་སྐྱེ་བོ་རྣམས་ཞེས་བྱའོ། །"]}},{section:26,title:{},content:{tibetan:[`རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། མཚན་ཕུན་སུམ་ཚོགས་པས་དེ་བཞིན་གཤེགས་པར་བལྟ་བར་བྱ་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་ནི་མ་ལགས་སོ། །མཚན་ཕུན་སུམ་ཚོགས་པས་དེ་བཞིན་གཤེགས་པར་བལྟ་བར་མི་བགྱི་ལགས་སོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་དེ་དེ་བཞིན་ནོ། །དེ་དེ་བཞིན་ཏེ། མཚན་ཕུན་སུམ་ཚོགས་པས་དེ་བཞིན་གཤེགས་པར་བལྟ་བར་མི་བྱ་སྟེ། རབ་འབྱོར་གལ་ཏེ་མཚན་ཕུན་སུམ་ཚོགས་པས་དེ་བཞིན་གཤེགས་པར་བལྟ་བར་འགྱུར་ན། འཁོར་ལོས་སྒྱུར་བའི་རྒྱལ་པོ་ཡང་དེ་བཞིན་གཤེགས་པར་འགྱུར་ཏེ། དེ་བས་ན་མཚན་ཕུན་སུམ་ཚོགས་པས་དེ་བཞིན་གཤེགས་པར་བལྟ་བར་མི་བྱའོ། །དེ་ནས་བཅོམ་ལྡན་འདས་ལ་ཚེ་དང་ལྡན་པ་རབ་འབྱོར་གྱིས་འདི་སྐད་ཅེས་གསོལ་ཏོ། །བཅོམ་ལྡན་འདས་བདག་གིས་ཇི་ལྟར་བཅོམ་ལྡན་འདས་ཀྱིས་གསུངས་པའི་དོན་འཚལ་བ་ལྟར་ན། མཚན་ཕུན་སུམ་ཚོགས་པས་དེ་བཞིན་གཤེགས་པར་བལྟ་བར་མི་བགྱི་ལགས་སོ། །དེ་ནས་བཅོམ་ལྡན་འདས་ཀྱིས་དེའི་ཚེ་ཚིགས་སུ་བཅད་པ་འདི་དག་བཀའ་སྩལ་ཏོ། །
གང་དག་ང་ལ་གཟུགས་སུ་མཐོང༌། །གང་དག་ང་ལ་སྒྲར་ཤེས་པ། །
ལོག་པའི་ལམ་ལ་ཞུགས་པ་སྟེ། །སྐྱེ་བོ་དེ་དག་ང་མི་མཐོང༌། །
སངས་རྒྱས་རྣམས་ནི་ཆོས་ཉིད་ལྟ། །འདྲེན་པ་རྣམས་ནི་ཆོས་ཀྱི་སྐུ། །
ཆོས་ཉིད་ཤེས་པར་བྱ་མིན་པས། །དེ་ནི་རྣམ་པར་ཤེས་མི་ནུས། །`]}},{section:27,title:{},content:{tibetan:["རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། མཚན་ཕུན་སུམ་ཚོགས་པས་དེ་བཞིན་གཤེགས་པ་དགྲ་བཅོམ་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་ཏུ་མངོན་པར་རྫོགས་པར་སངས་རྒྱས་སོ་སྙམ་དུ་འཛིན་ན། རབ་འབྱོར་ཁྱོད་ཀྱིས་དེ་ལྟར་བལྟ་བར་མི་བྱ་སྟེ། རབ་འབྱོར་མཚན་ཕུན་སུམ་ཚོགས་པས་དེ་བཞིན་གཤེགས་པ་དགྲ་བཅོམ་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ་ཏུ་མངོན་པར་རྫོགས་པར་སངས་རྒྱས་པ་མེད་དོ། །རབ་འབྱོར་ཁྱོད་འདི་སྙམ་དུ་བྱང་ཆུབ་སེམས་དཔའི་ཐེག་པ་ལ་ཡང་དག་པར་ཞུགས་པ་རྣམས་ཀྱིས། ཆོས་གང་ལ་ལ་ཞིག་རྣམ་པར་བཤིག་པའམ་ཆད་པར་བཏགས་པའོ་སྙམ་དུ་འཛིན་ན། རབ་འབྱོར་དེ་དེ་ལྟར་བལྟ་བར་མི་བྱ་སྟེ། བྱང་ཆུབ་སེམས་དཔའི་ཐེག་པ་ལ་ཡང་དག་པར་ཞུགས་པ་རྣམས་ཀྱིས། ཆོས་གང་ཡང་རྣམ་པར་བཤིག་པའམ། ཆད་པར་བཏགས་པ་མེད་དོ། །"]}},{section:28,title:{},content:{tibetan:["ཡང་རབ་འབྱོར་རིགས་ཀྱི་བུའམ། རིགས་ཀྱི་བུ་མོ་གང་གིས་འཇིག་རྟེན་གྱི་ཁམས་གང་གཱའི་ཀླུང་གི་བྱེ་མ་སྙེད་དག་རིན་པོ་ཆེ་སྣ་བདུན་གྱིས་རབ་ཏུ་གང་བར་བྱས་ཏེ་སྦྱིན་པ་བྱིན་པ་བས། བྱང་ཆུབ་སེམས་དཔའ་གང་གིས་ཆོས་ཀྱི་རྣམ་གྲངས་འདི་བདག་མེད་ཅིང་སྐྱེ་བ་མེད་པ་ལ་བཟོད་པ་ཐོབ་ན། དེ་ཉིད་གཞི་དེ་ལས་བསོད་ནམས་ཀྱི་ཕུང་པོ་ཆེས་མང་དུ་གྲངས་མེད་དཔག་ཏུ་མེད་པ་བསྐྱེད་དོ། །ཡང་རབ་འབྱོར་བྱང་ཆུབ་སེམས་དཔས་བསོད་ནམས་ཀྱི་ཕུང་པོ་ཡོངས་སུ་གཟུང་བར་མི་བྱའོ། །ཚེ་དང་ལྡན་པ་རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་བྱང་ཆུབ་སེམས་དཔས་བསོད་ནམས་ཀྱི་ཕུང་པོ་ཡོངས་སུ་གཟུང་བར་མི་བགྱི་ལགས་སམ། བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་ཡོངས་སུ་གཟུང་མོད་ཀྱིས། ལོག་པར་མི་གཟུང་སྟེ་དེས་ན་ཡོངས་སུ་གཟུངས་ཞེས་བྱའོ། །"]}},{section:29,title:{},content:{tibetan:["ཡང་རབ་འབྱོར་གང་ལ་ལ་ཞིག་འདི་སྐད་དུ། དེ་བཞིན་གཤེགས་པ་བཞུད་དམ། བྱོན་ཏམ། བཞེངས་སམ། བཞུགས་སམ། མནལ་བར་མཛད་དོ་ཞེས་ཟེར་ན། དེ་ཡིས་ངས་བཤད་པའི་དོན་མི་ཤེས་སོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་དེ་བཞིན་གཤེགས་པ་ཞེས་བྱ་བ་ནི། གར་ཡང་མ་བཞུད། གང་ནས་ཀྱང་མ་བྱོན་པའི་ཕྱིར་ཏེ། དེས་ན་དེ་བཞིན་གཤེགས་པ་དགྲ་བཅོམ་པ་ཡང་དག་པར་རྫོགས་པའི་སངས་རྒྱས་ཞེས་བྱའོ། །"]}},{section:30,title:{},content:{tibetan:["ཡང་རབ་འབྱོར་རིགས་ཀྱི་བུའམ། རིགས་ཀྱི་བུ་མོ་གང་ལ་ལ་ཞིག་གིས། སྟོང་གསུམ་གྱི་སྟོང་ཆེན་པོའི་འཇིག་རྟེན་གྱི་ཁམས་ན་སའི་རྡུལ་ཇི་སྙེད་ཡོད་པ་དེ་དག །འདི་ལྟ་སྟེ་དཔེར་ན། རྡུལ་ཕྲ་རབ་ཀྱི་ཚོགས་བཞིན་དུ་ཕྱེ་མར་བྱས་ན། རབ་འབྱོར་འདི་ཇི་སྙམ་དུ་སེམས། རྡུལ་ཕྲ་རབ་ཀྱི་ཚོགས་དེ་མང་བ་ཡིན་སྙམ་མམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་དེ་དེ་ལྟར་ལགས་ཏེ། རྡུལ་ཕྲ་རབ་ཀྱི་ཚོགས་དེ་མང་བ་ལགས་སོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། བཅོམ་ལྡན་འདས་གལ་ཏེ་རྡུལ་ཕྲ་རབ་ཀྱི་ཚོགས་ཤིག་མཆིས་པར་གྱུར་ན། བཅོམ་ལྡན་འདས་ཀྱིས་རྡུལ་ཕྲ་རབ་ཀྱི་ཚོགས་ཞེས་བཀའ་མི་སྩོལ་བའི་སླད་དུའོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། བཅོམ་ལྡན་འདས་ཀྱིས་རྡུལ་ཕྲ་རབ་ཀྱི་ཚོགས་ཞེས་གང་གསུངས་པ་དེ་ཚོགས་མ་མཆིས་པར་དེ་བཞིན་གཤེགས་པས་གསུངས་པའི་སླད་དུ་སྟེ། དེས་ན་རྡུལ་ཕྲ་རབ་ཀྱི་ཚོགས་ཞེས་བགྱིའོ།། དེ་བཞིན་གཤེགས་པས་སྟོང་གསུམ་གྱི་སྟོང་ཆེན་པོའི་འཇིག་རྟེན་གྱི་ཁམས་ཞེས་གང་གསུངས་པ་དེ་ཁམས་མ་མཆིས་པར་དེ་བཞིན་གཤེགས་པས་གསུངས་ཏེ། དེས་ན་སྟོང་གསུམ་གྱི་སྟོང་ཆེན་པོའི་འཇིག་རྟེན་གྱི་ཁམས་ཞེས་བགྱིའོ། །དེ་ཅིའི་སླད་དུ་ཞེ་ན། བཅོམ་ལྡན་འདས་གལ་ཏེ་འཇིག་རྟེན་གྱི་ཁམས་ཤིག་མཆིས་པར་གྱུར་ན། དེ་ཉིད་རིལ་པོར་འཛིན་པར་གྱུར་པའི་སླད་དུའོ།། དེ་བཞིན་གཤེགས་པས་རིལ་པོར་འཛིན་པར་གསུངས་པ་དེ་འཛིན་པ་མ་མཆིས་པར་དེ་བཞིན་གཤེགས་པས་གསུངས་པའི་སླད་དུ་སྟེ། དེས་ན་རིལ་པོར་འཛིན་པ་ཞེས་བགྱིའོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་རིལ་པོར་འཛིན་པ་ཉིད་ནི་ཐ་སྙད་དེ། ཆོས་དེ་ནི་བརྗོད་དུ་མེད་པ་ཡིན་ན། དེ་ཡང་བྱིས་པ་སོ་སོའི་སྐྱེ་བོ་རྣམས་ཀྱིས་བཟུང་ངོ༌། །"]}},{section:31,title:{},content:{tibetan:["རབ་འབྱོར་གང་ལ་ལ་ཞིག་འདི་སྐད་དུ། དེ་བཞིན་གཤེགས་པས་བདག་ཏུ་ལྟ་བར་གསུངས། དེ་བཞིན་གཤེགས་པས་སེམས་ཅན་དུ་ལྟ་བ་དང༌། སྲོག་ཏུ་ལྟ་བ་དང༌། གང་ཟག་ཏུ་ལྟ་བར་གསུངས་སོ། །ཞེས་ཟེར་ན་དེ་ཡང་དག་པས་སྨྲ་བས་སྨྲ་བ་ཡིན་ནམ། རབ་འབྱོར་གྱིས་གསོལ་པ། བཅོམ་ལྡན་འདས་ནི་མ་ལགས་སོ། །བདེ་བར་གཤེགས་པ་དེ་ནི་མ་ལགས་སོ།། དེ་ཅིའི་སླད་དུ་ཞེ་ན། བཅོམ་ལྡན་འདས་དེ་བཞིན་གཤེགས་པས་བདག་ཏུ་ལྟ་བར་གང་གསུངས་པ་དེ་ནི་ལྟ་བ་མ་མཆིས་པར་དེ་བཞིན་གཤེགས་པས་གསུངས་པའི་སླད་དུ་སྟེ། དེས་ན་བདག་ཏུ་ལྟ་བ་ཞེས་བགྱིའོ། །བཅོམ་ལྡན་འདས་ཀྱིས་བཀའ་སྩལ་པ། རབ་འབྱོར་འདི་ལ་བྱང་ཆུབ་སེམས་དཔའི་ཐེག་པ་ལ་ཡང་དག་པར་ཞུགས་པས། འདི་ལྟར་ཆོས་ཐམས་ཅད་ཤེས་པར་བྱ། བལྟ་བར་བྱ། མོས་པར་བྱ་སྟེ། ཅི་ནས་ཆོས་སུ་འདུ་ཤེས་པ་ལ་མི་གནས་པར་ཤེས་པར་བྱའོ། །དེ་ཅིའི་ཕྱིར་ཞེ་ན། རབ་འབྱོར་ཆོས་སུ་འདུ་ཤེས་ཆོས་སུ་འདུ་ཤེས་ཞེས་བྱ་བ་ནི། དེ་འདུ་ཤེས་མེད་པར་དེ་བཞིན་གཤེགས་པས་གསུངས་པའི་ཕྱིར་ཏེ། དེས་ན་ཆོས་སུ་འདུ་ཤེས་ཆོས་སུ་འདུ་ཤེས་ཞེས་བྱ་བའོ། །"]}},{section:32,title:{},content:{tibetan:[`ཡང་རབ་འབྱོར་བྱང་ཆུབ་སེམས་དཔའ་སེམས་དཔའ་ཆེན་པོ་གང་གིས་འཇིག་རྟེན་གྱི་ཁམས་དཔག་ཏུ་མེད་ཅིང་གྲངས་མེད་པ་དག་རིན་པོ་ཆེ་སྣ་བདུན་གྱིས་རབ་ཏུ་གང་བར་བྱས་ཏེ། སྦྱིན་པ་བྱིན་པ་བས། རིགས་ཀྱི་བུའམ། རིགས་ཀྱི་བུ་མོ་གང་གིས་ཤེས་རབ་ཀྱི་ཕ་རོལ་ཏུ་ཕྱིན་པ་འདི་ལས་ཐ་ན་ཚིག་བཞི་པའི་ཚིགས་སུ་བཅད་པ་ཙམ་བྲིས་ནས་འཛིན་ཏམ། འཆང་ངམ། ཀློག་གམ། ཀུན་ཆུབ་པར་བྱེད་དམ། གཞན་དག་ལ་རྒྱ་ཆེར་ཡང་དག་པར་རབ་ཏུ་སྟོན་ན་དེ་ཉིད་གཞི་དེ་ལས་བསོད་ནམས་ཆེས་མང་དུ་གྲངས་མེད་དཔག་ཏུ་མེད་པ་བསྐྱེད་དོ། །ཇི་ལྟར་ཡང་དག་པར་རབ་ཏུ་སྟོན་ཅེ་ན། ཇི་ལྟར་ཡང་དག་པར་རབ་ཏུ་མི་སྟོན་པ་དེ་བཞིན་དུ་ཡང་དག་པར་རབ་ཏུ་སྟོན་པ་སྟེ། དེས་ན་ཡང་དག་པར་རབ་ཏུ་སྟོན་པ་ཞེས་བྱའོ། །
སྐར་མ་རབ་རིབ་མར་མེ་དང༌། །སྒྱུ་མ་ཟིལ་པ་ཆུ་བུར་དང༌། །
རྨི་ལམ་གློག་དང་སྤྲིན་ལྟ་བུ། །འདུས་བྱས་ཐམས་ཅད་དེ་ལྟར་ལྟ། །`,"བཅོམ་ལྡན་འདས་ཀྱིས་དེ་སྐད་ཅེས་བཀའ་སྩལ་ནས། གནས་བརྟན་རབ་འབྱོར་དང༌། དགེ་སློང་དེ་དག་དང༌། བྱང་ཆུབ་སེམས་དཔའ་དེ་དག་དང༌། འཁོར་བཞི་པོ་དགེ་སློང་དང༌། དགེ་སློང་མ་དང༌། དགེ་བསྙེན་དང༌། དགེ་བསྙེན་མ་དང༌། ལྷ་དང༌། མི་དང་ལྷ་མ་ཡིན་དང༌། དྲི་ཟར་བཅས་པའི་འཇིག་རྟེན་ཡི་རངས་ཏེ། བཅོམ་ལྡན་འདས་ཀྱིས་གསུངས་པ་ལ་མངོན་པར་བསྟོད་དོ།། །།","འཕགས་པ་ཤེས་རབ་ཀྱི་ཕ་རོལ་ཏུ་ཕྱིན་པ་རྡོ་རྗེ་གཅོད་པ་ཞེས་བྱ་བ་ཐེག་པ་ཆེན་པོའི་མདོ་རྫོགས་སོ།། །།","ན་མོ་བྷ་ག་ཝ་ཏེ། པྲ་ཛྙཱ་པ་ར་མི་ཏ་ཡེ། ཨོཾ་ན་དི་ཏད་ཡ་ཐཱ། ཨི་ལི་ཤི། ཨི་ལི་ཤི། མི་ལི་ཤི། མི་ལི་ཤི། བྷི་ན་ཡན་བྷི་ན་ཡན། ན་མོ་བྷ་ག་ཝ་ཏེ། པྲ་ཏྱཾ་པྲ་ཏི། ཨི་རི་ཏི། ཨི་རི་ཏི། མི་རི་ཏི། མི་རི་ཏི། ཤུ་རི་ཏི། ཤུ་རི་ཏི། ཨུ་ཤུ་རི། ཨུ་ཤུ་རི། བྷུ་ཡུ་ཡེ་བྷུ་ཡུ་ཡེ་སྭཱ་ཧཱ། །རྡོ་རྗེ་གཅོད་པའི་སྙིང་པོ་འདི་ལན་གཅིག་བཟླས་པས་རྡོ་རྗེ་གཅོད་པ་ཁྲི་དགུ་སྟོང་བཀླགས་པ་དང་མཉམ་པར་འགྱུར་རོ། །ཡེ་དྷརྨཱ་ཧེ་ཏུ་པྲ་བྷ་ཝཱ་ཧེ་ཏུནྟེ་ཥཱནྟ་ཐཱ་ག་ཏོ་ཧྱ་བ་དཏ། ཏེ་ཥཱཉྩ་ཡོ་ནི་རོ་དྷ་ཨེ་ཝཾ་བཱ་དཱི་མ་ཧཱ་ཤྲ་མ་ཎ་ཡེ་སྭཱ་ཧཱ། །"]}}];var Ey=[{section:0,title:{"sanskrit-devanagari":"वज्रच्छेदिका नाम त्रिशतिका प्रज्ञापारमिता"},content:{"sanskrit-devanagari":["॥नमो भगवत्या आर्यप्रज्ञापारमितायै॥"]}},{section:1,title:{},content:{"sanskrit-devanagari":["एवं मया श्रुतम्। एकस्मिन् समये भगवान् श्रावस्त्यां विहरति स्म जेतवनेऽनाथपिण्डदस्यारामे महता भिक्षुसंघेन सार्थं त्रयोदशभिर्भिक्षुशतैः संबहुलैश्च बोधिसत्त्वैर्महासत्त्वैः। अथ खलु भगवान् पूर्वाह्णकालसमये निवास्य पात्रचीवरमादाय श्रावस्तीं महानगरीं पिण्डाय प्राविक्षत्। अथ खलु भगवान् श्रावस्तीं महानगरीं पिण्डाय चरित्वा कृतभक्तकृत्यः पश्चाद्भक्तपिण्डपातप्रतिक्रान्तः पात्रचीवरं प्रतिशाम्य पादौ प्रक्षाल्य न्यषीदत्प्रज्ञप्त एवासने पर्यङ्कमाभुज्य ऋजुं कायं प्रणिधाय प्रतिमुखीं स्मृतिमुपस्थाप्य। अथ खलु संबहुला भिक्षवो येन भगवांस्तेनोपसंक्रामन्। उपसंक्रम्य भगवतः पादौ शिरोभिरभिवन्द्य भगवन्तं त्रिष्प्रदक्षिणीकृत्य एकान्ते न्यषीदन्॥१॥"]}},{section:2,title:{},content:{"sanskrit-devanagari":["तेन खलु पुनः समयेनायुष्मान् सुभुतिस्तस्यामेव पर्षदि संनिपतितोऽभूत्संनिषण्णः। अथ खल्वायुष्मान् सुभूतिरुत्थायासनादेकांसमुत्तरासङ्गं कृत्वा दक्षिणं जानुमण्डलं पृथिव्यां प्रतिष्ठाप्य येन भगवांस्तेनाञ्जलिं प्रणम्य भगवन्तमेतदवोचत्- आश्चर्यं भगवन्, परमाश्चर्यं सुगत, यावदेव तथागतेनार्हता सम्यक्संबुद्धेन बोधिसत्त्वा महासत्त्वा अनुपरिगृहीताः परमेणानुग्रहेण। आश्चर्यं भगवन् यावदेव तथागतेनार्हता सम्यक्संबुद्धेन बोधिसत्त्वा महासत्त्वाः परीन्दिताः परमया परीन्दनया। तत्कथं भगवन् बोधिसत्त्वयानसंप्रस्थितेन कुलपुत्रेण वा कुलदुहित्रा वा स्थातव्यं कथं प्रतिपत्तव्यं कथं चित्तं प्रग्रहीतव्यम् ?","एवमुक्ते भगवानायुष्मन्तं सुभूतिमेतदवोचत्- साधु साधु सुभूते, एवमेतत्सुभूते, एवमेतद्यथा वदसि। अनुपरिगृहीतास्तथागतेन बोधिसत्त्वा महासत्त्वाः परमेणानुग्रहेण। परीन्दितास्तथागतेन बोधिसत्त्वा महासत्त्वाः परमया परीन्दनया। तेन हि सुभूते शृणु, साधु च सुष्ठु च मनसि कुरु, भाषिष्येऽहं ते-यथा बोधिसत्त्वयानसंप्रस्थितेन स्थातव्यं यथा प्रतिपत्तव्यं यथा चित्तं प्रग्रहीतव्यम्। एवं भगवन् इत्यायुष्यान् सुभूतिर्भगवतः प्रत्यश्रौषीत्॥२॥"]}},{section:3,title:{},content:{"sanskrit-devanagari":["भगवानस्यैतदवोचत्-इह सुभूते बोधिसत्त्वयानसंप्रस्थितेनैव चित्तमुत्पादयितव्यम्-यावन्तः सुभूते सत्त्वाः सत्त्वधातौ सत्त्वसंग्रहेण संगृहीता अण्डजा वा जरायुजा वा संस्वेदजा वा औपपादुका वा रूपिणो वा अरूपिणो वा संज्ञिनो वा असंज्ञिनो वा नैवसंज्ञिनो नासंज्ञिनो वा, यावान् कश्चित्सत्त्वधातुः प्रज्ञप्यमानः प्रज्ञप्यते, ते च मया सर्वेऽनुपधिशेषे निर्वाणधातौ परिनिर्वापयितव्याः। एवमपरिमाणानपि सत्त्वान् परिनिर्वाप्य न कश्चित्सत्त्वः परिनिर्वापितो भवति। तत्कस्य हेतोः ? सचेत्सुभूते बोधिसत्त्वस्य सत्त्वसंज्ञा प्रवर्तेत, न स बोधिसत्त्व इति वक्तव्यः। तत्कस्य हेतोः ? न स सुभूते बोधिसत्त्वो वक्तव्यो यस्य सत्त्वसंज्ञा प्रवर्तेत, जीवसंज्ञा वा पुद्गलसंज्ञा व प्रवर्तेत॥३॥"]}},{section:4,title:{},content:{"sanskrit-devanagari":["अपि तु खलु पुनः सुभुते न बोधिसत्त्वेन वस्तुप्रतिष्ठितेन दानं दातव्यम्, न क्वचित्प्रतिष्ठितेन दानं दातव्यम्। न रूपप्रतिष्ठितेन दानं दातव्यम्। न शब्दगन्धरसस्प्रष्टव्यधर्मेषु प्रतिष्ठितेन दानं दातव्यम्। एवं हि सूभूते बोधिसत्त्वेन महासत्त्वेन दानं दातव्यं यथा न निमित्तसंज्ञायामपि प्रतितिष्ठेत्। तत्कस्य हेतोः ? यः सुभूते बोधिसत्त्वोऽप्रतिष्ठितो दानं ददाति, तस्य सुभूते पुण्यस्कन्धस्य न सुकरं प्रमाणामुद्ग्रहीतुम्। तत्किं मन्यसे सुभूते सुकरं पूर्वस्यां दिशि आकाशस्य प्रमाणमुद्ग्रहीतुम् ? सुभूतिराह-नो हीदं भगवन्। भगवानाह- एवं दक्षिणपश्चिमोत्तरासु अध ऊर्ध्वं दिग्विदिक्षु समन्ताद्दशसु दिक्षु सुकरमाकाशस्य प्रमाणमुद्ग्रहीतुम् ? सुभूतिराह-नो हीदं भगवन्। भगवानाह-एवमेव सुभूते यो बोधिसत्त्वोऽप्रतिष्ठितो दानं ददाति, तस्य सुभूते पुण्यस्कन्धस्य न सुकरं प्रमाणमुद्ग्रहीतुम्। एवं हि सुभूते बोधिसत्त्वयानसंप्रस्थितेन दानं दातव्यं यथा न निमित्तसंज्ञायामपि प्रतितिष्ठेत्॥४॥"]}},{section:5,title:{},content:{"sanskrit-devanagari":["तत्किं मन्यसे सुभूते लक्षणसंपदा तथागतो द्रष्टव्यः ? सुभूतिराह-नो हीदं भगवन्। न लक्षणसंपदा तथागतो द्रष्टव्यः। तत्कस्य हेतोः ? या सा भगवन् लक्षणसंपत्तथागतेन भाषिता सैवालक्षणसंपत्। एवमुक्ते भगवानायुष्मन्तं सुभूतिमेतदवोचत् यावत्सुभूते लक्षणसंपत् तावन्मृषा, यावदलक्षणसंपत् तावन्न मृषेति हि लक्षणालक्षणतस्तथागतो द्रष्टव्यः॥५॥"]}},{section:6,title:{},content:{"sanskrit-devanagari":["एवमुक्ते आयुष्मान् सुभूतिर्भगवन्तमेतदवोचत्- अस्ति भगवन्। केचित्सत्त्वा भविष्यन्त्यनागतेऽध्वनि पश्चिमे काले पश्चिमे समये पश्चिमायां पञ्चशत्यां सद्धर्मविप्रलोपकाले वर्तमाने, ये इमेष्वेवंरूपेषु सूत्रान्तपदेषु भाष्यमाणेषु भूतसंज्ञामुत्पादयिष्यन्ति। अपि तु खलु पुनः सुभूते भविष्यन्त्यनागतेऽध्वनि बोधिसत्त्वा महासत्त्वाः पश्चिमे काले पश्चिमे समये पश्चिमायां पञ्चशत्यां सद्धर्मविप्रलोपे वर्तमाने गुणवन्तः शीलवन्तः प्रज्ञावन्तश्च भविष्यन्ति, ये इमेष्वेवंरूपेषु सूत्रान्तपदेषु भाष्यमाणेषु भूतसंज्ञामुत्पादयिष्यन्ति। न खलु पुनस्ते सुभूते बोधिसत्त्वा महासत्त्वा एकबुद्धपर्युपासिता भविष्यन्ति, नैकबुद्धावरोपितकुशलमूला भविष्यन्ति। अपि तु खलु पुनः सुभूते अनेकबुद्धशतसहस्रपर्युपासिता अनेकबुद्धशतसहस्रावरोपितकुशलमूलास्ते बोधिसत्त्वा महासत्त्वा भविष्यन्ति, ये इमेष्वेवंरूपेषु सूत्रान्तपदेषु भाष्यमाणेषु एकचित्तप्रसादमपि प्रतिलप्स्यन्ते। ज्ञातास्ते सुभूते तथागतेन बुद्धज्ञानेन, दृष्टास्ते सुभूते तथागतेन बुद्धचक्षुषा, बुद्धास्ते सुभूते तथागतेन। सर्वे ते सुभूते अप्रमेयमसंख्येयं पुण्यस्कन्धं प्रसविष्यन्ति प्रतिग्रहीष्यन्ति। तत्कस्य हेतोः ? न हि सुभूते तेषां बोधिसत्त्वानां महासत्त्वानामात्मसंज्ञा प्रवर्तते, न सत्त्वसंज्ञा, न जीवसंज्ञा, न पुद्गलसंज्ञा प्रवर्तते। नापि तेषां सुभूते बोधिसत्त्वानां महासत्त्वानां धर्मसंज्ञा प्रवर्तते। एवं नाधर्मसंज्ञा। नापि तेषां सुभूते संज्ञा नासंज्ञा प्रवर्तते। तत्कस्य हेतोः ? सचेत्सुभूते तेषां बोधिसत्त्वानां महासत्त्वानां धर्मसंज्ञा प्रवर्तेत, स एव तेषामात्मग्राहो भवेत्, सत्त्वग्राहो जीवग्राहः पुद्गलग्राहो भवेत्। सचेदधर्मसंज्ञा प्रवर्तेत, स एव तेषामात्मग्राहो भवेत्, सत्त्वग्राहो जीवग्राहः पुद्गलग्राह इति। तत्कस्य हेतोः ? न खलु पुनः सुभूते बोधिसत्त्वेन महासत्त्वेन धर्म उद्ग्रहीतव्यो नाधर्मः। तस्मादियं तथागतेन संधाय वाग्भाषिता-कोलोपमं धर्मपर्यायमाजानद्भिधर्मा एव प्रहातव्याः प्रागेवाधर्मा इति॥६॥"]}},{section:7,title:{},content:{"sanskrit-devanagari":["पुनरपरं भगवानायुष्मन्तं सुभूतिमेतदवोचत्- तत्किं मन्यसे सुभूते, अस्ति स कश्चिद्धर्मो यस्तथागतेनानुत्तरा सम्यक्संबोधिरित्यभिसंबुद्धः, कश्चिद्वा धर्मस्तथागतेन देशितः ? एवमुक्ते आयुष्मान् सुभूतिर्भगवन्तमेतदवोचत्-यथाहं भगवन् भगवतो भाषितस्यार्थमाजानामि, नास्ति स कश्चिद्धर्मो यस्तथागतेन अनुत्तरा सम्यक्संबोधिरित्यभिसंबुद्धः, नास्ति धर्मो यस्तथागतेन देशितः। तत्कस्य हेतोः ? योऽसौ तथागतेन धर्मोऽभिसंबुद्धो देशितो वा, अग्राह्यः सोऽनभिलप्यः। न स धर्मो नाधर्मः। तत्कस्य हेतोः ? असंस्कृतप्रभाविता ह्यार्यपुद्गलाः॥७॥"]}},{section:8,title:{},content:{"sanskrit-devanagari":["भगवानाह- तत्किं मन्यसे सुभूते यः कश्चित्कुलपुत्रो वा कुलदुहिता वा इमं त्रिसाहस्रमहासाहस्रं लोकधातुं सप्तरत्नपरिपूर्णं कृत्वा तथागतेभ्योऽर्हद्भयः सम्यक्संबुद्धेभ्यो दानं दद्यात्, अपि नु स कुलपुत्रो वा कुलदुहिता वा ततोनिदानं बहु पुण्यस्कन्धं प्रसुनुयात्। सुभूतिराह-बहु भगवन्, बहु सुगत स कुलपुत्रो वा कुलदुहिता वा ततोनिदानं पुण्यस्कन्धं प्रसुनुयात्। तत्कस्य हेतोः ? योऽसौ भगवन् पुण्यस्कन्धस्तथागतेन भाषितः, अस्कन्धः स तथागतेन भाषितः। तस्मात्तथागतो भाषते- पुण्यस्कन्धः पुण्यस्कन्ध इति। भगवानाह-यश्च खलु पुनः सुभूते कुलपुत्रो वा कुलदुहिता व इमं त्रिसाहस्रमहासाहस्रं लोकधातुं सप्तरत्नपरिपूर्णं कृत्वा तथागतेभ्योऽर्हद्भयः सम्यक्संबुद्धेभ्यो दानं दद्यात्, यश्च इतो धर्मपर्यायादन्तशश्चतुष्पादिकामपि गाथामुद्गृह्य परेभ्यो विस्तरेण देशयेत् संप्रकाशयेत्, अयमेव ततोनिदानं बहुतरं पुण्यस्कन्धं प्रसुनुयादप्रमेयमसंख्येयम्। तत्कस्य हेतोः ? अतोनिर्जाता हि सुभूते तथागतानामर्हतां सम्यक्संबुद्धानामनुत्तरा सम्यक्संबोधिः, अतोनिर्जाताश्च बुद्धा भगवन्तः। तत्कस्य हेतोः ? बुद्धधर्मा बुद्धधर्मा इति सुभूते अबुद्धधर्माश्चैव ते तथागतेन भाषिताः। तेनोच्यन्ते बुद्धधर्मा इति॥८॥"]}},{section:9,title:{},content:{"sanskrit-devanagari":["तत्किं मन्यसे सुभूते अपि नु स्रोतआपन्नस्यैवं भवति-मया स्रोतआपत्तिफलं प्राप्तमिति? सुभूतिराह-नो हीदं भगवन्। न स्रोतआपन्नस्यैवं भवति-मया स्रोतआपत्तिफलं प्राप्तमिति। तत्कस्य हेतोः ? न हि स भगवन् कंचिद्धर्ममापन्नः, तेनोच्यते स्रोतआपन्न इति। न रूपमापन्नो न शब्दान् न गन्धान् न रसान् न स्प्रष्टव्यान् धर्मानापन्नः। तेनोच्यते स्रोतआपन्न इति। सचेद्भगवन् स्रोतआपन्नस्यैवं भवेत्- मया स्रोतआपत्तिफलं प्राप्तमिति, स एव तस्यात्मग्राहो भवेत्, सत्त्वग्राहो जीवग्राहः पुद्गलग्राहो भवेदिति॥","भगवानाह- तकिं मन्यसे सुभूते अपि नु सकृदागामिन एवं भवति-मया सकृदागामिफलं प्राप्तमिति ? सुभूतिराह-नो हीदं भगवन्। स सकृदागामिन एवं भवति-मया सकृदागामिफलं प्राप्तमिति। तत्कस्य हेतोः ? न हि स कश्चिद्धर्मो यः सकृदागामित्वमापन्नः। तेनोच्यते सकृदागामीति॥","भगवानाह-तत्किं मन्यसे सुभूते अपि नु अनागामिन एवं भवति-मयानागामिफलं प्राप्तमिति ? सुभूतिराह-नो हीदं भगवन्। न अनागामिन एवं भवति-मया अनागामिफलं प्राप्तमिति। तत्कस्य हेतोः ? न हि स भगवन् कश्चिद्धर्मो योऽनागामित्वमापन्नः। तेनोच्यते अनागामीति॥","भगवानाह- तत्किं मन्यसे सुभूते अपि नु अर्हत एवं भवति-मया अर्हत्त्वं प्राप्तमिति ? सुभूतिराह-नो हीदं भगवन्। नार्हत एवं भवति-मया अर्हत्त्वं प्राप्तमिति। तत्कस्य हेतोः ? न हि स भगवन् कश्चिद्धर्मो योऽर्हन्नाम। तेनोच्यते-अर्हन्निति। सचेद्भगवन् अर्हत एवं भवेत्-मया अर्हत्त्वं प्राप्तमिति, स एव तस्यात्मग्राहो भवेत्, सत्त्वग्राहो जीवग्राहः पुद्गलग्राहो भवेत्। तत्कस्य हेतोः ? अहमस्मि भगवंस्तथागतेनार्हता सम्यक्संबुद्धेन अरणाविहारिणामग्र्यो निर्दिष्टः। अहमस्मि भगवन् अर्हन् वीतरागः। न च मे भगवन्नेवं भवति- अर्हन्नस्म्यहं वीतराग इति। सचेन्मम भगवन्नेवं भवेत्-मया अर्हत्त्वं प्राप्तमिति, न मां तथागतो व्याकरिष्यदरणाविहारिणामग्र्यः सुभूतिः कुलपुत्रो न क्वचिद्विहरति, तेनोच्यते अरणाविहारी अरणाविहारीति॥९॥"]}},{section:10,title:{},content:{"sanskrit-devanagari":["भगवानाह-तत्किं मन्यसे सुभूते-अस्ति स कश्चिद्धर्मो यस्तथागतेन दीपंकरस्य तथागतस्यार्हत-सम्यक्संबुद्धस्यान्तिकादुद्गृहीतः? सुभूतिराह- नो हीदं भगवन्। नास्ति स कश्चिद्धर्मो यस्तथागतेन दीपंकरस्य तथागतस्यार्हतः सम्यक्संबुद्धस्यान्तिकादुद्गृहीतः॥","भगवानाह-यः कश्चित्सुभूते बोधिसत्त्व एवं वदेत्-अहं क्षेत्रव्यूहान् निष्पादयिष्यामीति, स वितथं वदेत्। तत्कस्य हेतोः ? क्षेत्रव्यूहाः क्षेत्रव्यूहा इति सुभूते अव्यूहास्ते तथागतेन भाषिताः। तेनोच्यन्ते क्षेत्रव्यूहा इति। तस्मात्तर्हि सुभूते बोधिसत्त्वेन महासत्त्वेन एवमप्रतिष्ठितं चित्तमुत्पादयितव्यं यन्न क्वचित्प्रतिष्ठितं चित्तमुत्पादयितव्यम्। न रूपप्रतिष्ठितं चित्तमुत्पादयितव्यं न शब्दगन्धरसस्प्रष्टव्यधर्मप्रतिष्ठितं चित्तमुत्पादयितव्यम्। तद्यथापि नाम सुभूते पुरुषो भवेदुपेतकायो महाकायो यत्तस्यैवं रूप आत्मभावः स्यात् तद्यथापि नाम सुमेरुः पर्वतराजः। तत्किं मन्यसे सुभूते अपि नु महान् स आत्मभावो भवेत् ? सुभूतिराह-महान् स भगवान्, महान् सुगत स आत्मभावो भवेत्। तत्कस्य हेतोः ? आत्मभाव आत्मभाव इति भगवन् न भावः स तथागतेन भाषितः। तेनोच्यत आत्मभाव इति। न हि भगवन् स भावो नाभावः। तेनोच्यते आत्मभाव इति॥१०॥"]}},{section:11,title:{},content:{"sanskrit-devanagari":["भगवानाह- तत्किं मन्यसे सुभूते-यावत्यो गङ्गायां महानद्यां वालुकास्तावत्य एव गङ्गानद्यो भवेयुः ? तासु या वालुकाः, अपि नु ता बह्वयो भवेयुः ? सुभूतिराह-ता एव तावद्भगवन् बह्वयो गङ्गानद्यो भवेयुः, प्रागेव यास्तासु गङ्गानदीषु वालुकाः। भगवानाह- आरोचयामि ते सुभूते, प्रतिवेदयामि ते। यावत्यस्तासु गङ्गानदीषु वालुका भवेयुस्तावतो लोकधातून् कश्चिदेव स्त्री वा पुरुषो वा सप्तरत्नपरिपुर्णं कृत्वा तथागतेभ्योऽर्हद्भयः सम्यक्संबुद्धेभ्यो दानं दद्यात्, तत् किं मन्यसे सुभूते-अपi नु सा स्त्री वा पुरुषो वा ततोनिदानं बहु पुण्यस्कन्धं प्रसुनुयात् ? सुभूतिराह-बहु भगवन्, बहु सुगत स्त्री वा पुरुषो वा ततोनिदानं पुण्यस्कन्धं प्रसुनुयादप्रमेयमसंख्येयम्। भगवानाह- यश्च खलु पुनः सुभूते स्त्री वा पुरुषो वा तावतो लोकधातून् सप्तरत्नपरिपूर्णं कृत्वा तथागतेभ्योऽर्हद्भयः सम्यक्संबुद्धेभ्यो दानं दद्यात्, यश्च कुलपुत्रो वा कुलदुहिता वा इतो धर्मपर्यायादन्तशश्चतुष्पादिकामपि गाथामुद्गृह्य परेभ्यो देशयेत् संप्रकाशयेत्, अयमेव ततोनिदानं बहुतरं पुण्यस्कन्धं प्रसुनुयादप्रमेयमसंख्येयम्॥११॥"]}},{section:12,title:{},content:{"sanskrit-devanagari":["अपि तु खलु पुनः सुभुते यस्मिन् पृथिवीप्रदेशे इतो धर्मपर्यायादन्तशश्चतुष्पादिकामपि गाथामुद्गृह्य भाष्येत वा संप्रकाश्येत वा, स पृथिवीप्रदेशश्चैत्यभूतो भवेत् सदेवमानुषासुरस्य लोकस्य, कः पुनर्वादो ये इमं धर्मपर्यायं सकलसमाप्तं धारयिष्यन्ति वाचयिष्यन्ति पर्यवाप्स्यन्ति, परेभ्यश्च विस्तरेण संप्रकाशयिष्यन्ति। परमेण ते सुभूते आश्चर्येण समन्वागता भविष्यन्ति। तस्मिंश्च सुभूते पृथिवीप्रदेशे शास्ता विहरत्यन्यतरान्यतरो वा विज्ञगुरुस्थानीयः॥१२॥"]}},{section:13,title:{},content:{"sanskrit-devanagari":["एवमुक्ते आयुष्मान् सुभूतिर्भगवन्तमेतदवोचत्-को नाम अयं भगवन् धर्मपर्यायः, कथं चैनं धारयामि ? एवमुक्ते भगवानायुष्मन्तं सुभूतिमेतदवोचत्- प्रज्ञापारमिता नामायं सुभूते धर्मपर्यायः। एवं चैनं धारय। तत्कस्य हेतोः ? यैव सुभूते प्रज्ञापारमिता तथागतेन भाषिता, सैव अपारमिता तथागतेन भाषिता। तेनोच्यते प्रज्ञापारमितेति॥","तत्किं मन्यसे सुभूते-अपि नु अस्ति स कश्चिद्धर्मो यस्तथागतेन भाषितः ? सुभूतिराह-नो हीदं भगवन्। नास्ति स कश्चिद्धर्मो यस्तथागतेन भाषितः॥","भगवानाह-तत्किं मन्यसे सुभूते-यावत् त्रिसाहस्रमहासाहस्रे लोकधातौ पृथिवीरजः कच्चित्, तद्बहु भवेत् ? सुभूतिराह-बहु भगवन्, बहु सुगत पृथिवीरजो भवेत्। तत्कस्य हेतोः ? यत्तद्भगवन् पृथिवीरजस्तथागतेन भाषितम्, अरजस्तद्भगवंस्तथागतेन भाषितम्। तेनोच्यते पृथिवीरज इति। योऽप्यसौ लोकधातुस्तथागतेन भाषितः, अधातुः स तथागतेन भाषितः। तेनोच्यते लोकधातुरिति॥","भगवानाह- तत्किं मन्यसे सुभूते द्वात्रिंशन्महापुरुषलक्षणैस्तथागतोऽर्हन् सम्यक्संबुद्धो द्रष्टव्यः ? सुभूतिराह-नो हीदं भगवन्। द्वात्रिंशन्महापुरुषलक्षणैस्तथागतोऽर्हन् सम्यक्संबुद्धो द्रष्टव्यः। तत्कस्य हेतोः ? यानि हि तानि भगवन् द्वात्रिंशन्महापुरुषलक्षणानि तथागतेन भाषितानि, अलक्षणानि तानि भगवंस्तथागतेन भाषितानि। तेनोच्यन्ते द्वात्रिंशन्महापुरुषलक्षणानीति॥","भगवानाह-यश्च खलु पुनः सुभूते स्त्री वा पुरुषो वा दिने दिने गङ्गानदीवालुकासमानात्मभावान् परित्यजेत्, एवं परित्यजन् गङ्गानदीवालुकासमान् कल्पांस्तानात्मभावान् परित्यजेत्, यश्च इतो धर्मपर्यायादन्तशश्चतुष्पादिकामपि गाथामुद्गृह्यपरेभ्यो देशयेत् संप्रकाशयेत्, अयमेव ततोनिदानं बहुतरं पुण्यस्कन्धं प्रसुनुयादप्रमेयमसंख्येयम्॥१३॥"]}},{section:14,title:{},content:{"sanskrit-devanagari":["अथ खल्वायुष्मान् सुभूतिर्धर्मवेगेनाश्रूणि प्रामुञ्चत्। सोऽश्रूणि प्रमृज्य भगवन्तमेतदवोचत्-आश्चर्यं भगवन्, परमाश्चर्यं सुगत, यावदयं धर्मपर्यायस्तथागतेन भाषितोऽग्रयानसंप्रस्थितानां सत्त्वानामर्थाय, श्रेष्ठयानसंप्रस्थितानामर्थाय, यतो मे भगवन् ज्ञानमुत्पन्नम्। न मया भगवन् जात्वेवंरूपो धर्मपर्यायः श्रुतपूर्वः। परमेण ते भगवन् आश्चर्येण समन्वागता बोधिसत्त्वा भविष्यन्ति, ये इह सूत्रे भाष्यमाणे श्रुत्वा भूतसंज्ञामुत्पादयिष्यन्ति। तत्कस्य हेतोः ? या चैषा भगवन् भूतसंज्ञा, सैव अभूतसंज्ञा। तस्मात्तथागतो भाषतेभूतसंज्ञा भूतसंज्ञेति॥","न मम भगवन् आश्चर्यं यदहमिमं धर्मपर्यायं भाष्यमाणमवकल्पयामि अधिमुच्ये। येऽपि ते भगवन् सत्त्वा भविष्यन्त्यनागतेऽध्वनि पश्चिमे काले पश्चिमे समये पश्चिमायां पञ्चशत्यां सद्धर्मविप्रलोपे वर्तमाने, ये इमं भगवन् धर्मपर्यायमुद्ग्रहीष्यन्ति धारयिष्यन्ति वाचयिष्यन्ति पर्यवाप्स्यन्ति, परेभ्यश्च विस्तरेण संप्रकाशयिष्यन्ति, ते परमाश्चर्येण समन्वागता भविष्यन्ति। अपि तु खलु पुनर्भगवन् न तेषामात्मसंज्ञा प्रवर्तिष्यते, न सत्त्वसंज्ञा न जीवसंज्ञा न पुद्गलसंज्ञा प्रवर्तिष्यते, नापि तेषां काचित्संज्ञा नासंज्ञा प्रवर्तते। तत्कस्य हेतोः ? या सा भगवन् आत्मसंज्ञा, सैवासंज्ञा। या सत्त्वसंज्ञा जीवसंज्ञा पुद्गलसंज्ञा, सैवासंज्ञा। तत्कस्य हेतोः ? सर्वसंज्ञापगता हि बुद्ध भगवन्तः॥","एवमुक्ते भगवानायुष्मन्तं सुभूतिमेतदवोचत्-एवमेतत् सुभूते, एवमेतत्। परमाश्चर्यसमन्वागतास्ते सत्त्वा भविष्यन्ति, ये इह सुभूते सूत्रे भाष्यमाणे नोत्रसिष्यन्ति न संत्रसिष्यन्ति न संत्रासमापत्स्यन्ते। तत्कस्य हेतोः ? परमपारमितेयं सुभूते तथागतेन भाषिता यदुतापारमिता। यां च सुभूते तथागतः परमपारमितां भाषते, तामपरिमाणा अपि बुद्धा भगवन्तो भाषन्ते। तेनोच्यन्ते परमपारमितेति॥"]}},{section:15,title:{},content:{"sanskrit-devanagari":["यश्च खलु पुनः सुभूते स्त्री वा पुरुषो वा पुर्वाह्णकालसमये गङ्गानदीवालुकासमानात्मभावान् परित्यजेत्, एवं मध्याह्नकालसमये गङ्गानदीवालुकासमानात्मभावान् परित्यजेत्, सायाह्नकालसमये गङ्गानदीवालुकासमानात्मभावान् परित्यजेत्, अनेन पर्यायेण बहूनि कल्पकोटिनियुतशतसहस्राण्यात्मभावान् परित्यजेत्, यश्चेमं धर्मपर्यायं श्रुत्वा न प्रतिक्षिपेत्, अयमेव ततोनिदानं बहुतरं पुण्यस्कन्धं प्रसुनुयादप्रमेयमसंख्येयम्, कः पुनर्वादो यो लिखित्वा उद्गृह्णीयाद्धारयेद्वाचयेत्पर्यवाप्नुयात्, परेभ्यश्च विस्तरेण संप्रकाशयेत्॥","अपि तु खलु पुनः सुभूते अचिन्त्योऽतुल्योऽयं धर्मपर्यायः। अयं च सुभूते धर्मपर्यायस्तथागतेन भाषितोऽग्रयानसंप्रस्थितानां सत्त्वानामर्थाय, श्रेष्ठयानसंप्रस्थितानां सत्त्वानामर्थाय। ये इमं धर्मपर्यायमुद्ग्रहीष्यन्ति धारयिष्यन्ति वाचयिष्यन्ति पर्यवाप्स्यन्ति, परेभ्यश्च विस्तरेण संप्रकाशयिष्यन्ति, ज्ञातास्ते सुभूते तथागतेन बुद्धज्ञानेन, दृष्टास्ते सुभूते तथागतेन बुद्धचक्षुषा, बुद्धास्ते तथागतेन। सर्वे ते सुभूते सत्त्वा अप्रमेयेण पुण्यस्कन्धेनां समन्वागता भविष्यन्ति। अचिन्त्येनातुल्येनामाप्येनापरिमाणेन पुण्यस्कन्धेन समन्वागता भविष्यन्ति। सर्वे ते सुभूते सत्त्वाः समांशेन बोधिं धारयिष्यन्ति वचयिष्यन्ति पर्यवाप्स्यन्ति। तत्कस्य हेतोः ? न हि शक्यं सुभूते अयं धर्मपर्यायो हीनाधिमुक्तिकैः सत्त्वैः श्रोतुम्, नात्मदृष्टिकैर्न सत्त्वदृष्टिकैर्न जीवदृष्टिकैर्न पुद्गलदृष्टिकैः। नाबोधिसत्त्वप्रतिज्ञै सत्त्वैः शक्यमयं धर्मपर्यायः श्रोतुं वा उद्ग्रहीतुं वा धारयितुं वा वाचयितुं वा पर्यवाप्तुं वा। नेदं स्थानं विद्यते॥","अपि तु खलु पुनः सुभूते यत्र पृथिवीप्रदेशे इदं सूत्रं प्रकशयिष्यते, पूजनीयः स पृथिवीप्रदेशो भविष्यति सदेवमानुषासुरस्य लोकस्य। वन्दनीयः प्रदक्षिणीयश्च स पृथिवीप्रदेशो भविष्यति, चैत्यभूतः स पृथिवीप्रदेशो भविष्यति॥१५॥"]}},{section:16,title:{},content:{"sanskrit-devanagari":["अपि तु ये ते सुभूते कुलपुत्रा वा कुलदुहितरो वा इमानेवंरूपान् सूत्रान्तानुद्ग्रहीष्यन्ति धारयिष्यन्ति वाचयिष्यन्ति पर्यवाप्स्यन्ति, योनिशश्च मनसिकरिष्यन्ति, परेभ्यश्च विस्तरेण संप्रकाशयिष्यन्ति, ते परिभूता भविष्यन्ति, सुपरिभूताश्च भविष्यन्ति। तत्कस्य हेतोः ? यानि च तेषां सुभूते सत्त्वानां पौर्वजन्मिकान्यशुभानि कर्माणि कृतान्यपायसंवर्तनीयानि, दृष्ट एव धर्मे परिभूततया तानि पौर्वजन्मिकान्यशुभानि कर्माणि क्षपयिष्यन्ति, बुद्धबोधिं चानुप्राप्स्यन्ति॥","अभिजानाम्यहं सुभूते अतीतेऽध्वन्यसंख्येयैः कल्पैरसंख्येयतरैर्दीपंकरस्य तथागतस्यार्हतः सम्यक्संबुद्धस्य परेण परतरेण चतुरशीतिबुद्धकोटिनियुतशतसहस्राण्यभूवन् ये मयारागिताः, आराग्य न विरागिताः। यच्च मया सुभूते ते बुद्धा भगवन्त आरागिताः, आराग्य न विरागिताः, यच्च पश्चिमे काले पश्चिमे समये पश्चिमायां पञ्चशत्यां सद्धर्मविप्रलोपकाले वर्तमाने इमानेवंरूपान् सूत्रान्तानुद्ग्रहीष्यन्ति धारयिष्यन्ति वाचयिष्यन्ति पर्यवाप्स्यन्ति, परेभ्यश्च विस्तरेण संप्रकाशयिष्यन्ति, अस्य खलु पुनः सुभूते पुण्यस्कन्धस्यान्तिकादसौ पौर्वकः पुण्यस्कन्धः शततमीमपि कलां नोपैति, सहस्रतमीमपि शतसहस्रतमीमपि कोटिममिपि कोटिशततमीमपि कोटिशतसहस्रतमीमपि कोटिनियुतशतसहस्रतमीमपि। संख्यामपि कलामपि गणनामपि उपमामपि उपनिषदमपि यावदौपम्यमपि न क्षमते॥","सचेत्पुनः सुभूते तेषां कुलपुत्राणां कुलदुहितॄणां वा अहं पुण्यस्कन्धं भाषेयम्, यावत्ते कुलपुत्रा वा कुलदुहितरो वा तस्मिन् समये पुण्यस्कन्धं प्रसविष्यन्ति, प्रतिग्रहीष्यन्ति, उन्मादं सत्त्वा अनुप्राप्नुयुश्चित्तविक्षेपं वा गच्छेयुः। अपि तु खलु पुनः सुभूते अचिन्त्योऽतुल्योऽयं धर्मपर्यायस्तथागतेन भाषितः। अस्य अचिन्त्य एव विपाकः प्रतिकाङ्क्षितव्यः॥१६॥"]}},{section:17,title:{},content:{"sanskrit-devanagari":["अथ खल्वायुष्मान् सुभूतिर्भगवन्तमेतदवोचत्-कथं भगवन् बोधिसत्त्वयानसंप्रस्थितेन स्थातव्यम्, कथं प्रतिपत्तव्यम्, कथं चित्तं प्रग्रहीतव्यम् ? भगवानाह-इह सुभूते बोधिसत्त्वयानसंप्रस्थितेन एवं चित्तमुत्पादयितव्यम्-सर्वे सत्त्वा मया अनुपधिशेषे निर्वाणधातौ परिनिर्वापयितव्याः। एवं स सत्त्वान् परिनिर्वाप्य न कश्चित्सत्त्वः परिनिर्वापितो भवति। तत्कस्य हेतोः ? सचेत्सुभूते बोधिसत्त्वस्य सत्त्वसंज्ञा प्रवर्तेत, न स बोधिसत्त्व इति वक्तव्यः। जीवसंज्ञा वा यावत्पुद्गलसंज्ञा वा प्रवर्तेत, न स बोधिसत्त्व इति वक्तव्यः। तत्कस्य हेतोः ? नास्ति सुभूते स कश्चिद्धर्मो यो बोधिसत्त्वयानसंप्रस्थितो नाम॥","तत्किं मन्यसे सुभूते अस्ति स कश्चिद्धर्मो यस्तथागतेन दीपंकरस्य तथागतस्यान्तिकादनुत्तरां सम्यक्संबोधिमभिसंबुद्धः ? एवमुक्ते आयुष्मान् सुभूतिर्भगवन्तमेतदवोचत्- यथाहं भगवतो भाषितस्यार्थमाजानामि, नास्ति स भगवन् कश्चिद्धर्मो यस्तथागतेन दीपंकरस्य तथागतस्यार्हतः सम्यक्संबुद्धस्यान्तिकादनुत्तरां सम्यक्संबोधिमभिसंबुद्धः। एवमुक्ते भगवानायुष्मन्तं सुभूतिमेतदवोचत्-एवमेतत्सुभूते, एवमेतत्। नास्ति सुभूते स कश्चिद्धर्मो यस्तथागतेन दीपंकरस्य तथागतस्यार्हतः सम्यक्संबुद्धस्यान्तिकादनुत्तरां सम्यक्संबोधिमभिसंबुद्धः। सचेत्पुनः सुभूते कश्चिद्धर्मस्तथागतेनाभिसंबुद्धोऽभविष्यत्, न मां दीपंकरस्तथागतो व्याकरिष्यत्-भविष्यसि त्वं माणव अनागतेऽध्वनि शाक्यमुनिर्नाम तथागतोऽर्हन् सम्यक्संबुद्ध इति। यस्मात्तर्हि सुभूते तथागतेनार्हता सम्यक्संबुद्धेन नास्ति स कश्चिद्धर्मो योऽनुत्तरां सम्यक्संबोधिमभिसंबुद्धः, तस्मादहं दीपंकरेण तथागतेन व्याकृत- भविष्यसि त्वं माणव अनागतेऽध्वनि शाक्यमुनिर्नाम तथागतोऽर्हन् सम्यक्संबुद्ध। तत्कस्य हेतोः ? तथागत इति सुभूते भूततथताया एतदधिवचनम्। तथागत इति सुभूते अनुत्पादधर्मताया एतदधिवचनम्। तथागत इति सुभूते धर्मोच्छेदस्यैतदधिवचनम्। तथागत इति सुभूते अत्यन्तानुत्पन्नस्यैतदधिवचनम्। तत्कस्य हेतोः ? एष सुभूते अनुत्पादो यः परमार्थः। यः कश्चित्सुभूते एवं वदेत्-तथागतेनार्हता सम्यक्संबुद्धेन अनुत्तरा सम्यक्संबोधिरभिसंबुद्धेति, स वितथं वदेत्। अभ्याचक्षीत मां स सुभूते असतोद्गृहीतेन। तत्कस्य हेतोः- ? नास्ति सुभूते स कश्चिद्धर्मो यस्तथागतेन अनुत्तरां सम्यक्संबोधिमभिसंबुद्धः। यश्च सुभूते तथागतेन धर्मोऽभिसंबुद्धो देशितो वा तत्र न सत्यं न मृषा। तस्मात्तथागतो भाषते-सर्वधर्मा बुद्धधर्मा इति। तत्कस्य हेतोः ? सर्वधर्मा इति सुभूते अधर्मास्तथागतेन भाषिताः। तस्मादुच्यन्ते सर्वधर्मा बुद्धधर्मा इति॥","तद्यथापि नाम सुभूते पुरुषो भवेदुपेतकायो महाकायः ? आयुष्मान् सुभूतिराह- योऽसौ भगवंस्तथागतेन पुरुषो भाषित उपेतकायो महाकाय इति, अकायः स भगवंस्तथागतेन भाषितः। तेनोच्यते उपेतकायो महाकाय इति॥","भगवानाह -एवमेतत्सुभूते। यो बोधिसत्त्व एवं वदेत्-अहं सत्त्वान् परिनिर्वापयिष्यामिति, न स बोधिसत्त्व इति वक्तव्यः। तत्कस्य हेतोः ? अस्ति सुभूते स कश्चिद्धर्मो यो बोधिसत्त्वो नाम ? सुभूतिराह-नो हीदं भगवन्। नास्ति स कश्चिद्धर्मो यो बोधिसत्त्वो नाम। भगवानाह- सत्त्वाः सत्त्वा इति सुभूते असत्त्वास्ते तथागतेन भाषिताः, तेनोच्यन्ते सत्त्वा इति। तस्मात्तथागतो भाषते-निरात्मानः सर्वधर्मा निर्जीवा निष्पोषा निष्पुद्गलाः सर्वधर्मा इति॥","यः सुभूते बोधिसत्त्व एवं वदेत्- अहं क्षेत्रव्यूहान्निष्पादयिष्यामीति, स वितथं वदेत्। तत्कस्य हेतोः ? क्षेत्रव्यूहाः क्षेत्रव्यूहा इति सुभूते अव्यूहास्ते तथागतेन भाषिताः। तेनोच्यन्ते क्षेत्रव्यूहा इति॥","यः सुभूते बोधिसत्त्वो निरात्मानो धर्मा निरात्मानो धर्मा इत्यधिमुच्यते, तथागतेनार्हता सम्यक्संबुद्धेन बोधिसत्त्वो महासत्त्व इत्याख्यातः॥१७॥"]}},{section:18,title:{},content:{"sanskrit-devanagari":["भगवानाह-तत्किं मन्यसे सुभूते-संविद्यते तथागतस्य मांसचक्षुः ? सुभूतिराह- एवमेतद्भगवन्, संविद्यते तथागतस्य मांसचक्षुः। भगवानाह-तत्किं मन्यसे सुभूते संविद्यते तथागतस्य दिव्यं चक्षुः ? सुभूतिराह-एवमेतद्भगवन्, संविद्यते तथागतस्य दिव्यं चक्षुः। भगवानाह-तत्किं मन्यसे सुभूते संविद्यते तथागतस्य प्रज्ञाचक्षुः ? सुभूतिराह-एवमेतद्भगवन्, संविद्यते तथागतस्य प्रज्ञाचक्षुः। भगवानाह-तत्किं मन्यसे सुभूते संविद्यते तथागतस्य धर्मचक्षुः ? सुभूतिराह-एवमेतद्भगवन्, संविद्यते तथागतस्य धर्मचक्षुः। भगवानाह- तत्किं मन्यसे सुभूते संविद्यते तथागतस्य बुद्धचक्षुः ? सुभूतिराह-एवमेतद्भगवन्, संविद्यते तथागत बुद्धचक्षुः।","भगवानाह-तत्किं मन्यसे सुभूते यावन्त्यो गङ्गायां महानद्यां वालुकाः, अपि नु ता वालुकास्तथागतेन भाषिताः ? सुभूतिराह-एवमेतद्भगवन्, एवमेतत् सुगत। भाषितास्तथागतेन वालुकाः। भगवानाह-तत्किं मन्यसे सुभूते यावत्यो गङ्गायां महानद्यां वालुकाः, तावत्य एव गङ्गानद्यो भवेयुः, तासु वा वालुकाः, तावन्तश्च लोकधातवो भवेयुः, कच्चिद्बहवस्ते लोकधातवो भवेयुः ? सुभूतिराह-एवमेतद्भगवन्, एवमेतत् सुगत। बहवस्ते लोकधातवो भवेयुः। भगवानाह-यावन्तः सुभूते तेषु लोकधातुषु सत्त्वाः, तेषामहं नानाभावां चित्तधारां प्रजानामि। तत्कस्य हेतोः ? चित्तधारा चित्तधारेति सुभूते अधारैषा तथागतेन भाषिता, तेनोच्यते चित्तधारेति। तत्कस्य हेतोः ? अतीतं सुभूते चित्तं नोपलभ्यते। अनागतं चित्तं नोपलभ्यते। प्रत्युत्पन्नं चित्तं नोपलभ्यते॥१८॥"]}},{section:19,title:{},content:{"sanskrit-devanagari":["तत्किं मन्यसे सुभूते यः कश्चित्कुलपुत्रो वा कुलदुहिता वा इमं त्रिसाहस्रमहासाहस्रं लोकधातुं सप्तरत्नपरिपूर्णं कृत्वा तथागतेभ्योऽर्हद्भयः सम्यक्संबुद्धेभ्यो दानं दद्यात्, अपि नु स कुलपुत्रो वा कुलदुहिता वा ततोनिदानं बहु पुण्यस्कन्धं प्रसुनुयात् ? सुभूतिराह- बहु भगवन्, बहु सुगत। भगवानाह-एवमेतत्सुभूते, एवमेतत्। बहु स कुलपुत्रो वा कुलदुहिता वा ततोनिदानं पुण्यस्कन्धं प्रसुनुयादप्रमेयमसंख्येयम्। तत्कस्य हेतोः ? पुण्यस्कन्धः पुण्यस्कन्ध इति सुभूते अस्कन्धः स तथागतेन भाषितः। तेनोच्यते पुण्यस्कन्ध इति। सचेत् पुनः सुभूते पुण्यस्कन्धोऽभविष्यत्, न तथागतोऽभाषिष्यत् पुण्यस्कन्धः पुण्यस्कन्ध इति॥१९॥"]}},{section:20,title:{},content:{"sanskrit-devanagari":["तत्किं मन्यसे सुभूते रूपकायपरिनिष्पत्त्या तथागतो द्रष्टव्यः ? सुभूतिराह-नो हीदं भगवन्। न रूपकायपरिनिष्पत्त्या तथागतो द्रष्टव्यः। तत्कस्य हेतोः ? रूपकायपरिनिष्पत्ती रूपकायपरिनिष्पत्तिरिति भगवन् अपरिनिष्पत्तिरेषा तथागतेन भाषिता। तेनोच्यते रूपकायपरिनिष्पत्तिरिति॥","भगवानाह- तत्किं मन्यसे सुभूते लक्षणसंपदा तथागतो द्रष्टव्यः ? सुभूतिराह-नो हीदं भगवन्। न लक्षणसंपदा तथागतो द्रष्टव्यः। तत्कस्य हेतोः ? यैषा भगवन् लक्षणसंपत्तथागतेन भाषिता, अलक्षणसंपदेषा तथागतेन भाषिता। तेनोच्यते लक्षणसंपदिति॥२०॥"]}},{section:21,title:{},content:{"sanskrit-devanagari":["भगवानाह- तत्किं मन्यसे सुभूते अपि नु तथागतस्यैवं भवति-मया धर्मो देशित इति ? सुभूतिराह-नो हीदं भगवन् तथागतस्यैवं भवति-मया धर्मो देशित इति। भगवानाह-यः सुभूते एवं वदेत्- तथागतेन धर्मो देशित इति, स वितथं वदेत्। अभ्याचक्षीत मां स सुभूते असतोद्गृहीतेन। तत्कस्य हेतोः ? धर्मदेशना धर्मदेशनेति सुभूते नास्ति स कश्चिद्धर्मो यो धर्मदेशना नामोपलभ्यते॥","एवमुक्ते आयुष्मान् सुभूतिर्भगवन्तमेतदवोचत्-अस्ति भगवन् केचित्सत्त्वा भविष्यन्त्यनागतेऽध्वनि पश्चिमे काले पश्चिमे समये पश्चिमायां पञ्चशत्यां सद्धर्मविप्रलोपे वर्तमाने, य इमानेवंरूपान् धर्मान् श्रुत्वा अभिश्रद्धास्यन्ति। भगवानाह- न ते सुभूते सत्त्वा नासत्त्वाः। तत्कस्य हेतोः ? सत्त्वाः सत्त्वा इति सुभूते सर्वे ते सुभूते असत्त्वास्तथागतेन भाषिताः। तेनोच्यन्ते सत्त्वा इति॥२१॥"]}},{section:22,title:{},content:{"sanskrit-devanagari":["तत्किं मन्यसे सुभूते-अपि नु अस्ति स कश्चिद्धर्मः, यस्तथागतेनानुत्तरां सम्यक्संबोधिमभिसंबुद्धः ? आयुष्मान् सुभूतिराह-नो हीदं भगवन्। नास्ति स भगवन् कश्चिद्धर्मो यस्तथागतेनानुत्तरां सम्यक्संबोधिमभिसंबुद्धः। भगवानाह-एवमेतत्सुभूते, एवमेतत्। अणुरपि तत्र धर्मो न संविद्यते नोपलभ्यते। तेनोच्यते अनुत्तरा सम्यक्संबोधिरिति॥२२॥"]}},{section:23,title:{},content:{"sanskrit-devanagari":["अपि तु खलु पुनः सुभूते समः स धर्मो न तत्र कश्चिद्विषमः। तेनोच्यते अनुत्तरा सम्यक्संबोधिरिति। निरात्मत्वेन निःसत्त्वत्वेन निर्जीवत्वेन निष्पुद्गलत्वेन समा सा अनुत्तरा सम्यक्संबोधिः सर्वैः कुशलैर्धर्मैरभिसंबुध्यते। तत्कस्य हेतोः ? कुशला धर्माः कुशला धर्मा इति सुभूते अधर्माश्चैव ते तथागतेन भाषिताः। तेनोच्यन्ते कुशला धर्मा इति॥२३॥"]}},{section:24,title:{},content:{"sanskrit-devanagari":["यश्च खलु पुनः सुभुते स्त्री वा पुरुषो वा यावन्तस्त्रिसाहस्रमहासाहस्रे लोकधातौ सुमेरवः पर्वतराजानः, तावतो राशीन् सप्तानां रत्नानामभिसंहृत्य तथागतेभ्योऽर्हद्भयः सम्यक्संबुद्धेभ्यो दानं दद्यात्, यश्च कुलपुत्रो वा कुलदुहिता वा इतः प्रज्ञापारमिताया धर्मपर्यायादन्तशश्चतुष्पादिकामपि गाथामुद्गृह्य परेभ्यो देशयेत्, अस्य सुभूते पुण्यस्कन्धस्य असौ पौर्वकः पुण्यस्कन्धः शततमीमपि कलां नोपैति, यावदुपनिषदमपि न क्षमते॥२४॥"]}},{section:25,title:{},content:{"sanskrit-devanagari":["तत्किं मन्यसे सुभूते-अपि नु तथागतस्यैवं भवति-मया सत्त्वाः परिमोचिता इति? न खलु पुनः सुभूते एवं द्रष्टव्यम्। तत्कस्य हेतोः ? नास्ति सुभूते कश्चित्सत्त्वो यस्तथागतेन परिमोचितः। यदि पुनः सुभूते कश्चित्सत्त्वोऽभविष्यद्यस्तथागतेन परिमोचितः स्यात्, स एव तथागतस्यात्मग्राहोऽभविष्यत्, सत्त्वग्राहो जीवग्राहः पुद्गलग्राहोऽभविष्यत्। आत्मग्राह इति सुभूते अग्राह एष तथागतेन भाषितः। स च बालपृथग्जनैरुद्गृहीतः। बालपृथग्जना इति सुभूते अजना एव ते तथागतेन भाषिताः। तेनोच्यन्ते बालपृथग्जना इति॥२५॥"]}},{section:26,title:{},content:{"sanskrit-devanagari":["तत्किं मन्यसे सुभूते-लक्षणसंपदा तथागतो द्रष्टव्यः ? सुभूतिराह-नो हीदं भगवन्। यथाहं भगवतो भाषितस्यार्थमाजानामि, न लक्षणसंपदा तथागतो द्रष्टव्यः। भगवानाह-साधु साधु सुभूते, एवमेतत्सुभूते, एवमेतद्यथा वदसि। न लक्षणसंपदा तथागतो द्रष्टव्यः। तत्कस्य हेतोः ? सचेत्पुनः सुभूते लक्षणसंपदा तथागतो द्रष्टव्योऽभविष्यत्, राजापि चक्रवर्ती तथागतोऽभविष्यत्। तस्मान्न लक्षणसंपदा तथागतो द्रष्टव्यः। आयुष्मान् सुभुतिर्भगवन्तमेतदवोचत्-यथाहं भगवतो भाषितस्यार्थमाजानामि, न लक्षणसंपदा तथागतो द्रष्टव्यः॥","अथ खलु भगवांस्तस्यां वेलायामिमे गाथे अभाषत-","ये मां रूपेण चाद्राक्षुर्ये मां घोषेण चान्वगुः।","मिथ्याप्रहाणप्रसृता न मां द्रक्ष्यन्ति ते जनाः॥१॥","धर्मतो बुद्धो द्रष्टव्यो धर्मकाया हि नायकाः।","धर्मता च न विज्ञेया न सा शक्या विजानितुम्॥२॥२६॥"]}},{section:27,title:{},content:{"sanskrit-devanagari":["तत्किं मन्यसे सुभूते लक्षणसंपदा तथागतेन अनुत्तरा सम्यक्संबोधिरभिसंबुद्धा ? न खलु पुनस्ते सुभूते एवं द्रष्टव्यम्। तत्कस्य हेतोः ? न हि सुभूते लक्षणसंपदा तथागतेन अनुत्तरा सम्यक्संबोधिरभिसंबुद्धा स्यात्। न खलु पुनस्ते सुभूते कश्चिदेवं वदेत्-बोधिसत्त्वयानसंप्रस्थितैः कस्यचिद्धर्मस्य विनाशः प्रज्ञप्तः उच्छेदो वेति। न खलु पुनस्ते सुभूते एवं द्रष्टव्यम्। तत्कस्य हेतोः ? न बोधिसत्त्वयानसंप्रस्थितैः कस्यचिद्धर्मस्य विनाशः प्रज्ञप्तो नोच्छेदः॥२७॥"]}},{section:28,title:{},content:{"sanskrit-devanagari":["यश्च खलु पुनः सुभूते कुलपुत्रो वा कुलदुहिता वा गङ्गानदीवालुकासमाँल्लोकधातून् सप्तरत्नपरिपूर्णं कृत्वा तथागतेभ्योऽर्हद्भयः सम्यक्संबुद्धेभ्यो दानं दद्यात्, यश्च बोधिसत्त्वो निरात्मकेष्वनुत्पत्तिकेषु धर्मेषु क्षान्तिं प्रतिलभते, अयमेव ततोनिदानं बहुतरं पुण्यस्कन्धं प्रसवेदप्रमेयमसंख्येयम्। न खलु पुनः सुभूते बोधिसत्त्वेन महासत्त्वेन पुण्यस्कन्धः परिग्रहीतव्यः। आयुष्मान् सुभूतिराह- ननु भगवन् बोधिसत्त्वेन पुण्यस्कन्धः परिग्रहीतव्यः ? भगवानाह-परिग्रहीतव्यः सुभूते नो ग्रहीतव्यः। तेनोच्यते परिग्रहीतव्य इति॥२८॥"]}},{section:29,title:{},content:{"sanskrit-devanagari":["अपि तु खलु पुनः सुभूते यः कश्चिदेवं वदेत्-तथागतो गच्छति वा आगच्छति वा तिष्ठति वा निषीदति वा, शय्यां वा कल्पयति, न मे सुभूते (स) भाषितस्यार्थमाजानाति। तत्कस्य हेतोः ? तथागत इति सुभूते उच्यते न क्वचिद्गतो न कुतश्चिदागतः। तेनोच्यते तथागतोऽर्हन् सम्यक्संबुद्ध इति॥२९॥"]}},{section:30,title:{},content:{"sanskrit-devanagari":["यश्च खलु पुनः सुभूते कुलपुत्रो वा कुलदुहिता वा यावन्ति त्रिसाहस्रमहासाहस्रे लोकधातौ पृथिवीरजांसि, तावतां लोकधातूनामेवंरूपं मषिं कुर्यात् यावदेवमसंख्येयेन वीर्येण तद्यथापि नाम परमाणुसंचयः, तत्किं मन्यसे सुभूते-अपि नु बहुः स परमाणुसंचयो भवेत् ? सुभूतिराह-एवमेतद्भगवन्, एवमेतत्सुगत। बहुः स परमाणुसंचयो भवेत्। तत्कस्य हेतोः ? सचेद्भगवन् बहुः परमाणुसंचयोऽभविष्यत्, न भगवानवक्ष्यत्-परमाणुसंचय इति। तत्कस्य हेतोः ? योऽसौ भगवन् परमाणुसंचयस्तथागतेन भाषितः, असंचयः स तथागतेन भाषितः। तेनोच्यते परमाणुसंचय इति। यश्च तथागतेन भाषितस्त्रिसाहस्रमहासाहस्रो लोकधातुरिति, अधातुः स तथागतेन भाषितः। तेनोच्यते त्रिसाहस्रमहासाहस्रो लोकधातुरिति। तत्कस्य हेतोः ? सचेद्भगवन् लोकधातुरभविष्यत्, स एव पिण्डग्राहोऽभविष्यत्। यश्चैव पिण्डग्राहस्तथागतेन भाषितः, अग्राहः स तथागतेन भाषितः। तेनोच्यते पिण्डग्राह इति। भगवानाह- पिण्डग्राहश्चैव सुभूते अव्यवहारोऽनभिलाप्यः। न स धर्मो नाधर्मः। स च बालपृथग्जनैरुद्गृहीतः॥३०॥"]}},{section:31,title:{},content:{"sanskrit-devanagari":["तत्कस्य हेतोः ? यो हि कश्चित्सुभूते एवं वदेत्-आत्मदृष्टिस्तथागतेन भाषिता, सत्त्वदृष्टिर्जीवदृष्टिः पुद्गलदृष्टिस्तथागतेन भाषिता, अपि नु स सुभूते सम्यग्वदमानो वदेत् ? सुभूतिराह-नो हीदं भगवन्, नो हीदं सुगत, न सम्यग्वदमानो वदेत्। तत्कस्य हेतोः ? या सा भगवन् आत्मदृष्टिस्तथागतेन भाषिता, अदृष्टिः सा तथागतेन भाषिता। तेनोच्यते आत्मदृष्टिरिति॥","भगवानाह-एवं हि सुभूते बोधिसत्त्वयानसंप्रस्थितेन सर्वधर्मा ज्ञातव्या द्रष्टव्या अधिमोक्तव्याः। तथाच ज्ञातव्या द्रष्टव्या अधिमोक्तव्याः, यथा न धर्मसंज्ञायामपि प्रत्युपतिष्ठेन्नाधर्मसंज्ञायाम्। तत्कस्य हेतोः ? धर्मसंज्ञा धर्मसंज्ञेति सुभूते असंज्ञैषा तथागतेन भाषिता। तेनोच्यते धर्मसंज्ञेति॥３１॥"]}},{section:32,title:{},content:{"sanskrit-devanagari":["यश्च खलु पुनः सुभूते बोधिसत्त्वो महासत्त्वोऽप्रमेयानसंख्येयांल्लोकधातून् सप्तरत्नपरिपूर्णं कृत्वा तथागतेभ्योऽर्हद्भयः सम्यक्संबुद्धेभ्यो दानं दद्यात्, यश्च कुलपुत्रो वा कुलदुहिता वा इतः प्रज्ञापारमिताया धर्मपर्यायादन्तशश्चतुष्पादिकामपि गाथामुद्गृह्य धारयेद्देशयेद्वाचयेत् पर्यवाप्नुयात्, परेभ्यश्च विस्तरेण संप्रकाशयेत्, अयमेव ततोनिदानं बहुतरं पुण्यस्कन्धं प्रसुनुयादप्रमेयमसंख्येयम्। कथं च संप्रकाशयेत् ? तद्यथाकाशे-","तारका तिमिरं दीपो मायावश्याय बुद्बुदम्।","स्वप्नं च विद्युदभ्रं च एवं द्रष्टव्य संस्कृतम्॥","तथा प्रकाशयेत्, तेनोच्यते संप्रकाशयेदिति॥","इदमवोचद्भगवान् आत्तमनाः। स्थविरसुभूतिस्ते च भिक्षुभिक्षुण्युपासकोपासिकास्ते च बोधिसत्त्वाः सदेवमानुषासुरगन्धर्वश्च लोको भगवतो भाषितमभ्यनन्दन्निति॥३२॥","॥आर्यवज्रच्छेदिका भगवती प्रज्ञापारमिता समाप्ता॥"]}}];var My=[{section:0,title:{english:"The Noble Perfection of Wisdom, the Vajra-Cutter"},content:{"tibetan-translit":["phag pa she rab kyi pha rol tu chin pa dor je chö pa zhe ja wa zhug so ||","gya gar ke du: arya vajra cche da ka pra jnya pa ra mi ta na ma ma ha ya na su tra |","bö ke du: phag pa she rab kyi pha rol tu chin pa dor je chö pa zhe ja wa theg pa chen po'i do |","sang gye dang jang chub sem pa tham che la chag tshal lo |"]}},{section:1,title:{english:"The Setting"},content:{"tibetan-translit":["di ke dag gi thö pa dü chig na | chom den de nyan yö na gyal bu gyal je kyi tshal gön me ze jin gyi kün ga ra wa na | ge long tong nyi gya nga chu'i ge long gi ge dün chen po dang | jang chub sem pa sem pa chen po rab tu mang po dag dang thab chig tu zhug so |","de ne chom den de nga dro'i dü kyi tshe | sham thab dang chö gö ku la söl te | lhung ze nam ne nyan yö kyi drong khyer chen por sö nyom kyi chir sheg so | de ne chom den de nyan yö kyi drong khyer chen por sö nyom kyi chir sheg ne zhal ze söl te ze kyi ja wa dze de | ze chi ma'i sö nyom pang ne lhung ze dang chö gö zhag ne | zhab sil te den sham pa la kyil mo trung che ne ku drang por srang te | dren pa ngön du zhag ne zhug so | de ne ge long mang pö chom den de ga la wa der dong te lhag ne | chom den de kyi zhab la go wö chag tshal te len sum kor wa je ne chog chig tu khö do |"]}},{section:2,title:{english:"Subhuti's Question"},content:{"tibetan-translit":["yang de'i tshe tshe dang den pa rab jor 'khor de nyi du dü par gyur te dug go | de ne tshe dang den pa rab jor ten le lang te la gö thrag pa chig tu zar ne pü mo ye pa'i lha nga sa la tsug te | chom den de ga la wa der log su thal mo jar wa tü ne | chom den de la di ke che söl to |","chom den de de zhin sheg pa dra chom pa yang dag par dzog pa'i sang gye kyi jang chub sem pa sem pa chen po nam la phen dag pa'i dam pa ji nye pe phen dag pa dang | de zhin sheg pe jang chub sem pa sem pa chen po nam la yong su te pa'i dam pa ji nye pe yong su te pa ni | chom den de ngo tshar lag so | de war sheg pa ngo tshar lag so |","chom den de jang chub sem pa'i theg pa la yang dag par zhug pe ji tar ne par gyi | ji tar drub par gyi | ji tar sem rab tu zung war gyi |","de ke che söl wa dang | chom den de kyi tshe dang den pa rab jor la di ke che ka tsal to | rab jor leg so leg so | rab jor de de zhin no | de de zhin te | de zhin sheg pe jang chub sem pa sem pa chen po nam la phen dag pa'i dam pe phen dag so || de zhin sheg pe jang chub sem pa sem pa chen po nam la yong su te pa'i dam pe yong su te do | rab jor de'i chir nyön la leg par rab tu yi la zung shig dang | jang chub sem pa'i theg pa la yang dag par zhug pe ji tar ne par ja wa dang | ji tar drub par ja wa dang | ji tar sem rab tu zung war ja wa nge khyö la she do |","chom den de de de zhin no | zhe söl ne | tshe dang den pa rab jor chom den de kyi tar nyen pa dang |"]}},{section:3,title:{english:"The Bodhisattva's Vow"},content:{"tibetan-translit":["chom den de kyi tshe dang den pa rab jor la di ke che ka tsal to | rab jor di la jang chub sem pa'i theg pa la yang dag par zhug pe | di nyam du dag gi sem chen ji tsam sem chen du du we dü pa | go nga le kye pa'am | ngal le kye pa'am | drö sher le kye pa'am | dzü te kye pa'am | zug chen nam | zug chen ma yin pa'am | du she chen nam | du she me du she me min nam | sem chen gyi kham ji tsam sem chen du dag pa'i tag pa de dag tham che phung po lhag ma me pa'i nya ngen le de pa'i ying su yong su nya ngen le da'o | de tar sem chen tshe me pa yong su nya ngen le de kyang | sem chen gang yang yong su nya ngen le de par gyur wa me do nyam du sem kye par ja'o |","de chi'i chir zhe na | rab jor gal te jang chub sem pa sem chen du du she jug na | de jang chub sem pa zhe mi ja wa'i chir ro | de chi'i chir zhe na | rab jor gang sem chen du du she jug gam | srog tu du she jug gam | gang zag tu du she jug na | de jang chub sem pa zhe mi ja wa'i chir ro |"]}},{section:4,title:{english:"Giving Without Abiding"},content:{"tibetan-translit":["yang rab jor jang chub sem pa ngö po la mi ne par jin pa jin par ja'o | chi la yang mi ne par jin pa jin par ja'o | zug la yang mi ne par jin pa jin par ja'o | de zhin du dra dang | dri dang ro dang | reg ja dang | chö la yang mi ne par jin pa jin par ja'o | rab jor chi ne kyang tshen mar du she pa la yang mi ne par de tar jang chub sem pe jin pa jin no |","de chi'i chir zhe na | rab jor jang chub sem pe gang mi ne par jin pa jin pa de'i sö nam kyi phung po ni | rab jor tshe zung war la wa ma yin pa'i chir ro | rab jor di ji nyam du sem | shar chog kyi nam kha'i tshe zung war la nyam mam | rab jor gyi söl pa | chom den de de ni ma lag so | chom den de kyi ka tsal pa | rab jor de zhin du lho dang | nub dang | jang dang | teng dang | og gi chog dang | chog tsham dang | chog chü'i nam kha'i tshe zung war la nyam mam | rab jor gyi söl pa | chom den de de ni ma lag so | chom den de kyi ka tsal pa | rab jor de zhin du jang chub sem pa gang la yang mi ne par jin pa jin pa de'i sö nam kyi phung po ni | rab jor tshe zung war la wa ma yin pa'i chir ro |"]}},{section:5,title:{english:"Seeing Without Marks"},content:{"tibetan-translit":["rab jor di ji nyam du sem | tshen phün sum tshog pe de zhin sheg par ta war ja nyam mam | rab jor gyi söl pa | chom den de de ni ma lag so | tshen phün sum tshog pe de zhin sheg par ta war mi gyi lag so | de chi'i le du zhe na | de zhin sheg pe tshen phün sum tshog pa zhe gang sung pa de nyi | tshen phün sum tshog pa ma chhi pa'i le du'o | de ke che söl pa dang | chom den de kyi tshe dang den pa rab jor la di ke che ka tsal to | rab jor ji tsam du tshen phün sum tshog pa de tsam du dzün no | ji tsam du tshen phün sum tshog pa me pa de tsam du mi dzün te | de tar na de zhin sheg pa la tshen dang tshen ma me par ta'o |"]}},{section:6,title:{english:"The Rarity of True Faith"},content:{"tibetan-translit":["de ke che ka tsal pa dang | chom den de la tshe dang den pa rab jor gyi di ke che söl to | chom den de ma ong pa'i dü nga gya'i tha ma la | dam pa'i chö rab tu nam par jig par gyur wa na sem chen gang la la dag di ta bü'i do de'i tshig she pa dag la yang dag par du she kye par gyur wa jung wa ta chhi lag sam |","chom den de kyi ka tsal pa | rab jor gang khyö di ke du ma ong pa'i dü nga gya'i tha ma la | dam pa'i chö rab tu nam par jig par gyur wa na | sem chen gang la la dag di ta bü'i do de'i tshig she pa dag la yang dag par du she kye par gyur wa jung wa ta chhi lag sam zhe khyö de ke ma zer chig | rab jor ma ong pa'i dü nga gya'i tha ma la dam pa'i chö rab tu nam par jig par gyur wa na | jang chub sem pa sem pa chen po tshül thrim dang den pa | yön ten dang den pa | she rab dang den pa dag jung te | rab jor jang chub sem pa sem pa chen po de dag kyang sang gye chig la nyen kur je pa ma yin | sang gye chig la ge wa'i tsa wa kye pa ma yin gyi | rab jor sang gye bum thrag du ma la nyen kur je shing sang gye bum thrag du ma la ge wa'i tsa wa dag kye pa'i jang chub sem pa sem pa chen po de dag jung ngo | rab jor gang dag di ta bü'i do de'i she pa dag la sem de pa chig tsam nye par gyur wa de dag ni | de zhin sheg pe khyen to | rab jor de dag ni de zhin sheg pe zig te | rab jor sem chen de dag tham che ni sö nam kyi phung po pag tu me pa kye ching yong su dü par gyur ro |","de chi'i chir zhe na | rab jor jang chub sem pa sem pa chen po de dag ni | dag tu du she jug par mi gyur zhing | sem chen du du she pa ma yin | srog tu du she pa ma yin | gang zag tu du she jug par mi gyur wa'i chir ro | rab jor jang chub sem pa sem pa chen po de dag kyang chö su du she pa dang | chö me par yang du she mi jug te | de dag ni du she me par yang jug par mi gyur ro |","de chi'i chir zhe na | rab jor gal te jang chub sem pa sem pa chen po de dag ni | chö su du she jug na yang de nyi de dag gi dag tu dzin par gyur zhing | sem chen du dzin pa dang | srog tu dzin pa dang | gang zag tu dzin par gyur wa'i chir ro | gal te chö dag me par du she jug na yang de nyi de dag gi dag tu dzin par gyur zhing | sem chen du dzin pa dang | srog tu dzin pa dang | gang zag tu dzin par gyur wa'i chir ro | de chi'i chir zhe na | rab jor jang chub sem pa chö kyang log par zung war mi ja te | chö ma yin pa yang mi zung wa'i chir ro | de we na de le gong te de zhin sheg pe chö kyi nam drang di zing ta bur she pa nam kyi chö nam kyang pang war ja na | chö ma yin pa nam ta chi mö zhe sung so |"]}},{section:7,title:{english:"Nothing Attained, Nothing Taught"},content:{"tibetan-translit":["zhen yang chom den de kyi tshe dang den pa rab jor la di ke che ka tsal to | rab jor di ji nyam du sem | de zhin sheg pe gang la na me pa yang dag par dzog pa'i jang chub tu ngön par dzog par sang gye pa'i chö de gang yang yö nyam mam | de zhin sheg pe chö de gang yang ten nyam mam | de ke che ka tsal pa dang | chom den de la tshe dang den pa rab jor gyi di ke che söl to | chom den de dag gi chom den de kyi sung pa'i dön tshal wa tar na | de zhin sheg pe gang la na me pa yang dag par dzog pa'i jang chub tu ngön par dzog par sang gye pa'i chö de gang yang ma chhi lag so | de zhin sheg pe ten pa'i chö de gang yang ma chhi lag so | de chi'i le du zhe na | de zhin sheg pe chö de gang yang ngön par dzog par sang gye pa'am | ten pa de ni zung du ma chhi jö du ma chhi te | de ni chö kyang ma lag chö ma chhi pa yang ma lag pa'i le du'o | de chi'i le du zhe na | phag pa'i gang zag nam ni dü ma je kyi rab tu che wa'i le du'o |"]}},{section:8,title:{english:"The Merit of Giving"},content:{"tibetan-translit":["chom den de kyi ka tsal pa | rab jor di ji nyam du sem | rig kyi bu'am | rig kyi bu mo gang la la zhig gi tong sum gyi tong chen po'i jig ten gyi kham di rin po che na dün gyi rab tu gang war je te jin pa jin na | rig kyi bu'am | rig kyi bu mo de zhi de le sö nam kyi phung po mang du kye nyam mam | rab jor gyi söl pa | chom den de mang lag so | de war sheg pa mang lag so | rig kyi bu'am | rig kyi bu mo de de'i zhi le sö nam kyi phung po mang du kye do | de chi'i le du zhe na | sö nam kyi phung po de nyi phung po ma chhi pa'i le du te | de we na de zhin sheg pe sö nam kyi phung po sö nam kyi phung po zhe sung so | chom den de kyi ka tsal pa | rab jor rig kyi bu'am rig kyi bu mo gang gi tong sum gyi tong chen po'i jig ten gyi kham di rin po che na dün gyi rab tu gang war je te jin pa jin pa we | gang gi chö kyi nam drang di le tha na tshig zhi pa'i tshig su che pa tsam zung ne zhen dag la che ching yang dag par rab tu tön na | zhi de le sö nam kyi phung po che mang du drang me pag tu me pa kye do | de chi'i chir zhe na | rab jor de zhin sheg pa dra chom pa yang dag par dzog pa'i sang gye nam kyi la na me pa yang dag par dzog pa'i jang chub ni di le jung te | sang gye chom den de nam kyang di le kye pa'i chir ro | de chi'i chir zhe na | rab jor sang gye kyi chö nam sang gye kyi chö nam zhe ja wa ni | sang gye kyi chö de dag me par de zhin sheg pe sung pa'i chir te | de na sang gye kyi chö nam zhe ja'o |"]}},{section:9,title:{english:"The Four Fruits are Not Attained"},content:{"tibetan-translit":["rab jor di ji nyam du sem | gyün du zhug pa di nyam du dag gi gyün du zhug pa'i dre bu thob bo nyam du sem nyam mam | rab jor gyi söl pa | chom den de ni ma lag so | de chi'i le du zhe na | chom den de de ni chi la yang zhug pa ma chhi pa'i le du te | de na gyün du zhug pa zhe gyi'o | zug la yang ma zhug | dra la yang ma lag | dri la yang ma lag | ro la yang ma lag | reg ja la yang ma lag | chö nam la yang ma zhug te | de na gyün du zhug pa zhe gyi'o | de chi'i le du zhe na | chom den de gal te gyün du zhug pa di nyam du dag gi gyün du zhug pa'i dre bu thob bo nyam du sem par gyur na | de nyi de'i dag tu dzin par gyur lag so | sem chen du dzin pa dang | srog tu dzin pa dang | gang zag tu dzin par gyur lag so |","chom den de kyi ka tsal pa | rab jor di ji nyam du sem | len chig chir ong wa di nyam du dag gi len chig chir ong wa'i dre bu thob bo nyam du sem nyam mam | rab jor gyi söl pa | chom den de de ni ma lag so | de chi'i chir zhe na | gang len chig chir ong wa nyi du zhug pa'i chö de gang yang ma chhi pa'i le du te | de na len chig chir ong wa zhe gyi'o | chom den de gal te len chig chir ong wa di nyam du dag gi len chig chir ong wa'i dre bu thob bo nyam du sem par gyur na | de nyi de'i dag tu dzin par gyur lag so | sem chen du dzin pa dang | srog tu dzin pa dang | gang zag tu dzin par gyur lag so |","chom den de kyi ka tsal pa | rab jor di ji nyam du sem | chir mi ong wa di nyam du dag gi chir mi ong wa'i dre bu thob bo nyam du sem nyam mam | rab jor gyi söl pa | chom den de de ni ma lag so | de chi'i le du zhe na | gang chir mi ong wa nyi du zhug pa'i chö de gang yang ma chhi pa'i le du te | de'i chir chir mi ong wa zhe gyi'o |","chom den de kyi ka tsal pa | rab jor di ji nyam du sem | dra chom pa di nyam du dag gi dra chom pa nyi thob bo nyam du sem nyam mam | rab jor gyi söl pa | chom den de de ni ma lag so | de chi'i le du zhe na | gang dag dra chom pa zhe gyi wa'i chö de gang yang ma chhi pa'i le du'o | chom den de gal te dra chom pa di nyam du dag gi dra chom pa nyi thob bo nyam du sem par gyur na | de nyi de'i dag tu dzin par gyur lag so | sem chen du dzin pa dang | srog tu dzin pa dang | gang zag tu dzin par gyur lag so | chom den de dag ni de zhin sheg pa dra chom pa yang dag par dzog pa'i sang gye kyi nyön mong pa me par ne pa nam kyi chog tu ten te | chom den de dag dö chag dang dral wa dra chom pa lag kyang | chom den de dag di nyam du dag ni dra chom pa'o nyam du mi sem lag so | chom den de gal te di nyam du dag gi dra chom pa nyi thob bo nyam du sem par gyur na | de zhin sheg pe dag la rig kyi bu rab jor ni nyön mong pa me par ne pa nam kyi chog yin te | chi la yang mi ne pe na nyön mong pa me par ne pa zhe lung mi tön lag so |"]}},{section:10,title:{english:"Adorning the Pure Land"},content:{"tibetan-translit":["chom den de kyi ka tsal pa | rab jor di ji nyam du sem | de zhin sheg pe de zhin sheg pa dra chom pa yang dag par dzog pa'i sang gye mar me dze le gang lang pa'i chö de gang yang yö nyam mam | rab jor gyi söl pa | chom den de de ni ma lag so | de zhin sheg pe de zhin sheg pa dra chom pa yang dag par dzog pa'i sang gye mar me dze le gang lang pa'i chö de gang yang yö pa ye ma chhi lag so |","chom den de kyi ka tsal pa | rab jor jang chub sem pa gang la la zhig di ke du dag gi zhing kö pa nam drub bo zhe zer na de mi den par mra'o | de chi'i chir zhe na | rab jor zhing kö pa nam zhing kö pa nam zhe ja wa ni | kö pa de dag me par de zhin sheg pe sung pa'i chir te | de na zhing kö pa nam zhe ja'o | rab jor de ta we na | jang chub sem pa sem pa chen pö di tar mi ne par sem kye par ja te | chi la yang mi ne par sem kye par ja'o | zug la yang mi ne par sem kye par ja'o | dra dang | dri dang | ro dang | reg ja dang | chö la yang mi ne par sem kye par ja'o | rab jor di ta te per na kye bu zhig lü di ta bur gyur te | di ta te ri'i gyal po ri rab tsam du gyur na | rab jor di ji nyam du sem | lü de che wa yin nyam mam | rab jor gyi söl pa | chom den de lü de che wa lag so | de war sheg pa lü de che wa lag so | de chi'i le du zhe na | de zhin sheg pe de ngö po ma chhi par sung pa'i le du te | de na lü de che wa zhe gyi'o | de ngö po ma chhi pe de na lü zhe ja'o |"]}},{section:11,title:{english:"The Merit of Upholding the Dharma is Supreme"},content:{"tibetan-translit":["chom den de kyi ka tsal pa | rab jor di ji nyam du sem | ganga'i lung gi je ma ji nye pa ganga'i lung yang de nye kho nar gyur la | de dag gi je ma gang yin pa de dag mang wa yin nyam mam | rab jor gyi söl pa | chom den de ganga'i lung de dag nyi kyang mang lag na | de dag gi je ma ta mö kyang chi tshal | chom den de kyi ka tsal pa | rab jor khyö mö par ja'o | khyö kyi khong du chü war ja'o | ganga'i lung de dag gi je ma ji nye pa de nye kyi jig ten gyi kham na kye pa'am | bü me la la zhig gi rin po che na dün gyi rab tu gang war je te | de zhin sheg pa dra chom pa yang dag par dzog pa'i sang gye nam la jin pa jin na | rab jor di ji nyam du sem | kye pa'am bü me de zhi de le sö nam mang du kye nyam mam | rab jor gyi söl pa | chom den de mang lag so | de war sheg pa mang lag so | kye pa'am bü me de zhi de le sö nam mang du kye pa lag so | chom den de kyi ka tsal pa | rab jor gang gi jig ten gyi kham de nye rin po che na dün gyi rab tu gang war je te | de zhin sheg pa dra chom pa yang dag par dzog pa'i sang gye nam la jin pa jin pa we | gang gi chö kyi nam drang di le tha na tshig zhi pa'i tshig su che pa tsam zung ne | zhen dag la yang dag par rab tu she de yang dag par rab tu ten na | de nyi zhi de le sö nam che mang du drang me pag tu me pa kye do |"]}},{section:12,title:{english:"Honoring the Teaching"},content:{"tibetan-translit":["yang rab jor sa chog gang na chö kyi nam drang di le tha na tshig zhi pa'i tshig su che pa tsam dön tam | tön pa'i sa chog de ni lha dang mi dang lha ma yin du che pa'i jig ten gyi chö ten du gyur pa yin na su zhig chö kyi nam drang di len pa dang | dri wa dang | dzin pa dang | chang wa dang | log pa dang | kün chub par je pa dang | tshül zhin du yi la je pa de ngo tshar rab dang den par gyur wa ta chi mö te | sa chog de na tön pa'am | la ma ta bu gang yang rung war ne so |"]}},{section:13,title:{english:"The Name of the Discourse"},content:{"tibetan-translit":["de ke che ka tsal pa dang | chom den de la tshe dang den pa rab jor gyi di ke che söl to | chom den de chö kyi nam drang di'i ming chi lag | di ji tar zung war gyi | de ke che söl pa dang | chom den de kyi tshe dang den pa rab jor la di ke che ka tsal to | rab jor chö kyi nam drang di'i ming she rab kyi pha rol tu chin pa zhe ja te di de tar zung shig | de chi'i chir zhe na | rab jor de zhin sheg pe she rab kyi pha rol tu chin pa gang sung pa de nyi pha rol tu chin pa me pa'i chir te | de na she rab kyi pha rol tu chin pa zhe ja'o |","rab jor di ji nyam du sem | de zhin sheg pe sung pa'i chö de gang yang yö nyam mam | rab jor gyi söl pa | chom den de de zhin sheg pe gang sung pa'i chö de gang yang ma chhi lag so |","chom den de kyi ka tsal pa | rab jor di ji nyam du sem | tong sum gyi tong chen po'i jig ten gyi kham na sa'i dül ji nye yö pa de mang wa yin nyam mam | rab jor gyi söl pa | chom den de sa'i dül de mang lag so | de war sheg pa mang lag so | de chi'i le du zhe na | chom den de sa'i dül gang lag pa de dül ma chhi par de zhin sheg pe sung pa'i le du te | de na sa'i dül zhe gyi'o | jig ten gyi kham gang lag pa de dag kham ma chhi par de zhin sheg pe sung pa'i le du te | de na jig ten gyi kham zhe gyi'o |","chom den de kyi ka tsal pa | rab jor di ji nyam du sem | kye bu chen po'i tshen sum chu tsa nyi po de dag gi de zhin sheg pa dra chom pa yang dag par dzog pa'i sang gye su ta war ja nyam mam | rab jor gyi söl pa | chom den de de ni ma lag so | de chi'i le du zhe na | kye bu chen po'i tshen sum chu tsa nyi gang dag de zhin sheg pe sung pa de dag tshen ma chhi par de zhin sheg pe sung pa'i le du te | de na kye bu chen po'i tshen sum chu tsa nyi nam zhe gyi'o |","chom den de kyi ka tsal pa | rab jor kye pa'am | bü me gang la la zhig gi lü ganga'i lung gi je ma nye yong su tang wa we | gang gi chö kyi nam drang di le tha na tshig zhi pa'i tshig su che pa tsam zung te zhen dag la yang dag par ten na | de nyi zhi de le sö nam che mang du drang me pag tu me pa kye do |"]}},{section:14,title:{english:"The Perfection of the Teaching is No-Perfection"},content:{"tibetan-translit":["de ne tshe dang den pa rab jor chö kyi shug kyi chhi ma chung te | de chhi ma chi ne chom den de la di ke che söl to | chö kyi nam drang di de zhin sheg pa ji nye pe sung pa ni | chom den de ngo tshar lag so | de war sheg pa ngo tshar lag so | chom den de dag gi ye she kye tshün che dag gi chö kyi nam drang di ngön nam yang ma thö lag so | de chi'i le du zhe na | chom den de do de she pa di la gang dag yang dag par du she kye par gyur wa'i sem chen de dag ni ngo tshar rab dang den par gyur lag so | de chi'i le du zhe na | chom den de yang dag par du she pa gang lag pa de nyi du she ma chhi pa'i le du te | de na yang dag par du she zhe de zhin sheg pe sung so |","chom den de dag ni chö kyi nam drang di she pa la tog ching mö pa ni | dag la ngo tshar ma lag kyi | chom den de le me'i tshe le me'i dü nga gya'i tha ma la sem chen gang dag chö kyi nam drang di len pa dang | dri wa dang | dzin pa dang | chang wa dang | log pa dang | kün chub par je pa de dag ni ngo tshar rab dang den par gyur lag so |","yang chom den de de dag ni dag tu du she jug par mi gyur zhing | sem chen du du she pa dang | srog tu du she pa dang | gang zag tu du she jug par mi gyur lag so | de chi'i le du zhe na | chom den de dag tu du she pa dang | sem chen du du she pa dang | srog tu du she pa dang | gang zag tu du she pa gang lag pa de nyi du she tham che dang dral wa'i le du'o | de chi'i le du zhe na | sang gye chom den de nam ni du she tham che dang dral wa'i le du'o | de ke che söl pa dang | chom den de kyi tshe dang den pa rab jor la di ke che ka tsal to | rab jor de de zhin no | de de zhin te | sem chen gang dag do de di she pa la mi trag ching mi ngang la kün tu ngang par mi gyur wa de dag ni ngo tshar rab dang den par gyur ro | de chi'i chir zhe na | rab jor pha rol tu chin pa dam pa di ni de zhin sheg pe sung te | pha rol tu chin pa dam pa gang de zhin sheg pe sung pa de sang gye chom den de pag tu me tshe me pa nam kyi kyang sung pa'i chir te | de na pha rol tu chin pa dam pa zhe ja'o |"]}},{section:15,title:{english:"The Merit of Upholding the Teaching"},content:{"tibetan-translit":["yang chom den de de dag ni dag tu du she jug par mi gyur zhing | sem chen du du she pa dang | srog tu du she pa dang | gang zag tu du she jug par mi gyur lag so | de chi'i le du zhe na | chom den de dag tu du she pa dang | sem chen du du she pa dang | srog tu du she pa dang | gang zag tu du she pa gang lag pa de nyi du she tham che dang dral wa'i le du'o | de chi'i le du zhe na | sang gye chom den de nam ni du she tham che dang dral wa'i le du'o | de ke che söl pa dang | chom den de kyi tshe dang den pa rab jor la di ke che ka tsal to | rab jor de de zhin no | de de zhin te | sem chen gang dag do de di she pa la mi trag ching mi ngang la kün tu ngang par mi gyur wa de dag ni ngo tshar rab dang den par gyur ro | de chi'i chir zhe na | rab jor pha rol tu chin pa dam pa di ni de zhin sheg pe sung te | pha rol tu chin pa dam pa gang de zhin sheg pe sung pa de sang gye chom den de pag tu me tshe me pa nam kyi kyang sung pa'i chir te | de na pha rol tu chin pa dam pa zhe ja'o | yang rab jor de zhin sheg pe zö pa'i pha rol tu chin pa gang yin pa de nyi pha rol tu chin pa me do | de chi'i chir zhe na | rab jor gang gi tshe kalinge'i gyal pö | nge'i yen lag dang nying lag nam che par gyur pa de'i tshe nga la dag tu du she sam | sem chen du du she sam | srog tu du she sam | gang zag tu du she kyang ma jung zhing | nga la du she chi yang me la du she me par gyur pa yang ma yin pa'i chir ro | de chi'i chir zhe na | rab jor gal te de'i tshe nga la dag tu du she jung na | de'i tshe nö sem kyi du she kyang jung la | sem chen du du she pa dang | srog tu du she pa dang | gang zag tu du she jung na | de'i tshe nö sem kyi du she kyang jung wa'i chir ro | rab jor nge ngön par she te | de pa'i dü na | nga tshe rab nga gyar zö pa mra wa zhe ja wa'i drang srong du gyur pa de'i tshe na yang | nga la dag tu du she ma jung | sem chen du du she dang | srog tu du she dang | gang zag tu du she ma jung ngo | rab jor de ta we na | jang chub sem pa sem pa chen pö du she tham che nam par pang te | la na me pa yang dag par dzog pa'i jang chub tu sem kye par ja'o | zug la yang mi ne par sem kye par ja'o | dra dang dri dang ro dang | reg ja la yang mi ne par sem kye par ja'o | chö la yang mi ne par sem kye par ja'o | chö me pa la yang mi ne par sem kye par ja'o | chi la yang mi ne par sem kye par ja'o | de chi'i chir zhe na | ne pa gang yin pa de nyi mi ne pa'i chir te | de we na de zhin sheg pe di ke du | jang chub sem pa gang la yang mi ne par jin pa jin par ja'o | zhe sung so |"]}},{section:16,title:{english:"The Purification of Karma"},content:{"tibetan-translit":["yang rab jor jang chub sem pa di tar sem chen tham che kyi dön gyi chir jin pa yong su tang war ja'o | sem chen du du she pa gang yin pa de nyi kyang du she me pa te | de zhin sheg pe sem chen tham che che gang dag sung pa'i sem chen de dag nyi kyang me pa'o | de chi'i chir zhe na | rab jor de zhin sheg pa ni yang dag par sung wa | den par sung wa | de zhin nyi du sung wa te | de zhin sheg pa ni log par sung pa ma yin pa'i chir ro | yang rab jor de zhin sheg pe chö gang yang ngön par dzog par sang gye pa'am | ten pa de la den pa yang me | dzün pa yang me do | rab jor di ta te | per na mig dang den pa'i mi zhig mün par zhug na chi yang mi thong wa de zhin du gang ngö por lhung we jin pa yong su tong wa'i jang chub sem pa ta war ja'o | yang rab jor di ta te | per na | nam lang te nyi ma shar ne mig dang den pa'i mi zug nam pa na tshog dag thong wa de zhin du | gang ngö por ma lhung we jin pa yong su tong wa'i jang chub sem pa ta war ja'o | yang rab jor rig kyi bu'am | rig kyi bu mo gang dag chö kyi nam drang di len pa dang | dzin pa dang | chang wa dang | log pa dang | kün chub par je pa dang | zhen dag la gya cher yang dag par rab tu tön pa de dag ni de zhin sheg pe khyen | de zhin sheg pe zig te sem chen de dag tham che ni sö nam kyi phung po pag tu me pa kye par gyur ro |","yang rab jor kye pa'am | bü me gang zhig nga dro'i dü kyi tshe lü ganga'i lung gi je ma nye yong su tong la | che kyi dü dang chi dro'i dü kyi tshe yang lü ganga'i lung gi je ma nye yong su tong te | nam drang di ta bur kal pa je wa thrag thrig bum thrag du ma la yong su ter wa we | gang gi chö kyi nam drang di thö ne mi pong na | de nyi zhi de le sö nam che mang du drang me pag tu me pa kye na | gang gi yi ger dri ne len pa dang | dzin pa dang | chang wa dang | log pa dang | kün chub par je pa dang | zhen dag la gya cher yang dag par rab tu tön pa ta chi mö |","yang rab jor chö kyi nam drang di ni sam gyi mi khyab ching tshung pa me do | di'i nam par min pa yang sam gyi mi khyab pa nyi du rig par ja'o | chö kyi nam drang di ni theg pa chog la yang dag par zhug pa'i sem chen nam kyi dön dang | theg pa phül du chin pa la yang dag par zhug pa'i sem chen nam kyi dön gyi chir de zhin sheg pe sung so | gang dag chö kyi nam drang di len pa dang | dzin pa dang | chang wa dang | log pa dang | kün chub par je pa dang | zhen dag la gya cher yang dag par rab tu tön pa de dag ni de zhin sheg pe khyen | de zhin sheg pe zig te | sem chen de dag tham che ni sö nam kyi phung po pag tu me pa dang den par gyur | sö nam kyi phung po sam gyi mi khyab pa dang | tshung pa me pa dang | zhal du me pa dang | tshe me pa dang den par gyur te | sem chen de dag tham che nge'i jang chub thrag pa la thog par gyur ro | de chi'i chir zhe na | rab jor men pa la mö pa nam kyi chö kyi nam drang di nyen par mi nü te | dag tu ta wa nam kyi ma yin | sem chen du ta wa nam kyi ma yin | srog tu ta wa nam kyi ma yin zhing | gang zag tu ta wa nam kyi nyen pa dang | lang wa dang | zung wa dang | log pa dang | kün chub par je mi nü te | de ni ne me pa'i chir ro ||","yang rab jor sa chog gang na do de di tön pa'i sa chog de lha dang | mi dang | lha ma yin du che pa'i jig ten gyi chö pa ja war ö par gyur ro | sa chog de chag ja war ö pa dang | kor wa ja war ö par gyur te | sa chog de chö ten ta bur gyur ro |","yang rab jor rig kyi bu'am | rig kyi bu mo gang dag di ta bü'i do de'i tshig di dag len pa dang | dzin pa dang | chang wa dang | log pa dang | kün chub par je pa de dag ni nar war gyur | shin tu nar war gyur ro | de chi'i chir zhe na | rab jor sem chen de dag ni tshe rab nga ma'i mi ge wa'i le ngen song du kye war gyur wa gang dag je pa de dag tshe di nyi la nar we | tshe rab nga ma'i mi ge wa'i le ngen song du kye war gyur wa gang dag je pa de dag jang war gyur te | sang gye kyi jang chub kyang thob par gyur ro |","rab jor nge ngön par she te | de pa'i dü kal pa drang me pa'i yang che drang me pa na | de zhin sheg pa dra chom pa yang dag par dzog pa'i sang gye mar me dze kyi ngön rol gyi yang che ngön rol na | sang gye je wa thrag thrig bum thrag gye chu tsa zhi dag jung wa de nye par je te | ma nye par ma je ne thug jung war ma je te | rab jor sang gye chom den de de dag nge nye par je ne thug j
