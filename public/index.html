ung war ma je pa gang yin pa dang | chi ma'i dü nga gya'i thar gyur pa na | do de di len pa dang | dri wa dang | dzin pa dang chang wa dang | log pa dang | kün chub par je pa gang yin pa le | rab jor sö nam kyi phung po di la sö nam kyi phung po nga me gya'i char yang nye war mi dro | tong gi cha dang | bum gi cha dang | drang dang tshe dang drang wa dang | pe dang da dang gyur yang mi ze do |","rab jor gal te de'i tshe | rig kyi bu'am | rig kyi bu mo gang dag sö nam kyi phung po ji nye rab tu dzin par gyur wa'i rig kyi bu'am | rig kyi bu mo de dag gi sö nam kyi phung po nge jö na | sem chen nam nyö nyö por gyur zhing sem thrug par gyur ro | yang rab jor chö kyi nam drang di sam gyi mi khyab te | di'i nam par min pa yang sam gyi mi khyab pa nyi du rig par ja'o |"]}},{section:17,title:{english:"No Attainment, No Dharma"},content:{"tibetan-translit":["de ne chom den de la tshe dang den pa rab jor gyi di ke che söl to | chom den de jang chub sem pa'i theg pa la yang dag par zhug pa nam kyi | ji tar ne par gyi | ji tar drub par gyi | ji tar sem rab tu zung war gyi | de ke che söl pa dang | chom den de kyi tshe dang den pa rab jor la di ke ka tsal to | rab jor di la jang chub sem pa'i theg pa la yang dag par zhug pe di nyam du dag gi sem chen tham che phung po lhag ma me pa'i nya ngen le de pa'i ying su yong su nya ngen le da'o | de tar sem chen tshe me pa yong su nya ngen le de kyang sem chen gang yang yong su nya ngen le de par gyur pa me do nyam du sem kye par ja'o | de chi'i chir zhe na | rab jor gal te jang chub sem pa sem chen du du she jug na de jang chub sem pa zhe mi ja la | gang zag gi war du du she jug na yang | de jang chub sem pa zhe mi ja wa'i chir ro | de chi'i chir zhe na | rab jor jang chub sem pa'i theg pa la yang dag par zhug pa zhe ja wa'i chö de gang yang me pa'i chir ro |","rab jor di ji nyam du sem | de zhin sheg pe de zhin sheg pa mar me dze le gang la na me pa yang dag par dzog pa'i jang chub tu ngön par dzog par sang gye pa'i chö gang yang yö nyam mam | de ke che ka tsal pa dang | chom den de la tshe dang den pa rab jor gyi di ke che söl to | chom den de de zhin sheg pe de zhin sheg pa mar me dze le gang la na me pa yang dag par dzog pa'i jang chub tu ngön par dzog par sang gye pa'i chö de gang yang ma chhi so | de ke che söl pa dang | chom den de kyi tshe dang den pa rab jor la di ke che ka tsal to | rab jor de de zhin no | de de zhin te | de zhin sheg pe de zhin sheg pa mar me dze le gang la na me pa yang dag par dzog pa'i jang chub tu ngön par dzog par sang gye pa'i chö de gang yang me do | rab jor gal te de zhin sheg pe gang ngön par dzog par sang gye pa'i chö de ga zhig yö par gyur na | de zhin sheg pa mar me dze kyi nga la dram ze'i khye'u khyö ma ong pa'i dü na | de zhin sheg pa dra chom pa yang dag par dzog pa'i sang gye shakya thub pa zhe ja war gyur ro | zhe lung mi tön pa zhig na | rab jor di tar de zhin sheg pe gang la na me pa yang dag par dzog pa'i jang chub tu ngön par dzog par sang gye pa'i chö de gang yang me pe de'i chir de zhin sheg pa mar me dze kyi nga la dram ze'i khye'u khyö ma ong pa'i dü na de zhin sheg pa dra chom pa yang dag par dzog pa'i sang gye shakya thub pa zhe ja war gyur ro zhe lung ten to |","de chi'i chir zhe na | rab jor de zhin sheg pa zhe pa ni | yang dag pa'i de zhin nyi kyi tshig la dag yin pa'i chir ro | yang rab jor gang la la zhig di ke du | de zhin sheg pa dra chom pa yang dag par dzog pa'i sang gye kyi la na me pa yang dag par dzog pa'i jang chub tu ngön par dzog par sang gye so zhe zer na | de log par mra wa yin no | de chi'i chir zhe na | rab jor de zhin sheg pe gang la na me pa yang dag par dzog pa'i jang chub tu ngön par dzog par sang gye pa'i chö de gang yang me pa'i chir ro | rab jor de zhin sheg pe chö gang ngön par dzog par sang gye pa'am | ten pa de la den pa yang me | dzün pa yang me do | de we na de zhin sheg pe chö tham che sang gye kyi chö zhe sung so | rab jor chö tham che che ja wa ni | de dag tham che chö me pa yin te | de na chö tham che sang gye kyi chö zhe ja'o |","rab jor di ta te per na | kye bu zhig mi'i lü dang den zhing lü chen por gyur pa zhin no | tshe dang den pa rab jor gyi söl pa | chom den de de zhin sheg pe kye bu mi'i lü dang den zhing lü chen po zhe gang sung pa de de zhin sheg pe lü ma chhi par sung te | de na lü dang den zhing lü chen po zhe gyi'o |","chom den de kyi ka tsal pa | rab jor de de zhin no | de de zhin te | jang chub sem pa gang di ke du dag gi sem chen nam yong su nya ngen le da'o zhe zer na | de jang chub sem pa zhe mi ja'o | de chi'i chir zhe na | rab jor jang chub sem pa zhe ja wa'i chö de gang yang yö nyam mam | rab jor gyi söl pa | chom den de de ni ma lag so | chom den de kyi ka tsal pa | rab jor de we na | de zhin sheg pe chö tham che ni sem chen me pa | srog me pa gang zag me pa'o | zhe sung so | yang rab jor jang chub sem pa gang zhig di ke du | dag gi zhing kö pa nam drub bo zhe zer na | de yang de zhin du jö par ja'o | de chi'i chir zhe na | rab jor zhing kö pa nam zhing kö pa nam zhe ja wa ni | de dag kö pa me par de zhin sheg pe sung pa'i chir te | de na zhing kö pa nam zhe ja'o | rab jor jang chub sem pa gang zhig di ke du | chö nam ni dag me pa chö nam ni dag me pa'o zhe mö pa de ni | de zhin sheg pa dra chom pa yang dag par dzog pa'i sang gye kyi | jang chub sem pa sem pa chen po zhe jö do |"]}},{section:18,title:{english:"The Five Eyes"},content:{"tibetan-translit":["rab jor di ji nyam du sem | de zhin sheg pa la sha'i chen nga nyam mam | rab jor gyi söl pa | chom den de de de tar lag te | de zhin sheg pa la sha'i chen nga'o | chom den de kyi ka tsal pa | rab jor di ji nyam du sem | de zhin sheg pa la lha'i chen nga nyam mam | rab jor gyi söl pa | chom den de de de tar lag te | de zhin sheg pa la lha'i chen nga'o | chom den de kyi ka tsal pa | rab jor di ji nyam du sem | de zhin sheg pa la she rab kyi chen nga nyam mam | rab jor gyi söl pa | chom den de de de tar lag te | de zhin sheg pa la she rab kyi chen nga'o | chom den de kyi ka tsal pa | rab jor di ji nyam du sem | de zhin sheg pa la chö kyi chen nga nyam mam | rab jor gyi söl pa | chom den de de de tar lag te | de zhin sheg pa la chö kyi chen nga'o | chom den de kyi ka tsal pa | rab jor di ji nyam du sem | de zhin sheg pa la sang gye kyi chen nga nyam mam | rab jor gyi söl pa | chom den de de de tar lag te | de zhin sheg pa la sang gye kyi chen nga'o |","chom den de kyi ka tsal pa | rab jor di ji nyam du sem | ganga'i lung gi je ma ji nye pa ganga'i lung yang de nye kho nar gyur la | de dag gi je ma de nye kyi jig ten gyi kham su gyur na | jig ten gyi kham de dag mang wa yin nyam mam | rab jor gyi söl pa | chom den de de de tar lag te | jig ten gyi kham de dag mang lag so | chom den de kyi ka tsal pa | rab jor jig ten gyi kham de dag sem chen ji nye yö pa de dag gi sam pa tha de pe sem kyi gyün nge rab tu she so | de chi'i chir zhe na | rab jor sem kyi gyün sem kyi gyün zhe ja wa ni | de gyün me par de zhin sheg pe sung pa'i chir te | de na sem kyi gyün zhe ja'o | de chi'i chir zhe na | rab jor de pa'i sem kyang mig su me | ma ong pa'i sem kyang mig su me | da tar jung wa'i sem kyang mig su me pa'i chir ro |"]}},{section:19,title:{english:"Merit is Not Merit"},content:{"tibetan-translit":["rab jor di ji nyam du sem | gang gi tong sum gyi tong chen po'i jig ten gyi kham di rin po che na dün gyi rab tu gang war je te jin pa jin na | rig kyi bu'am | rig kyi bu mo de zhi de le sö nam mang du kye dam | rab jor gyi söl pa | chom den de mang lag so | de war sheg pa mang lag so | chom den de kyi ka tsal pa | rab jor de de zhin no | de de zhin te | rig kyi bu'am | rig kyi bu mo de zhi de le sö nam kyi phung po mang du kye do | yang rab jor gal te sö nam kyi phung po sö nam kyi phung por gyur pa na | sö nam kyi phung po sö nam kyi phung po zhe de zhin sheg pa mi sung so |"]}},{section:20,title:{english:"The Body is No-Body"},content:{"tibetan-translit":["rab jor di ji nyam du sem | zug kyi ku yong su drub pe de zhin sheg par ta war ja nyam mam | rab jor gyi söl pa | chom den de ni ma lag so | zug kyi ku yong su drub pe de zhin sheg par ta war mi gyi lag so | de chi'i le du zhe na | chom den de zug kyi ku yong su drub pa zhe gyi wa ni | de yong su drub pa ma chhi par de zhin sheg pe sung pa'i le du te | de na zug kyi ku yong su drub pa zhe gyi'o |","rab jor di ji nyam du sem | tshen phün sum tshog pe de zhin sheg par ta war ja nyam mam | rab jor gyi söl pa | chom den de de ni ma lag so | tshen phün sum tshog pe de zhin sheg par ta war mi gyi lag so | de chi'i le du zhe na | de zhin sheg pe tshen phün sum tshog pa gang sung pa de | tshen phün sum tshog pa ma chhi par de zhin sheg pe sung pa'i le du te | de na tshen phün sum tshog pa zhe gyi'o |"]}},{section:21,title:{english:"There is Nothing to be Said"},content:{"tibetan-translit":["chom den de kyi ka tsal pa | rab jor di ji nyam du sem | de zhin sheg pe di nyam du nge chö ten to zhe gong so nyam na | rab jor de de tar mi ta te | de zhin sheg pe gang ten pa'i chö de gang yang me pa'i chir ro | rab jor su zhig di ke du de zhin sheg pe chö ten to zhe zer na | rab jor de ni me pa dang log par zin pe nga la kur war gyur ro | de chi'i chir zhe na | rab jor chö ten pa zhe ja wa ni | gang chö ten pa chö ten pa zhe ja war mig par gyur wa'i chö de gang yang me pa'i chir ro |","de ne chom den de la tshe dang den pa rab jor gyi di ke che söl to | chom den de ma ong pa'i dü na | sem chen gang dag di ta bü'i chö she pa di thö ne | ngön par yi che par gyur wa jung wa ta chhi lag sam | chom den de kyi ka tsal pa | rab jor de dag ni sem chen yang ma yin | sem chen me pa yang ma yin no | de chi'i chir zhe na | rab jor sem chen nam zhe ja wa ni | de zhin sheg pe de dag sem chen me par sung pa'i chir te | de we na sem chen nam zhe ja'o |"]}},{section:22,title:{english:"Awakening is Not Attainable"},content:{"tibetan-translit":["rab jor di ji nyam du sem | de zhin sheg pe gang la na me pa yang dag par dzog pa'i jang chub tu ngön par dzog par sang gye pa'i chö de gang yang yö nyam mam | tshe dang den pa rab jor gyi söl pa | chom den de de zhin sheg pe gang la na me pa yang dag par dzog pa'i jang chub tu ngön par dzog par sang gye pa'i chö de gang yang ma chhi lag so | chom den de kyi ka tsal pa | rab jor de de zhin no | de de zhin te | de la chö chung ze kyang mi mig shing me de | de na la na me pa yang dag par dzog pa'i jang chub che ja'o |"]}},{section:23,title:{english:"The Equality of All Things"},content:{"tibetan-translit":["yang rab jor chö de ni nyam pa te | de la mi nyam pa dang nyam pa gang yang me pe | de na la na me pa yang dag par dzog pa'i jang chub che ja'o | la na me pa yang dag par dzog pa'i jang chub de ni dag me pa dang | sem chen me pa dang | srog me pa dang | gang zag me par nyam pa te | ge wa'i chö tham che kyi ngön par dzog par sang gye so | rab jor ge wa'i chö nam ge wa'i chö nam zhe ja wa ni | de dag chö me pa nyi du de zhin sheg pe sung te | de na ge wa'i chö nam zhe ja'o |"]}},{section:24,title:{english:"Merit Cannot Be Compared"},content:{"tibetan-translit":["yang rab jor rig kyi bu'am | rig kyi bu mo gang la la zhig gi tong sum gyi tong chen po'i jig ten gyi kham na ri'i gyal po ri rab dag ji nye yö pa de tsam gyi rin po che na dün gyi phung po ngön par dü te jin pa jin pa we | gang gi she rab kyi pha rol tu chin pa di le tha na tshig zhi pa'i tshig su che pa chig tsam zung ne | zhen dag la yang dag par ten na | rab jor sö nam kyi phung po di la sö nam kyi phung po nga ma de gya'i char yang nye war mi phö pa ne | gyü'i war du yang mi zö do |"]}},{section:25,title:{english:"No One is Liberated"},content:{"tibetan-translit":["rab jor di ji nyam du sem | de zhin sheg pe di nyam du nge sem chen nam drol lo zhe gong so nyam na | rab jor de de tar mi ta'o | de chi'i chir zhe na | rab jor de zhin sheg pe gang drol wa'i sem chen gang yang me pa'i chir ro | rab jor gal te de zhin sheg pe sem chen gang la la zhig drol war gyur na | di nyi de zhin sheg pa'i dag tu dzin pa gyur | sem chen du dzin pa dang | srog tu dzin pa dang | gang zag tu dzin par gyur ro | rab jor dag tu dzin che ja wa ni | dzin pa me par de zhin sheg pe sung na | de yang ji pa so so'i kye wo nam kyi zung ngo | rab jor ji pa so so'i kye wo nam zhe ja wa ni | de dag kye wo me pa nyi du de zhin sheg pe sung te | de na ji pa so so'i kye wo nam zhe ja'o |"]}},{section:26,title:{english:"The Dharmakāya is Not Seen by Marks"},content:{"tibetan-translit":["rab jor di ji nyam du sem | tshen phün sum tshog pe de zhin sheg par ta war ja nyam mam | rab jor gyi söl pa | chom den de de ni ma lag so | tshen phün sum tshog pe de zhin sheg par ta war mi gyi lag so | chom den de kyi ka tsal pa | rab jor de de zhin no | de de zhin te | tshen phün sum tshog pe de zhin sheg par ta war mi ja te | rab jor gal te tshen phün sum tshog pe de zhin sheg par ta war gyur na | khor lö gyur wa'i gyal po yang de zhin sheg par gyur te | de we na tshen phün sum tshog pe de zhin sheg par ta war mi ja'o | de ne chom den de la tshe dang den pa rab jor gyi di ke che söl to | chom den de dag gi ji tar chom den de kyi sung pa'i dön tshal wa tar na | tshen phün sum tshog pe de zhin sheg par ta war mi gyi lag so |","de ne chom den de kyi de'i tshe tshig su che pa di dag ka tsal to |","gang dag nga la zug su thong | gang dag nga la drar she pa |","log pa'i lam la zhug pa te | kye wo de dag nga mi thong |","sang gye nam ni chö nyi ta | dren pa nam ni chö kyi ku |","chö nyi she par ja min pe | de ni nam par she mi nü |"]}},{section:27,title:{english:"No Destruction of Marks"},content:{"tibetan-translit":["rab jor di ji nyam du sem | tshen phün sum tshog pe de zhin sheg pa dra chom pa yang dag par dzog pa'i jang chub tu ngön par dzog par sang gye so nyam du dzin na | rab jor khyö kyi de tar ta war mi ja te | rab jor tshen phün sum tshog pe de zhin sheg pa dra chom pa yang dag par dzog pa'i jang chub tu ngön par dzog par sang gye pa me do | rab jor khyö di nyam du jang chub sem pa'i theg pa la yang dag par zhug pa nam kyi | chö gang la la zhig nam par shig pa'am che par tag pa'o nyam du dzin na | rab jor de de tar ta war mi ja te | jang chub sem pa'i theg pa la yang dag par zhug pa nam kyi | chö gang yang nam par shig pa'am | che par tag pa me do |"]}},{section:28,title:{english:"Merit Not to be Grasped"},content:{"tibetan-translit":["yang rab jor rig kyi bu'am | rig kyi bu mo gang gi jig ten gyi kham ganga'i lung gi je ma nye dag rin po che na dün gyi rab tu gang war je te jin pa jin pa we | jang chub sem pa gang gi chö kyi nam drang di dag me ching kye wa me pa la zö pa thob na | de nyi zhi de le sö nam kyi phung po che mang du drang me pag tu me pa kye do | yang rab jor jang chub sem pe sö nam kyi phung po yong su zung war mi ja'o | tshe dang den pa rab jor gyi söl pa | chom den de jang chub sem pe sö nam kyi phung po yong su zung war mi gyi lag sam | chom den de kyi ka tsal pa | rab jor yong su zung mö kyi | log par mi zung te de na yong su zung zhe ja'o |"]}},{section:29,title:{english:"Beyond Action"},content:{"tibetan-translit":["yang rab jor gang la la zhig di ke du | de zhin sheg pa zhü dam | jön tam | zheng sam | zhug sam | nal war dze do zhe zer na | de yi nge she pa'i dön mi she so | de chi'i chir zhe na | rab jor de zhin sheg pa zhe ja wa ni | gar yang ma zhü | gang ne kyang ma jön pa'i chir te | de na de zhin sheg pa dra chom pa yang dag par dzog pa'i sang gye zhe ja'o |"]}},{section:30,title:{english:"Worlds are Not Worlds"},content:{"tibetan-translit":["yang rab jor rig kyi bu'am | rig kyi bu mo gang la la zhig gi | tong sum gyi tong chen po'i jig ten gyi kham na sa'i dül ji nye yö pa de dag | di ta te per na | dül thra rab kyi tshog zhin du che mar je na | rab jor di ji nyam du sem | dül thra rab kyi tshog de mang wa yin nyam mam | rab jor gyi söl pa | chom den de de de tar lag te | dül thra rab kyi tshog de mang wa lag so | de chi'i le du zhe na | chom den de gal te dül thra rab kyi tshog shig chhi par gyur na | chom den de kyi dül thra rab kyi tshog zhe ka mi tsöl wa'i le du'o | de chi'i le du zhe na | chom den de kyi dül thra rab kyi tshog zhe gang sung pa de tshog ma chhi par de zhin sheg pe sung pa'i le du te | de na dül thra rab kyi tshog zhe gyi'o || de zhin sheg pe tong sum gyi tong chen po'i jig ten gyi kham zhe gang sung pa de kham ma chhi par de zhin sheg pe sung te | de na tong sum gyi tong chen po'i jig ten gyi kham zhe gyi'o | de chi'i le du zhe na | chom den de gal te jig ten gyi kham shig chhi par gyur na | de nyi ril por dzin par gyur pa'i le du'o || de zhin sheg pe ril por dzin par sung pa de dzin pa ma chhi par de zhin sheg pe sung pa'i le du te | de na ril por dzin pa zhe gyi'o | chom den de kyi ka tsal pa | rab jor ril por dzin pa nyi ni tha nye de | chö de ni jö du me pa yin na | de yang ji pa so so'i kye wo nam kyi zung ngo |"]}},{section:31,title:{english:"Views are No-Views"},content:{"tibetan-translit":["rab jor gang la la zhig di ke du | de zhin sheg pe dag tu ta war sung | de zhin sheg pe sem chen du ta wa dang | srog tu ta wa dang | gang zag tu ta war sung so | zhe zer na de yang dag pe mra we mra wa yin nam | rab jor gyi söl pa | chom den de ni ma lag so | de war sheg pa de ni ma lag so || de chi'i le du zhe na | chom den de de zhin sheg pe dag tu ta war gang sung pa de ni ta wa ma chhi par de zhin sheg pe sung pa'i le du te | de na dag tu ta wa zhe gyi'o |","chom den de kyi ka tsal pa | rab jor di la jang chub sem pa'i theg pa la yang dag par zhug pe | di tar chö tham che she par ja | ta war ja | mö par ja te | chi ne chö su du she pa la mi ne par she par ja'o | de chi'i chir zhe na | rab jor chö su du she chö su du she zhe ja wa ni | de du she me par de zhin sheg pe sung pa'i chir te | de na chö su du she chö su du she zhe ja wa'o |"]}},{section:32,title:{english:"The Final Verse and Conclusion"},content:{"tibetan-translit":["yang rab jor jang chub sem pa sem pa chen po gang gi jig ten gyi kham pag tu me ching drang me pa dag rin po che na dün gyi rab tu gang war je te | jin pa jin pa we | rig kyi bu'am | rig kyi bu mo gang gi she rab kyi pha rol tu chin pa di le tha na tshig zhi pa'i tshig su che pa tsam dri ne dzin tam | chang ngam | log gam | kün chub par je dam | zhen dag la gya cher yang dag par rab tu tön na de nyi zhi de le sö nam che mang du drang me pag tu me pa kye do | ji tar yang dag par rab tu tön che na | ji tar yang dag par rab tu mi tön pa de zhin du yang dag par rab tu tön pa te | de na yang dag par rab tu tön pa zhe ja'o |","kar ma rab rib mar me dang | gyu ma zil pa chu bur dang |","mi lam log dang trin ta bu | dü je tham che de tar ta |","chom den de kyi de ke che ka tsal ne | ne ten rab jor dang | ge long de dag dang | jang chub sem pa de dag dang | khor zhi po ge long dang | ge long ma dang | ge nyen dang | ge nyen ma dang | lha dang | mi dang lha ma yin dang | dri zar che pa'i jig ten yi rang te | chom den de kyi sung pa la ngön par tö do || ||","phag pa she rab kyi pha rol tu chin pa dor je chö pa zhe ja wa theg pa chen po'i do dzog so || ||","na mo bha ga wa te | pra jnya pa ra mi ta ye | om na di ta dya tha | i li shi | i li shi | mi li shi | mi li shi | bhi na yan bhi na yan | na mo bha ga wa te | pra tyam pra ti | i ri ti | i ri ti | mi ri ti | mi ri ti | shu ri ti | shu ri ti | u shu ri | u shu ri | bhu yu ye bhu yu ye swa ha | dor je chö pa'i nying po di len chig de pe dor je chö pa thri gu tong lag pa dang nyam par gyur ro | ye dhar ma he tu pra bha wa he tun te shan ta tha ga to hya wa dat | te shan tsa yo ni ro dha e wam ba di ma ha shra ma na ye swa ha |"]}}];var zy=[{section:0,title:{english:"The Noble Perfection of Wisdom, the Vajra-Cutter"},content:{"sanskrit-translit":["vajracchedikā nāma triśatikā prajñāpāramitā |","||namo bhagavatyā āryaprajñāpāramitāyai||"]}},{section:1,title:{english:"The Setting"},content:{"sanskrit-translit":["evaṃ mayā śrutam | ekasmin samaye bhagavān śrāvastyāṃ viharati sma jetavane'nāthapiṇḍadasyārāme mahatā bhikṣusaṃghena sārthaṃ trayodaśabhirbhikṣuśataiḥ saṃbahulaiśca bodhisattvairmahāsattvaiḥ | atha khalu bhagavān pūrvāhṇakālasamaye nivāsya pātracīvaramādāya śrāvastīṃ mahānagarīṃ piṇḍāya prāvikṣat | atha khalu bhagavān śrāvastīṃ mahānagarīṃ piṇḍāya caritvā kṛtabhaktakṛtyaḥ paścādbhaktapiṇḍapātapratikrāntaḥ pātracīvaraṃ pratiśāmya pādau prakṣālya nyaṣīdatprajñapta evāsane paryaṅkamābhujya ṛjuṃ kāyaṃ praṇidhāya pratimukhīṃ smṛtimupasthāpya | atha khalu saṃbahulā bhikṣavo yena bhagavāṃstenopasaṃkrāman | upasaṃkramya bhagavataḥ pādau śirobhirabhivandya bhagavantaṃ triṣpradakṣiṇīkṛtya ekānte nyaṣīdan ||1||"]}},{section:2,title:{english:"Subhuti's Question"},content:{"sanskrit-translit":["tena khalu punaḥ samayenāyuṣmān subhūtistasyāmeva parṣadi saṃnipatito'bhūtsaṃniṣaṇṇaḥ | atha khalu āyuṣmān subhūtirutthāyāsanādekāṃsamuttarāsaṅgaṃ kṛtvā dakṣiṇaṃ jānumaṇḍalaṃ pṛthivyāṃ pratiṣṭhāpya yena bhagavāṃstenāñjaliṃ praṇamya bhagavantametadavocat- āścaryaṃ bhagavan, paramāścaryaṃ sugata, yāvadeva tathāgatenārhatā samyaksambuddhena bodhisattvā mahāsattvā anuparigṛhītāḥ parameṇānugraheṇa | āścaryaṃ bhagavan yāvadeva tathāgatenārhatā samyaksambuddhena bodhisattvā mahāsattvāḥ parīnditāḥ paramayā parīndanayā | tatkathaṃ bhagavan bodhisattvayānasaṃprasthitena kulaputreṇa vā kuladuhitrā vā sthātavyaṃ kathaṃ pratipattavyaṃ kathaṃ cittaṃ pragrahītavyam ?","evamukte bhagavānāyuṣmantaṃ subhūtimetadavocat- sādhu sādhu subhūte, evametatsubhūte, evametadyathā vadasi | anuparigṛhītāstathāgatena bodhisattvā mahāsattvāḥ parameṇānugraheṇa | parīnditāstathāgatena bodhisattvā mahāsattvāḥ paramayā parīndanayā | tena hi subhūte śṛṇu, sādhu ca suṣṭhu ca manasi kuru, bhāṣiṣye'haṃ te-yathā bodhisattvayānasaṃprasthitena sthātavyaṃ yathā pratipattavyaṃ yathā cittaṃ pragrahītavyam | evaṃ bhagavan ityāyuṣyān subhūtirbhagavataḥ pratyaśrauṣīt ||2||"]}},{section:3,title:{english:"The Bodhisattva's Vow"},content:{"sanskrit-translit":["bhagavānasyaitadavocat-iha subhūte bodhisattvayānasaṃprasthitenaiva cittamutpādayitavyam-yāvantaḥ subhūte sattvāḥ sattvadhātau sattvasaṃgraheṇa saṃgṛhītā aṇḍajā vā jarāyujā vā saṃsvedajā vā aupapādukā vā rūpiṇo vā arūpiṇo vā saṃjñino vā asaṃjñino vā naivasaṃjñino nāsaṃjñino vā, yāvān kaścitsattvadhātuḥ prajñapyamānaḥ prajñapyate, te ca mayā sarve'nupadhiśeṣe nirvāṇadhātau parinirvāpayitavyāḥ | evamaparimāṇānapi sattvān parinirvāpya na kaścitsattvaḥ parinirvāpito bhavati | tatkasya hetoḥ ? sacetsubhūte bodhisattvasya sattvasaṃjñā pravarteta, na sa bodhisattva iti vaktavyaḥ | tatkasya hetoḥ ? na sa subhūte bodhisattvo vaktavyo yasya sattvasaṃjñā pravarteta, jīvasaṃjñā vā pudgalasaṃjñā va pravarteta ||3||"]}},{section:4,title:{english:"Giving Without Abiding"},content:{"sanskrit-translit":["api tu khalu punaḥ subhūte na bodhisattvena vastupratiṣṭhitena dānaṃ dātavyam, na kvacitpratiṣṭhitena dānaṃ dātavyam | na rūpapratiṣṭhitena dānaṃ dātavyam | na śabdagandharasaspraṣṭavyadharmeṣu pratiṣṭhitena dānaṃ dātavyam | evaṃ hi sūbhūte bodhisattvena mahāsattvena dānaṃ dātavyaṃ yathā na nimittasaṃjñāyāmapi pratitiṣṭhet | tatkasya hetoḥ ? yaḥ subhūte bodhisattvo'pratiṣṭhito dānaṃ dadāti, tasya subhūte puṇyaskandhasya na sukaraṃ pramāṇāmudgrahītum | tatkiṃ manyase subhūte sukaraṃ pūrvasyāṃ diśi ākāśasya pramāṇamudgrahītum ? subhūtirāha-no hīdaṃ bhagavan | bhagavānāha- evaṃ dakṣiṇapaścimottarāsu adha ūrdhvaṃ digvidikṣu samantāddaśasu dikṣu sukaramākāśasya pramāṇamudgrahītum ? subhūtirāha-no hīdaṃ bhagavan | bhagavānāha-evameva subhūte yo bodhisattvo'pratiṣṭhito dānaṃ dadāti, tasya subhūte puṇyaskandhasya na sukaraṃ pramāṇamudgrahītum | evaṃ hi subhūte bodhisattvayānasaṃprasthitena dānaṃ dātavyaṃ yathā na nimittasaṃjñāyāmapi pratitiṣṭhet ||4||"]}},{section:5,title:{english:"Seeing Without Marks"},content:{"sanskrit-translit":["tatkiṃ manyase subhūte lakṣaṇasaṃpadā tathāgato draṣṭavyaḥ ? subhūtirāha-no hīdaṃ bhagavan | na lakṣaṇasaṃpadā tathāgato draṣṭavyaḥ | tatkasya hetoḥ ? yā sā bhagavan lakṣaṇasaṃpattathāgatena bhāṣitā saivālakṣaṇasaṃpat | evamukte bhagavānāyuṣmantaṃ subhūtimetadavocat yāvatsubhūte lakṣaṇasaṃpat tāvanmṛṣā, yāvadalakṣaṇasaṃpat tāvanna mṛṣeti hi lakṣaṇālakṣaṇatastathāgato draṣṭavyaḥ ||5||"]}},{section:6,title:{english:"The Rarity of True Faith"},content:{"sanskrit-translit":["evamukte āyuṣmān subhūtirbhagavantametadavocat- asti bhagavan | kecitsattvā bhaviṣyantyanāgate'dhvani paścime kāle paścime samaye paścimāyāṃ pañcaśatyāṃ saddharmavipralopakāle vartamāne, ye imeṣvevaṃrūpeṣu sūtrāntapadeṣu bhāṣyamāṇeṣu bhūtasaṃjñāmutpādayiṣyanti | bhagavānāha- mā subhūte evaṃ vocaḥ | asti kecitsattvā bhaviṣyantyanāgate'dhvani paścime kāle paścime samaye paścimāyāṃ pañcaśatyāṃ saddharmavipralope vartamāne, ye imeṣvevaṃrūpeṣu sūtrāntapadeṣu bhāṣyamāṇeṣu bhūtasaṃjñāmutpādayiṣyanti | api tu khalu punaḥ subhūte bhaviṣyantyanāgate'dhvani bodhisattvā mahāsattvāḥ paścime kāle paścime samaye paścimāyāṃ pañcaśatyāṃ saddharmavipralope vartamāne guṇavantaḥ śīlavantaḥ prajñāvantaśca bhaviṣyanti, ye imeṣvevaṃrūpeṣu sūtrāntapadeṣu bhāṣyamāṇeṣu bhūtasaṃjñāmutpādayiṣyanti | na khalu punaste subhūte bodhisattvā mahāsattvā ekabuddhaparyupāsitā bhaviṣyanti, naikabuddhāvaropitakuśalamūlā bhaviṣyanti | api tu khalu punaḥ subhūte anekabuddhaśatasahasraparyupāsitā anekabuddhaśatasahasrāvaropitakuśalamūlāste bodhisattvā mahāsattvā bhaviṣyanti, ye imeṣvevaṃrūpeṣu sūtrāntapadeṣu bhāṣyamāṇeṣu ekacittaprasādamapi pratilapsyante | jñātāste subhūte tathāgatena buddhajñānena, dṛṣṭāste subhūte tathāgatena buddhacakṣuṣā, buddhāste subhūte tathāgatena | sarve te subhūte aprameyāmasaṃkhyeyaṃ puṇyaskandhaṃ prasaviṣyanti pratigrahīṣyanti | tatkasya hetoḥ ? na hi subhūte teṣāṃ bodhisattvānāṃ mahāsattvānāmātmasaṃjñā pravartate, na sattvasaṃjñā, na jīvasaṃjñā, na pudgalasaṃjñā pravartate | nāpi teṣāṃ subhūte bodhisattvānāṃ mahāsattvānāṃ dharmasaṃjñā pravartate | evaṃ nādharmasaṃjñā | nāpi teṣāṃ subhūte saṃjñā nāsaṃjñā pravartate | tatkasya hetoḥ ? sacetsubhūte teṣāṃ bodhisattvānāṃ mahāsattvānāṃ dharmasaṃjñā pravarteta, sa eva teṣāmātmagrāho bhavet, sattvagrāho jīvagrāhaḥ pudgalagrāho bhavet | sacedadharmasaṃjñā pravarteta, sa eva teṣāmātmagrāho bhavet, sattvagrāho jīvagrāhaḥ pudgalagrāha iti | tatkasya hetoḥ ? na khalu punaḥ subhūte bodhisattvena mahāsattvena dharma udgrahītavyo nādharmaḥ | tasmādiyaṃ tathāgatena saṃdhāya vāgbhāṣitā-kolopamaṃ dharmaparyāyamājānadbhidharmā eva prahātavyāḥ prāgevādharmā iti ||6||"]}},{section:7,title:{english:"Nothing Attained, Nothing Taught"},content:{"sanskrit-translit":["punaraparaṃ bhagavānāyuṣmantaṃ subhūtimetadavocat- tatkiṃ manyase subhūte, asti sa kaściddharmo yastathāgatenānuttarā samyaksambodhirityabhisaṃbuddhaḥ, kaścidvā dharmastathāgatena deśitaḥ ? evamukte āyuṣmān subhūtirbhagavantametadavocat-yathāhaṃ bhagavan bhagavato bhāṣitasyārthamājānāmi, nāsti sa kaściddharmo yastathāgatenānuttarā samyaksambodhirityabhisaṃbuddhaḥ, nāsti dharmo yastathāgatena deśitaḥ | tatkasya hetoḥ ? yo'sau tathāgatena dharmo'bhisaṃbuddho deśito vā, agrāhyaḥ so'nabhilapyaḥ | na sa dharmo nādharmaḥ | tatkasya hetoḥ ? asaṃskṛtaprabhāvitā hyāryapudgalāḥ ||7||"]}},{section:8,title:{english:"The Merit of Giving"},content:{"sanskrit-translit":["bhagavānāha- tatkiṃ manyase subhūte yaḥ kaścitkulaputro vā kuladuhitā vā imaṃ trisāhasramahāsāhasraṃ lokadhātuṃ saptaratnaparipūrṇaṃ kṛtvā tathāgatebhyo'rhadbhyaḥ samyaksambuddhebhyo dānaṃ dadyāt, api nu sa kulaputro vā kuladuhitā vā tatonidānaṃ bahu puṇyaskandhaṃ prasunuyāt | subhūtirāha-bahu bhagavan, bahu sugata sa kulaputro vā kuladuhitā vā tatonidānaṃ puṇyaskandhaṃ prasunuyāt | tatkasya hetoḥ ? yo'sau bhagavan puṇyaskandhastathāgatena bhāṣitaḥ, askandhaḥ sa tathāgatena bhāṣitaḥ | tasmāttathāgato bhāṣate- puṇyaskandhaḥ puṇyaskandha iti | bhagavānāha-yaśca khalu punaḥ subhūte kulaputro vā kuladuhitā va imaṃ trisāhasramahāsāhasraṃ lokadhātuṃ saptaratnaparipūrṇaṃ kṛtvā tathāgatebhyo'rhadbhyaḥ samyaksambuddhebhyo dānaṃ dadyāt, yaśca ito dharmaparyāyādantaśaścatuṣpādikāmapi gāthāmudgṛhya parebhyo vistareṇa deśayet saṃprakāśayet, ayameva tatonidānaṃ bahutaraṃ puṇyaskandhaṃ prasunuyādaprameyāsaṃkhyeyam | tatkasya hetoḥ ? atonirjātā hi subhūte tathāgatānāmarhatāṃ samyaksambuddhānāmanuttarā samyaksambodhiḥ, atonirjātāśca buddhā bhagavantaḥ | tatkasya hetoḥ ? buddhadharmā buddhadharmā iti subhūte abuddhadharmāścaiva te tathāgatena bhāṣitāḥ | tenocyante buddhadharmā iti ||8||"]}},{section:9,title:{english:"The Four Fruits are Not Attained"},content:{"sanskrit-translit":["tatkiṃ manyase subhūte api nu srotaāpannasyaivaṃ bhavati-mayā srotaāpattiphalaṃ prāptamiti? subhūtirāha-no hīdaṃ bhagavan | na srotaāpannasyaivaṃ bhavati-mayā srotaāpattiphalaṃ prāptamiti | tatkasya hetoḥ ? na hi sa bhagavan kaṃciddharmamāpannaḥ, tenocyate srotaāpanna iti | na rūpamāpanno na śabdān na gandhān na rasān na spraṣṭavyān dharmānāpannaḥ | tenocyate srotaāpanna iti | sacedbhagavan srotaāpannasyaivaṃ bhavet- mayā srotaāpattiphalaṃ prāptamiti, sa eva tasyātmagrāho bhavet, sattvagrāho jīvagrāhaḥ pudgalagrāho bhavediti ||","bhagavānāha- takiṃ manyase subhūte api nu sakṛdāgāmina evaṃ bhavati-mayā sakṛdāgāmiphalaṃ prāptamiti ? subhūtirāha-no hīdaṃ bhagavan | sa sakṛdāgāmina evaṃ bhavati-mayā sakṛdāgāmiphalaṃ prāptamiti | tatkasya hetoḥ ? na hi sa kaściddharmo yaḥ sakṛdāgāmitvamāpannaḥ | tenocyate sakṛdāgāmīti ||","bhagavānāha-tatkiṃ manyase subhūte api nu anāgāmina evaṃ bhavati-mayanāgāmiphalaṃ prāptamiti ? subhūtirāha-no hīdaṃ bhagavan | na anāgāmina evaṃ bhavati-mayā anāgāmiphalaṃ prāptamiti | tatkasya hetoḥ ? na hi sa bhagavan kaściddharmo yo'nāgāmitvamāpannaḥ | tenocyate anāgāmīti ||","bhagavānāha- tatkiṃ manyase subhūte api nu arhata evaṃ bhavati-mayā arhattvaṃ prāptamiti ? subhūtirāha-no hīdaṃ bhagavan | nārhata evaṃ bhavati-mayā arhattvaṃ prāptamiti | tatkasya hetoḥ ? na hi sa bhagavan kaściddharmo yo'rhannāma | tenocyate-arhanniti | sacedbhagavan arhata evaṃ bhavet-mayā arhattvaṃ prāptamiti, sa eva tasyātmagrāho bhavet, sattvagrāho jīvagrāhaḥ pudgalagrāho bhavet | tatkasya hetoḥ ? ahamasmi bhagavaṃstathāgatenārhatā samyaksambuddhena araṇāvihāriṇāmagryo nirdiṣṭaḥ | ahamasmi bhagavan arhan vītarāgaḥ | na ca me bhagavannevaṃ bhavati- arhannasmyahaṃ vītarāga iti | sacenmama bhagavannevaṃ bhavet-mayā arhattvaṃ prāptamiti, na māṃ tathāgato vyākariṣyadaraṇāvihāriṇāmagryaḥ subhūtiḥ kulaputro na kvacidviharati, tenocyate araṇāvihārī araṇāvihārīti ||9||"]}},{section:10,title:{english:"Adorning the Pure Land"},content:{"sanskrit-translit":["bhagavānāha-tatkiṃ manyase subhūte-asti sa kaściddharmo yastathāgatena dīpaṃkarasya tathāgatasyārhata-samyaksambuddhasyāntikādudgṛhītaḥ? subhūtirāha- no hīdaṃ bhagavan | nāsti sa kaściddharmo yastathāgatena dīpaṃkarasya tathāgatasyārhataḥ samyaksambuddhasyāntikādudgṛhītaḥ ||","bhagavānāha-yaḥ kaścitsubhūte bodhisattva evaṃ vadet-ahaṃ kṣetravyūhān niṣpādayiṣyāmīti, sa vitathaṃ vadet | tatkasya hetoḥ ? kṣetravyūhāḥ kṣetravyūhā iti subhūte avyūhāste tathāgatena bhāṣitāḥ | tenocyante kṣetravyūhā iti | tasmāttarhi subhūte bodhisattvena mahāsattvena evamapratiṣṭhitaṃ cittamutpādayitavyaṃ yanna kvacitpratiṣṭhitaṃ cittamutpādayitavyam | na rūpapratiṣṭhitaṃ cittamutpādayitavyaṃ na śabdagandharasaspraṣṭavyadharmapratiṣṭhitaṃ cittamutpādayitavyam | tadyathāpi nāma subhūte puruṣo bhavedupetakāyo mahākāyo yattasyaivaṃ rūpa ātmabhāvaḥ syāt tadyathāpi nāma sumeruḥ parvatarājaḥ | tatkiṃ manyase subhūte api nu mahān sa ātmabhāvo bhavet ? subhūtirāha-mahān sa bhagavān, mahān sugata sa ātmabhāvo bhavet | tatkasya hetoḥ ? ātmabhāva ātmabhāva iti bhagavan na bhāvaḥ sa tathāgatena bhāṣitaḥ | tenocyata ātmabhāva iti | na hi bhagavan sa bhāvo nābhāvaḥ | tenocyate ātmabhāva iti ||10||"]}},{section:11,title:{english:"The Merit of Upholding the Dharma is Supreme"},content:{"sanskrit-translit":["bhagavānāha- tatkiṃ manyase subhūte-yāvatyogaṅgāyāṃ mahānadyāṃ vālukāstāvatya eva gaṅgānadyo bhaveyuḥ ? tāsu yā vālukāḥ, api nu tā bahvayo bhaveyuḥ ? subhūtirāha-tā eva tāvadbhagavan bahvayo gaṅgānadyo bhaveyuḥ, prāgeva yāstāsu gaṅgānadīṣu vālukāḥ | bhagavānāha- ārocayāmi te subhūte, prativedayāmi te | yāvatyastāsu gaṅgānadīṣu vālukā bhaveyustāvato lokadhātūn kaścideva strī vā puruṣo vā saptaratnaparipurṇaṃ kṛtvā tathāgatebhyo'rhadbhyaḥ samyaksambuddhebhyo dānaṃ dadyāt, tat kiṃ manyase subhūte-api nu sā strī vā puruṣo vā tatonidānaṃ bahu puṇyaskandhaṃ prasunuyāt ? subhūtirāha-bahu bhagavan, bahu sugata strī vā puruṣo vā tatonidānaṃ puṇyaskandhaṃ prasunuyādaprameyāmasaṃkhyeyam | bhagavānāha- yaśca khalu punaḥ subhūte strī vā puruṣo vā tāvato lokadhātūn saptaratnaparipūrṇaṃ kṛtvā tathāgatebhyo'rhadbhyaḥ samyaksambuddhebhyo dānaṃ dadyāt, yaśca kulaputro vā kuladuhitā vā ito dharmaparyāyādantaśaścatuṣpādikāmapi gāthāmudgṛhya parebhyo deśayet saṃprakāśayet, ayameva tatonidānaṃ bahutaraṃ puṇyaskandhaṃ prasunuyādaprameyāmasaṃkhyeyam ||11||"]}},{section:12,title:{english:"Honoring the Teaching"},content:{"sanskrit-translit":["api tu khalu punaḥ subhūte yasmin pṛthivīpradeśe ito dharmaparyāyādantaśaścatuṣpādikāmapi gāthāmudgṛhya bhāṣyeta vā saṃprakāśyeta vā, sa pṛthivīpradeśaścaityabhūto bhavet sadevamanuṣāsurasya lokasya, kaḥ punarvādo ya imaṃ dharmaparyāyaṃ sakalasamāptaṃ dhārayiṣyanti vācayiṣyanti paryavāpsyanti, parebhyaśca vistareṇa saṃprakāśayiṣyanti | parameṇa te subhūte āścāryeṇa samanvāgatā bhaviṣyanti | tasmiṃśca subhūte pṛthivīpradeśe śāstā viharatyanyatarānyataro vā vijñagurusthānīyaḥ ||12||"]}},{section:13,title:{english:"The Name of the Discourse"},content:{"sanskrit-translit":["evamukte āyuṣmān subhūtirbhagavantametadavocat-ko nāma ayaṃ bhagavan dharmaparyāyaḥ, kathaṃ cainaṃ dhārayāmi ? evamukte bhagavānāyuṣmantaṃ subhūtimetadavocat- prajñāpāramitā nāmāyaṃ subhūte dharmaparyāyaḥ | evaṃ cainaṃ dhāraya | tatkasya hetoḥ ? yaiva subhūte prajñāpāramitā tathāgatena bhāṣitā, saiva apāramitā tathāgatena bhāṣitā | tenocyate prajñāpāramiteti ||","tatkiṃ manyase subhūte-api nu asti sa kaściddharmo yastathāgatena bhāṣitaḥ ? subhūtirāha-no hīdaṃ bhagavan | nāsti sa kaściddharmo yastathāgatena bhāṣitaḥ ||","bhagavānāha-tatkiṃ manyase subhūte-yāvat trisāhasramahāsāhasre lokadhātau pṛthivīrajaḥ kaccit, tadbahu bhavet ? subhūtirāha-bahu bhagavan, bahu sugata pṛthivīrajo bhavet | tatkasya hetoḥ ? yattadbhagavan pṛthivīrajastathāgatena bhāṣitam, arajastadbhagavaṃstathāgatena bhāṣitam | tenocyate pṛthivīraja iti | yo'pyasau lokadhātustathāgatena bhāṣitaḥ, adhātuḥ sa tathāgatena bhāṣitaḥ | tenocyate lokadhāturiti ||","bhagavānāha- tatkiṃ manyase subhūte dvātriṃśanmahāpuruṣalakṣaṇaistathāgato'rhan samyaksambuddho draṣṭavyaḥ ? subhūtirāha-no hīdaṃ bhagavan | dvātriṃśanmahāpuruṣalakṣaṇaistathāgato'rhan samyaksambuddho draṣṭavyaḥ | tatkasya hetoḥ ? yāni hi tāni bhagavan dvātriṃśanmahāpuruṣalakṣaṇāni tathāgatena bhāṣitāni, alakṣaṇāni tāni bhagavaṃstathāgatena bhāṣitāni | tenocyante dvātriṃśanmahāpuruṣalakṣaṇānīti ||","bhagavānāha-yaśca khalu punaḥ subhūte strī vā puruṣo vā dine dine gaṅgānadīvālukāsamānātmabhāvān parityajet, evaṃ parityajan gaṅgānadīvālukāsamān kalpāṃstānātmabhāvān parityajet, yaśca ito dharmaparyāyadantaśaścatuṣpādikāmapi gāthāmudgṛhyaparebhyo deśayet saṃprakāśayet, ayameva tatonidānaṃ bahutaraṃ puṇyaskandhaṃ prasunuyādaprameyāmasaṃkhyeyam ||13||"]}},{section:14,title:{english:"The Perfection of the Teaching is No-Perfection"},content:{"sanskrit-translit":["atha khalvāyuṣmān subhūtirdharmavegenāśrūṇi prāmuñcat | so'śrūṇi pramṛjya bhagavantametadavocat-āścaryaṃ bhagavan, paramāścaryaṃ sugata, yāvadayaṃ dharmaparyāyastathāgatenā bhāṣito'grayānasaṃprasthitānāṃ sattvānāmarthāya, śreṣṭhayānasaṃprasthitānāmarthāya, yato me bhagavan jñānamutpannam | na mayā bhagavan jātvevaṃrūpo dharmaparyāyaḥ śrutapūrvaḥ | parameṇa te bhagavan āścāryeṇa samanvāgatā bodhisattvā bhaviṣyanti, ya iha sūtre bhāṣyamāṇe śrutvā bhūtasaṃjñāmutpādayiṣyanti | tatkasya hetoḥ ? yā caiṣā bhagavan bhūtasaṃjñā, saiva abhūtasaṃjñā | tasmāttathāgato bhāṣatebhūtasaṃjñā bhūtasaṃjñeti ||","na mama bhagavan āścaryaṃ yadahamimaṃ dharmaparyāyaṃ bhāṣyamāṇamavakalpayāmi adhimucye | ye'pi te bhagavan sattvā bhaviṣyantyanāgate'dhvani paścime kāle paścime samaye paścimāyāṃ pañcaśatyāṃ saddharmavipralope vartamāne, ya imaṃ bhagavan dharmaparyāyamudgrahīṣyanti dhārayiṣyanti vācayiṣyanti paryavāpsyanti, parebhyaśca vistareṇa saṃprakāśayiṣyanti, te paramāścaryeṇa samanvāgatā bhaviṣyanti | api tu khalu punarbhagavan na teṣāmātmasaṃjñā pravartiṣyate, na sattvasaṃjñā na jīvasaṃjñā na pudgalasaṃjñā pravartiṣyate, nāpi teṣāṃ kācitsaṃjñā nāsaṃjñā pravartate | tatkasya hetoḥ ? yā sā bhagavan ātmasaṃjñā, saivāsaṃjñā | yā sattvasaṃjñā jīvasaṃjñā pudgalasaṃjñā, saivāsaṃjñā | tatkasya hetoḥ ? sarvasaṃjñāpagatā hi buddhā bhagavantaḥ ||","evamukte bhagavānāyuṣmantaṃ subhūtimetadavocat-evametat subhūte, evametat | paramāścaryasamanvāgatāste sattvā bhaviṣyanti, ya iha subhūte sūtre bhāṣyamāṇe notrasiṣyanti na saṃtrasiṣyanti na saṃtrāsamāpatsyante | tatkasya hetoḥ ? paramapāramiteyaṃ subhūte tathāgatena bhāṣitā yadutāpāramitā | yāṃ ca subhūte tathāgataḥ paramapāramitāṃ bhāṣate, tāmaparimāṇā api buddhā bhagavanto bhāṣante | tenocyante paramapāramiteti ||","api tu khalu punaḥ subhūte yā tathāgatasya kṣāntipāramitā, saiva apāramitā | tatkasya hetoḥ ? yadā me subhūte kalirājā aṅgapratyaṅgamāṃsānyacchaitsīt, nāsīnme tasmin samaye ātmasaṃjñā vā sattvasaṃjñā vā jīvasaṃjñā vā pudgalasaṃjñā vā, nāpi me kācitsaṃjñā vā asaṃjñā vā babhūva | tatkasya hetoḥ ? sacenme subhūte tasmin samaye ātmasaṃjñā abhaviṣyat, vyāpādasaṃjñāpi me tasmin samaye'bhaviṣyat | sacetsattvasaṃjñā jīvasaṃjñā pudgalasaṃjñābhaviṣyat, vyāpādasaṃjñāpi me tasmin samaye'bhaviṣyat | tatkasya hetoḥ ? abhijānāmyahaṃ subhūte atīte'dhvani pañca jātiśatāni yadahaṃ kṣāntivādī ṛṣirabhūvam | tatrāpi me nātmasaṃjñā babhūva, na sattvasaṃjñā, na jīvasaṃjñā, na pudgalasaṃjñā babhūva | tasmāttarhi subhūte bodhisattvena mahāsattvena sarvasaṃjñā vivarjayitvā anuttarāyāṃ samyaksambodhau cittamutpādayitavyam | na rūpapratiṣṭhitaṃ cittamutpādayitavyam, na śabdagandharasaspraṣṭavyadharmapratiṣṭhitaṃ cittamutpādayitavyam, na dharmapratiṣṭhitaṃ cittamutpādayitavyam, nādharmapratiṣṭhitaṃ cittamutpādayitavyam, na kvacitpratiṣṭhitaṃ cittamutpādayitavyam | tatkasya hetoḥ ? yatpratiṣṭhitaṃ tadevāpratiṣṭhitam | tasmādeva tathāgato bhāṣate-apratiṣṭhitena bodhisattvena dānaṃ dātavyam | na rūpaśabdagandharasasparśadharmapratiṣṭhitena dānaṃ dātavyam ||","api tu khalu punaḥ subhūte bodhisattvena evaṃrūpo dānaparityāgaḥ kartavyaḥ sarvasattvānāmarthāya | tatkasya hetoḥ ? yā caiṣā subhūte sattvasaṃjñā, saiva asaṃjñā | ya evaṃ te sarvasattvāstathāgatena bhāṣitāsta eva asattvāḥ | tatkasya hetoḥ ? bhūtavādī subhūte tathāgataḥ, satyavādī tathāvādī ananyathāvādī tathāgataḥ, na vitathavādī tathāgataḥ ||","api tu khalu punaḥ subhūte yastathāgatena dharmo'bhisaṃbuddho deśito nidhyātaḥ, na tatra satyaṃ na mṛṣā | tadyathāpi nāma subhūte puruṣo'ndhakārapraviṣṭo na kiṃcidapi paśyet, evaṃ vastupatito bodhisattvo draṣṭavyo yo vastupatito dānaṃ parityajati | tadyathāpi nāma subhūte cakṣuṣmān puruṣaḥ prabhātāyāṃ rātrau sūrye'bhyudgate nānāvidhāni rūpāṇi paśyet, evamavastupatito bodhisattvo draṣṭavyo yo'vastupatito dānaṃ parityajati ||","api tu khalu punaḥ subhūte ye kulaputrā vā kuladuhitaro vā imaṃ dharmaparyāyamudgrahīṣyanti dhārayiṣyanti vācayiṣyanti paryavāpsyanti, parebhyaśca vistareṇa saṃprakāśayiṣyanti, jñātāste subhūte tathāgatena buddhajñānena, dṛṣṭāste subhūte tathāgatena buddhacakṣuṣā, buddhāste tathāgatena | sarve te subhūte sattvā aprameyāmasaṃkhyeyaṃ puṇyaskandhaṃ prasaviṣyanti pratigrahīṣyanti ||14||"]}},{section:15,title:{english:"The Merit of Upholding the Teaching"},content:{"sanskrit-translit":["yaśca khalu punaḥ subhūte strī vā puruṣo vā purvāhṇakālasamaye gaṅgānadīvālukāsamānātmabhāvān parityajet, evaṃ madhyāhnakālasamaye gaṅgānadīvālukāsamānātmabhāvān parityajet, sāyāhnakālasamaye gaṅgānadīvālukāsamānātmabhāvān parityajet, anena paryāyeṇa bahūni kalpakoṭiniyutaśatasahasrāṇyātmabhāvān parityajet, yaścemaṃ dharmaparyāyaṃ śrutvā na pratikṣipet, ayameva tatonidānaṃ bahutaraṃ puṇyaskandhaṃ prasunuyādaprameyāmasaṃkhyeyam, kaḥ punarvādo yo likhitvā udgṛhṇīyāddhārayedvācayetparyavāpnuyāt, parebhyaśca vistareṇa saṃprakāśayet ||","api tu khalu punaḥ subhūte acintyo'tulyo'yaṃ dharmaparyāyaḥ | ayaṃ ca subhūte dharmaparyāyastathāgatenā bhāṣito'grayānasaṃprasthitānāṃ sattvānāmarthāya, śreṣṭhayānasaṃprasthitānāṃ sattvānāmarthāya | ye imaṃ dharmaparyāyamudgrahīṣyanti dhārayiṣyanti vācayiṣyanti paryavāpsyanti, parebhyaśca vistareṇa saṃprakāśayiṣyanti, jñātāste subhūte tathāgatena buddhajñānena, dṛṣṭāste subhūte tathāgatena buddhacakṣuṣā, buddhāste tathāgatena | sarve te subhūte sattvā aprameyeṇa puṇyaskandhenāṃ samanvāgatā bhaviṣyanti | acintyenātulyenāmāpyenāparimāṇena puṇyaskandhena samanvāgatā bhaviṣyanti | sarve te subhūte sattvāḥ samāṃśena bodhiṃ dhārayiṣyanti vacayiṣyanti paryavāpsyanti | tatkasya hetoḥ ? na hi śakyaṃ subhūte ayaṃ dharmaparyāyo hīnādhimuktikaiḥ sattvaiḥ śrotum, nātmadṛṣṭikairna sattvadṛṣṭikairna jīvadṛṣṭikairna pudgaladṛṣṭikaiḥ | nābodhisattvapratijñai sattvaiḥ śakyamayaṃ dharmaparyāyaḥ śrotuṃ vā udgrahītuṃ vā dhārayituṃ vā vācayituṃ vā paryavāptuṃ vā | nedaṃ sthānaṃ vidyate ||","api tu khalu punaḥ subhūte yatra pṛthivīpradeśe idaṃ sūtraṃ prakāśayiṣyate, pūjanīyaḥ sa pṛthivīpradeśo bhaviṣyati sadevamanuṣāsurasya lokasya | vandanīyaḥ pradakṣiṇīyaśca sa pṛthivīpradeśo bhaviṣyati, caityabhūtaḥ sa pṛthivīpradeśo bhaviṣyati ||15||"]}},{section:16,title:{english:"The Purification of Karma"},content:{"sanskrit-translit":["api tu ye te subhūte kulaputrā vā kuladuhitaro vā imānevaṃrūpān sūtrāntānudgrahīṣyanti dhārayiṣyanti vācayiṣyanti paryavāpsyanti, yoniśaśca manasikariṣyanti, parebhyaśca vistareṇa saṃprakāśayiṣyanti, te paribhūtā bhaviṣyanti, suparibhūtāśca bhaviṣyanti | tatkasya hetoḥ ? yāni ca teṣāṃ subhūte sattvānāṃ paurvajanmikānyaśubhāni karmāṇi kṛtānyapāyasaṃvartanīyāni, dṛṣṭa eva dharme paribhūtatayā tāni paurvajanmikānyaśubhāni karmāṇi kṣapayiṣyanti, buddhabodhiṃ cānuprāpsyanti ||","abhijānāmyahaṃ subhūte atīte'dhvanyasaṃkhyeyaiḥ kalpairasaṃkhyeyatarairdīpaṃkarasya tathāgatasyārhataḥ samyaksambuddhasya pareṇa paratareṇa caturaśītibuddhakoṭiniyutaśatasahasrāṇyabhūvan ye mayārāgitāḥ, ārāgya na virāgitāḥ | yacca mayā subhūte te buddhā bhagavanta ārāgitāḥ, ārāgya na virāgitāḥ, yacca paścime kāle paścime samaye paścimāyāṃ pañcaśatyāṃ saddharmavipralopakāle vartamāne imānevaṃrūpān sūtrāntānudgrahīṣyanti dhārayiṣyanti vācayiṣyanti paryavāpsyanti, parebhyaśca vistareṇa saṃprakāśayiṣyanti, asya khalu punaḥ subhūte puṇyaskandhasyāntikādasau paurvakaḥ puṇyaskandhaḥ śatatamīmapi kalāṃ nopaiti, sahasratamīmapi śatasahasratamīmapi koṭimamipi koṭiśatatamīmapi koṭiśatasahasratamīmapi koṭiniyutaśatasahasratamīmapi | saṃkhyāmapi kalāmapi gaṇanāmapi upamāmapi upaniṣadamapi yāvadaupamyamapi na kṣamate ||","sacetpunaḥ subhūte teṣāṃ kulaputrāṇāṃ kuladuhitṝṇāṃ vā ahaṃ puṇyaskandhaṃ bhāṣeyam, yāvatte kulaputrā vā kuladuhitaro vā tasmin samaye puṇyaskandhaṃ prasaviṣyanti, pratigrahīṣyanti, unmādaṃ sattvā anuprāpnuyuścittavikṣepaṃ vā gaccheyuḥ | api tu khalu punaḥ subhūte acintyo'tulyo'yaṃ dharmaparyāyastathāgatena bhāṣitaḥ | asya acintya eva vipākaḥ pratikāṅkṣitavyaḥ ||16||"]}},{section:17,title:{english:"No Attainment, No Dharma"},content:{"sanskrit-translit":["atha khalvāyuṣmān subhūtirbhagavantametadavocat-kathaṃ bhagavan bodhisattvayānasaṃprasthitena sthātavyam, kathaṃ pratipattavyam, kathaṃ cittaṃ pragrahītavyam ? bhagavānāha-iha subhūte bodhisattvayānasaṃprasthitena evaṃ cittamutpādayitavyam-sarve sattvā mayā anupadhiśeṣe nirvāṇadhātau parinirvāpayitavyāḥ | evaṃ sa sattvān parinirvāpya na kaścitsattvaḥ parinirvāpito bhavati | tatkasya hetoḥ ? sacetsubhūte bodhisattvasya sattvasaṃjñā pravarteta, na sa bodhisattva iti vaktavyaḥ | jīvasaṃjñā vā yāvatpudgalasaṃjñā vā pravarteta, na sa bodhisattva iti vaktavyaḥ | tatkasya hetoḥ ? nāsti subhūte sa kaściddharmo yo bodhisattvayānasaṃprasthito nāma ||","tatkiṃ manyase subhūte asti sa kaściddharmo yastathāgatena dīpaṃkarasya tathāgatasyāntikādanuttarāṃ samyaksambodhimabhisaṃbuddhaḥ ? evamukte āyuṣmān subhūtirbhagavantametadavocat- yathāhaṃ bhagavato bhāṣitasyārthamājānāmi, nāsti sa bhagavan kaściddharmo yastathāgatena dīpaṃkarasya tathāgatasyārhataḥ samyaksambuddhasyāntikādanuttarāṃ samyaksambodhimabhisaṃbuddhaḥ | evamukte bhagavānāyuṣmantaṃ subhūtimetadavocat-evametatsubhūte, evametat | nāsti subhūte sa kaściddharmo yastathāgatena dīpaṃkarasya tathāgatasyārhataḥ samyaksambuddhasyāntikādanuttarāṃ samyaksambodhimabhisaṃbuddhaḥ | sacetpunaḥ subhūte kaściddharmastathāgatenābhisaṃbuddho'bhaviṣyat, na māṃ dīpaṃkarastathāgato vyākariṣyat-bhaviṣyasi tvaṃ māṇava anāgate'dhvani śākyamunirnāma tathāgato'rhan samyaksambuddha iti | yasmāttarhi subhūte tathāgatenārhatā samyaksambuddhena nāsti sa kaściddharmo yo'nuttarāṃ samyaksambodhimabhisaṃbuddhaḥ, tasmādahaṃ dīpaṃkareṇa tathāgatena vyākṛta- bhaviṣyasi tvaṃ māṇava anāgate'dhvani śākyamunirnāma tathāgato'rhan samyaksambuddha | tatkasya hetoḥ ? tathāgata iti subhūte bhūtatathatāyā etadadhivacanam | tathāgata iti subhūte anutpādadharmatāyā etadadhivacanam | tathāgata iti subhūte dharmocchedasyaitadadhivacanam | tathāgata iti subhūte atyantānutpannasyaitadadhivacanam | tatkasya hetoḥ ? eṣa subhūte anutpādo yaḥ paramārthaḥ | yaḥ kaścitsubhūte evaṃ vadet-tathāgatenārhatā samyaksambuddhena anuttarā samyaksambodhirabhisaṃbuddheti, sa vitathaṃ vadet | abhyācakṣīta māṃ sa subhūte asatodgṛhītena | tatkasya hetoḥ- ? nāsti subhūte sa kaściddharmo yastathāgatenānuttarāṃ samyaksambodhimabhisaṃbuddhaḥ | yaśca subhūte tathāgatena dharmo'bhisaṃbuddho deśito vā tatra na satyaṃ na mṛṣā | tasmāttathāgato bhāṣate-sarvadharmā buddhadharmā iti | tatkasya hetoḥ ? sarvadharmā iti subhūte adharmāstathāgatena bhāṣitāḥ | tasmāducyante sarvadharmā buddhadharmā iti ||","tadyathāpi nāma subhūte puruṣo bhavedupetakāyo mahākāyaḥ ? āyuṣmān subhūtirāha- yo'sau bhagavaṃstathāgatena puruṣo bhāṣita upetakāyo mahākāya iti, akāyaḥ sa bhagavaṃstathāgatena bhāṣitaḥ | tenocyate upetakāyo mahākāya iti ||","bhagavānāha -evametatsubhūte | yo bodhisattva evaṃ vadet-ahaṃ sattvān parinirvāpayiṣyāmiti, na sa bodhisattva iti vaktavyaḥ | tatkasya hetoḥ ? asti subhūte sa kaściddharmo yo bodhisattvo nāma ? subhūtirāha-no hīdaṃ bhagavan | nāsti sa kaściddharmo yo bodhisattvo nāma | bhagavānāha- sattvāḥ sattvā iti subhūte asattvāste tathāgatena bhāṣitāḥ, tenocyante sattvā iti | tasmāttathāgato bhāṣate-nirātmānaḥ sarvadharmā nirjīvā niṣpoṣā niṣpudgalāḥ sarvadharmā iti ||","yaḥ subhūte bodhisattva evaṃ vadet- ahaṃ kṣetravyūhānniṣpādayiṣyāmīti, sa vitathaṃ vadet | tatkasya hetoḥ ? kṣetravyūhāḥ kṣetravyūhā iti subhūte avyūhāste tathāgatena bhāṣitāḥ | tenocyante kṣetravyūhā iti ||","yaḥ subhūte bodhisattvo nirātmāno dharmā nirātmāno dharmā ityadhirucyate, tathāgatenārhatā samyaksambuddhena bodhisattvo mahāsattva ityākhyātaḥ ||17||"]}},{section:18,title:{english:"The Five Eyes"},content:{"sanskrit-translit":["bhagavānāha-tatkiṃ manyase subhūte-saṃvidyate tathāgatasya māṃsacakṣuḥ ? subhūtirāha- evametadbhagavan, saṃvidyate tathāgatasya māṃsacakṣuḥ | bhagavānāha-tatkiṃ manyase subhūte saṃvidyate tathāgatasya divyaṃ cakṣuḥ ? subhūtirāha-evametadbhagavan, saṃvidyate tathāgatasya divyaṃ cakṣuḥ | bhagavānāha-tatkiṃ manyase subhūte saṃvidyate tathāgatasya prajñācakṣuḥ ? subhūtirāha-evametadbhagavan, saṃvidyate tathāgatasya prajñācakṣuḥ | bhagavānāha-tatkiṃ manyase subhūte saṃvidyate tathāgatasya dharmacakṣuḥ ? subhūtirāha-evametadbhagavan, saṃvidyate tathāgatasya dharmacakṣuḥ | bhagavānāha- tatkiṃ manyase subhūte saṃvidyate tathāgatasya buddhacakṣuḥ ? subhūtirāha-evametadbhagavan, saṃvidyate tathāgata buddhacakṣuḥ |","bhagavānāha-tatkiṃ manyase subhūte yāvantyo gaṅgāyāṃ mahānadyāṃ vālukāḥ, api nu tā vālukāstathāgatena bhāṣitāḥ ? subhūtirāha-evametadbhagavan, evametat sugata | bhāṣitāstathāgatena vālukāḥ | bhagavānāha-tatkiṃ manyase subhūte yāvatyogaṅgāyāṃ mahānadyāṃ vālukāḥ, tāvatya eva gaṅgānadyo bhaveyuḥ, tāsu vā vālukāḥ, tāvantaśca lokadhātavo bhaveyuḥ, kaccidbahavaste lokadhātavo bhaveyuḥ ? subhūtirāha-evametadbhagavan, evametat sugata | bahavaste lokadhātavo bhaveyuḥ | bhagavānāha-yāvantaḥ subhūte teṣu lokadhātuṣu sattvāḥ, teṣāmahaṃ nānābhāvāṃ cittadhārāṃ prajānāmi | tatkasya hetoḥ ? cittadhārā cittadhāreti subhūte adhāraiṣā tathāgatena bhāṣitā, tenocyate cittadhāreti | tatkasya hetoḥ ? atītaṃ subhūte cittaṃ nopalabhyate | anāgataṃ cittaṃ nopalabhyate | pratyutpannaṃ cittaṃ nopalabhyate ||18||"]}},{section:19,title:{english:"Merit is Not Merit"},content:{"sanskrit-translit":["tatkiṃ manyase subhūte yaḥ kaścitkulaputro vā kuladuhitā vā imaṃ trisāhasramahāsāhasraṃ lokadhātuṃ saptaratnaparipūrṇaṃ kṛtvā tathāgatebhyo'rhadbhyaḥ samyaksambuddhebhyo dānaṃ dadyāt, api nu sa kulaputro vā kuladuhitā vā tatonidānaṃ bahu puṇyaskandhaṃ prasunuyāt ? subhūtirāha- bahu bhagavan, bahu sugata | bhagavānāha-evametatsubhūte, evametat | bahu sa kulaputro vā kuladuhitā vā tatonidānaṃ puṇyaskandhaṃ prasunuyādaprameyāmasaṃkhyeyam | tatkasya hetoḥ ? puṇyaskandhaḥ puṇyaskandha iti subhūte askandhaḥ sa tathāgatena bhāṣitaḥ | tenocyate puṇyaskandha iti | sacet punaḥ subhūte puṇyaskandho'bhaviṣyat, na tathāgato'bhāṣiṣyat puṇyaskandhaḥ puṇyaskandha iti ||19||"]}},{section:20,title:{english:"The Body is No-Body"},content:{"sanskrit-translit":["tatkiṃ manyase subhūte rūpakāyapariniṣpattyā tathāgato draṣṭavyaḥ ? subhūtirāha-no hīdaṃ bhagavan | na rūpakāyapariniṣpattyā tathāgato draṣṭavyaḥ | tatkasya hetoḥ ? rūpakāyapariniṣpattī rūpakāyapariniṣpattiriti bhagavan apariniṣpattireṣā tathāgatena bhāṣitā | tenocyate rūpakāyapariniṣpattiriti ||","bhagavānāha- tatkiṃ manyase subhūte lakṣaṇasaṃpadā tathāgato draṣṭavyaḥ ? subhūtirāha-no hīdaṃ bhagavān | na lakṣaṇasaṃpadā tathāgato draṣṭavyaḥ | tatkasya hetoḥ ? yaiṣā bhagavan lakṣaṇasaṃpattathāgatena bhāṣitā, alakṣaṇasaṃpadeṣā tathāgatena bhāṣitā | tenocyate lakṣaṇasaṃpaditi ||20||"]}},{section:21,title:{english:"There is Nothing to be Said"},content:{"sanskrit-translit":["bhagavānāha- tatkiṃ manyase subhūte api nu tathāgatasyaiṃ bhavati-mayā dharmo deśita iti ? subhūtirāha-no hīdaṃ bhagavan tathāgatasyaiṃ bhavati-mayā dharmo deśita iti | bhagavānāha-yaḥ subhūte evaṃ vadet- tathāgatena dharmo deśita iti, sa vitathaṃ vadet | abhyācakṣīta māṃ sa subhūte asatodgṛhītena | tatkasya hetoḥ ? dharmadeśanā dharmadeśaneti subhūte nāsti sa kaściddharmo yo dharmadeśanā nāmopalabhyate ||","evamukte āyuṣmān subhūtirbhagavantametadavocat-asti bhagavan kecitsattvā bhaviṣyantyanāgate'dhvani paścime kāle paścime samaye paścimāyāṃ pañcaśatyāṃ saddharmavipralope vartamāne, ya imānevaṃrūpān dharmān śrutvā abhiśraddhāsyanti | bhagavānāha- na te subhūte sattvā nāsattvāḥ | tatkasya hetoḥ ? sattvāḥ sattvā iti subhūte sarve te subhūte asattvāstathāgatena bhāṣitāḥ | tenocyante sattvā iti ||21||"]}},{section:22,title:{english:"Awakening is Not Attainable"},content:{"sanskrit-translit":["tatkiṃ manyase subhūte-api nu asti sa kaściddharmaḥ, yastathāgatenānuttarāṃ samyaksambodhimabhisaṃbuddhaḥ ? āyuṣmān subhūtirāha-no hīdaṃ bhagavan | nāsti sa bhagavan kaściddharmo yastathāgatenānuttarāṃ samyaksambodhimabhisaṃbuddhaḥ | bhagavānāha-evametatsubhūte, evametat | aṇurapi tatra dharmo na saṃvidyate nopalabhyate | tenocyate anuttarā samyaksambodhiriti ||22||"]}},{section:23,title:{english:"The Equality of All Things"},content:{"sanskrit-translit":["api tu khalu punaḥ subhūte samaḥ sa dharmo na tatra kaścidviṣamaḥ | tenocyate anuttarā samyaksambodhiriti | nirātmatvena niḥsattvatvena nirjīvatvena niṣpudgalatvena samā sā anuttarā samyaksambodhiḥ sarvaiḥ kuśalairdharmairabhisaṃbudhyate | tatkasya hetoḥ ? kuśalā dharmāḥ kuśalā dharmā iti subhūte adharmāścaiva te tathāgatena bhāṣitāḥ | tenocyante kuśalā dharmā iti ||23||"]}},{section:24,title:{english:"Merit Cannot Be Compared"},content:{"sanskrit-translit":["yaśca khalu punaḥ subhūte strī vā puruṣo vā yāvantastrisāhasramahāsāhasre lokadhātau sumeravaḥ parvatarājānaḥ, tāvato rāśīn saptānāṃ ratnānāmabhisaṃhṛtya tathāgatebhyo'rhadbhyaḥ samyaksambuddhebhyo dānaṃ dadyāt, yaśca kulaputro vā kuladuhitā vā itaḥ prajñāpāramitāyā dharmaparyāyādantaśaścatuṣpādikāmapi gāthāmudgṛhya parebhyo deśayet, asya subhūte puṇyaskandhasya asau paurvakaḥ puṇyaskandhaḥ śatatamīmapi kalāṃ nopaiti, yāvadupaniṣadamapi na kṣamate ||24||"]}},{section:25,title:{english:"No One is Liberated"},content:{"sanskrit-translit":["tatkiṃ manyase subhūte-api nu tathāgatasyaiṃ bhavati-mayā sattvāḥ parimocitā iti? na khalu punaḥ subhūte evaṃ draṣṭavyam | tatkasya hetoḥ ? nāsti subhūte kaścitsattvo yastathāgatena parimocitaḥ | yadi punaḥ subhūte kaścitsattvo'bhaviṣyadyastathāgatena parimocitaḥ syāt, sa eva tathāgatasyātmagrāho'bhaviṣyat, sattvagrāho jīvagrāhaḥ pudgalagrāho'bhaviṣyat | ātmagrāha iti subhūte agrāha eṣa tathāgatena bhāṣitaḥ | sa ca bālapṛthagjanairudgṛhītaḥ | bālapṛthagjanā iti subhūte ajanā eva te tathāgatena bhāṣitāḥ | tenocyante bālapṛthagjanā iti ||25||"]}},{section:26,title:{english:"The Dharmakāya is Not Seen by Marks"},content:{"sanskrit-translit":["tatkiṃ manyase subhūte-lakṣaṇasaṃpadā tathāgato draṣṭavyaḥ ? subhūtirāha-no hīdaṃ bhagavan | yathāhaṃ bhagavato bhāṣitasyārthamājānāmi, na lakṣaṇasaṃpadā tathāgato draṣṭavyaḥ | bhagavānāha-sādhu sādhu subhūte, evametatsubhūte, evametadyathā vadasi | na lakṣaṇasaṃpadā tathāgato draṣṭavyaḥ | tatkasya hetoḥ ? sacetpunaḥ subhūte lakṣaṇasaṃpadā tathāgato draṣṭavyo'bhaviṣyat, rājāpi cakravartī tathāgato'bhaviṣyat | tasmānna lakṣaṇasaṃpadā tathāgato draṣṭavyaḥ | āyuṣmān subhūtirbhagavantametadavocat-yathāhaṃ bhagavato bhāṣitasyārthamājānāmi, na lakṣaṇasaṃpadā tathāgato draṣṭavyaḥ ||","atha khalu bhagavāṃstasyāṃ velāyāmime gāthe abhāṣata-","ye māṃ rūpeṇa cādrākṣurye māṃ ghoṣeṇa cānvaguḥ |"," mithyāprahāṇaprasṛtā na māṃ drakṣyanti te janāḥ ||1||","dharmato buddho draṣṭavyo dharmakāyā hi nāyakāḥ |"," dharmatā ca na vijñeyā na sā śakyā vijānitum ||2||26||"]}},{section:27,title:{english:"No Destruction of Marks"},content:{"sanskrit-translit":["tatkiṃ manyase subhūte lakṣaṇasaṃpadā tathāgatenānuttarā samyaksambodhirabhisaṃbuddhā ? na khalu punaste subhūte evaṃ draṣṭavyam | tatkasya hetoḥ ? na hi subhūte lakṣaṇasaṃpadā tathāgatenānuttarā samyaksambodhirabhisaṃbuddhā syāt | na khalu punaste subhūte kaścidevaṃ vadet-bodhisattvayānasaṃprasthitaiḥ kasyaciddharmasya vināśaḥ prajñapta ucchedo veti | na khalu punaste subhūte evaṃ draṣṭavyam | tatkasya hetoḥ ? na bodhisattvayānasaṃprasthitaiḥ kasyaciddharmasya vināśaḥ prajñapto nocchedaḥ ||27||"]}},{section:28,title:{english:"Merit Not to be Grasped"},content:{"sanskrit-translit":["yaśca khalu punaḥ subhūte kulaputro vā kuladuhitā vā gaṅgānadīvālukāsamāṃllokadhātūn saptaratnaparipūrṇaṃ kṛtvā tathāgatebhyo'rhadbhyaḥ samyaksambuddhebhyo dānaṃ dadyāt, yaśca bodhisattvo nirātmakeṣvanutpattikeṣu dharmeṣu kṣāntiṃ pratilabhate, ayameva tatonidānaṃ bahutaraṃ puṇyaskandhaṃ prasavedaprameyāmasaṃkhyeyam | na khalu punaḥ subhūte bodhisattvena mahāsattvena puṇyaskandhaḥ parigrahītavyaḥ | āyuṣmān subhūtirāha- nanu bhagavan bodhisattvena puṇyaskandhaḥ parigrahītavyaḥ ? bhagavānāha-parigrahītavyaḥ subhūte no grahītavyaḥ | tenocyate parigrahītavya iti ||28||"]}},{section:29,title:{english:"Beyond Action"},content:{"sanskrit-translit":["api tu khalu punaḥ subhūte yaḥ kaścidevaṃ vadet-tathāgato gacchati vā āgacchati vā tiṣṭhati vā niṣīdati vā, śayyāṃ vā kalpayati, na me subhūte (sa) bhāṣitasyārthamājānāti | tatkasya hetoḥ ? tathāgata iti subhūte ucyate na kvacidgato na kutaścidāgataḥ | tenocyate tathāgato'rhan samyaksambuddha iti ||29||"]}},{section:30,title:{english:"Worlds are Not Worlds"},content:{"sanskrit-translit":["yaśca khalu punaḥ subhūte kulaputro vā kuladuhitā vā yāvanti trisāhasramahāsāhasre lokadhātau pṛthivīrajāṃsi, tāvatāṃ lokadhātūnāmevaṃrūpaṃ maṣiṃ kuryāt yāvadevamaṃkhyeyena vīryeṇa tadyathāpi nāma paramāṇusaṃcayaḥ, tatkiṃ manyase subhūte-api nu bahuḥ sa paramāṇusaṃcayo bhavet ? subhūtirāha-evametadbhagavan, evametatsugata | bahuḥ sa paramāṇusaṃcayo bhavet | tatkasya hetoḥ ? sacedbhagavan bahuḥ paramāṇusaṃcayo'bhaviṣyat, na bhagavānavakṣyat-paramāṇusaṃcaya iti | tatkasya hetoḥ ? yo'sau bhagavan paramāṇusaṃcayastathāgatena bhāṣitaḥ, asaṃcayaḥ sa tathāgatena bhāṣitaḥ | tenocyate paramāṇusaṃcaya iti | yaśca tathāgatena bhāṣitastrisāhasramahāsāhasro lokadhāturiti, adhātuḥ sa tathāgatena bhāṣitaḥ | tenocyate trisāhasramahāsāhasro lokadhāturiti | tatkasya hetoḥ ? sacedbhagavan lokadhāturabhaviṣyat, sa eva piṇḍagrāho'bhaviṣyat | yaścaiva piṇḍagrāhastathāgatena bhāṣitaḥ, agrāhaḥ sa tathāgatena bhāṣitaḥ | tenocyate piṇḍagrāha iti | bhagavānāha- piṇḍagrāhaścaiva subhūte avyavahāro'nabilāpyaḥ | na sa dharmo nādharmaḥ | sa ca bālapṛthagjanairudgṛhītaḥ ||30||"]}},{section:31,title:{english:"Views are No-Views"},content:{"sanskrit-translit":["tatkasya hetoḥ ? yo hi kaścitsubhūte evaṃ vadet-ātmadṛṣṭistathāgatena bhāṣitā, sattvadṛṣṭirjīvadṛṣṭiḥ pudgaladṛṣṭistathāgatena bhāṣitā, api nu sa subhūte samyagvadamāno vadet ? subhūtirāha-no hīdaṃ bhagavan, no hīdaṃ sugata, na samyagvadamāno vadet | tatkasya hetoḥ ? yā sā bhagavan ātmadṛṣṭistathāgatena bhāṣitā, adṛṣṭiḥ sā tathāgatena bhāṣitā | tenocyate ātmadṛṣṭiriti ||","bhagavānāha-evaṃ hi subhūte bodhisattvayānasaṃprasthitena sarvadharmā jñātavyā draṣṭavyā adhimoktavyāḥ | tathāca jñātavyā draṣṭavyā adhimoktavyāḥ, yathā na dharmasaṃjñāyāmapi pratyupatiṣṭhennādharmasaṃjñāyām | tatkasya hetoḥ ? dharmasaṃjñā dharmasaṃjñeti subhūte asaṃjñaiṣā tathāgatena bhāṣitā | tenocyate dharmasaṃjñeti ||31||"]}},{section:32,title:{english:"The Final Verse and Conclusion"},content:{"sanskrit-translit":["yaśca khalu punaḥ subhūte bodhisattvo mahāsattvo'prameyānasaṃkhyeyāṃllokadhātūn saptaratnaparipūrṇaṃ kṛtvā tathāgatebhyo'rhadbhyaḥ samyaksambuddhebhyo dānaṃ dadyāt, yaśca kulaputro vā kuladuhitā vā itaḥ prajñāpāramitāyā dharmaparyāyādantaśaścatuṣpādikāmapi gāthāmudgṛhya dhārayeddeśayedvācayet paryavāpnuyāt, parebhyaśca vistareṇa saṃprakāśayet, ayameva tatonidānaṃ bahutaraṃ puṇyaskandhaṃ prasunuyādaprameyāmasaṃkhyeyam | kathaṃ ca saṃprakāśayet ? tadyathākāśe-","tārakā timiraṃ dīpo māyāvaśyāya budbudam |"," svapnaṃ ca vidyudabhraṃ ca evaṃ draṣṭavya saṃskṛtam ||","tathā prakāśayet, tenocyate saṃprakāśayediti ||","idamavocadbhagavān āttamanāḥ | sthavirasubhūtiste ca bhikṣubhikṣuṇyupāsakopāsikāste ca bodhisattvāḥ sadevamānuṣāsuragandharvaśca loko bhagavato bhāṣitamabhyanandanniti ||32||","||āryavajracchedikā bhagavatī prajñāpāramitā samāptā||"]}}];var PL=()=>{let e={},a=(t,n,r)=>{for(let o of t)e[o.section]||(e[o.section]={section:o.section,title:{},content:{}}),o.content[n]&&(e[o.section].content[n]=o.content[n]),r&&o.title[r]&&(e[o.section].title[r]=o.title[r])};return a(Ay,"english","english"),a(Dy,"tibetan","tibetan"),a(Ey,"sanskrit-devanagari","sanskrit-devanagari"),a(My,"tibetan-translit","english"),a(zy,"sanskrit-translit","english"),Object.values(e).sort((t,n)=>t.section-n.section)},Is=PL();var By=[{term:"Abiding",sanskrit:"pratiṣṭhita",tibetan:"གནས་པ། (gnas pa)",definition:"To be established in; to rely upon; to be fixed on; to be attached to. The sutra teaches that a Bodhisattva should act without abiding in any concept or phenomenon."},{term:"Anathapindada",sanskrit:"anāthapiṇḍada",tibetan:"མགོན་མེད་ཟས་སྦྱིན། (mgon med zas sbyin)",definition:`"Giver of Food to the Unprotected." The wealthy patron who donated Jeta's Grove to the Buddha and his community.`},{term:"Arhat",sanskrit:"arhat",tibetan:"དགྲ་བཅོམ་པ། (dgra bcom pa)",definition:'"The Worthy One" or "Foe-Destroyer" (one who has conquered the foe of afflictive emotions). The sutra uses the example of an Arhat to show that even at this advanced stage, grasping at the idea of "attainment" is a misunderstanding of emptiness.'},{term:"Assembly",sanskrit:"parṣad",tibetan:"འཁོར། ('khor)",definition:"The gathering of monks, nuns, laymen, laywomen, and other beings who are present to listen to the Buddha's discourse."},{term:"Atom",sanskrit:"paramāṇu",tibetan:"རྡུལ་ཕྲ་རབ། (rdul phra rab)",definition:"A minute particle; atom. Used to illustrate the deconstruction of seemingly solid phenomena into their constituent parts, which are also empty of inherent existence."},{term:"Being",sanskrit:"sattva",tibetan:"སེམས་ཅན། (sems can)",definition:"A being possessing consciousness. The sutra deconstructs the conventional notion of a 'being' as ultimately empty of any inherent, separate existence."},{term:"Blessed One, The",sanskrit:"bhagavān",tibetan:"བཅོམ་ལྡན་འདས། (bcom ldan 'das)",definition:'A primary epithet for the Buddha, signifying one who has "destroyed" the four maras, "possesses" the six perfections, and has "gone beyond" samsara.'},{term:"Bodhisattva",sanskrit:"bodhisattva",tibetan:"བྱང་ཆུབ་སེམས་དཔའ། (byang chub sems dpa')",definition:`"An Enlightenment-Being." A practitioner who vows to attain Buddhahood for the sake of all beings. The sutra's central teaching for a Bodhisattva is to perform this great work without perceiving a self who acts or beings who receive.`},{term:"Buddha",sanskrit:"buddha",tibetan:"སངས་རྒྱས། (sangs rgyas)",definition:'"The Awakened One." One who has achieved unexcelled, perfect, and complete awakening.'},{term:"Chiliocosm",sanskrit:"lokadhātu",tibetan:"འཇིག་རྟེན་གྱི་ཁམས། ('jig rten gyi khams)",definition:"A world-system or universe. The sutra uses the concept of chiliocosms numerous as the grains of sand in the Ganges to create a sense of unimaginable scale, thereby emphasizing the greater merit of wisdom. It also deconstructs the concept itself."},{term:"Conditioned",sanskrit:"saṃskṛta",tibetan:"འདུས་བྱས། ('dus byas)",definition:"Compounded; that which arises from causes and conditions. The sutra's final verse identifies all conditioned things as illusory."},{term:"Designation",sanskrit:"adhivacana",tibetan:"བླ་དྭགས། (bla dwags)",definition:"An appellation or name. A conventional label used to point to something, which is itself not the ultimate nature of the thing."},{term:"Dharma",sanskrit:"dharma",tibetan:"ཆོས། (chos)",definition:"A term with multiple meanings: 1) The Buddha's teaching. 2) Any phenomenon, thing, or element of existence. 3) A mental object. The sutra teaches that one should not grasp at either dharmas or the absence of dharmas."},{term:"Dharmakāya",sanskrit:"dharmakāya",tibetan:"ཆོས་ཀྱི་སྐུ། (chos kyi sku)",definition:"The Dharma-Body. The ultimate, formless body of a Buddha, which is the embodiment of reality itself and cannot be perceived by physical senses."},{term:"Dharmatā",sanskrit:"dharmatā",tibetan:"ཆོས་ཉིད། (chos nyid)",definition:"The nature of things; the reality of dharmas. Often synonymous with emptiness or thusness. The verse in Section 26 states this is what Buddhas truly see, yet it is unknowable to conventional consciousness."},{term:"Dipamkara",sanskrit:"dīpaṃkara",tibetan:"མར་མེ་མཛད། (mar me mdzad)",definition:`"Lamp-Maker." The Buddha of a past eon who prophesied Śākyamuni's future Buddhahood, used to illustrate that no fixed "dharma" of awakening was ever transmitted.`},{term:"Egg-born",sanskrit:"aṇḍaja",tibetan:"སྒོ་ང་ལས་སྐྱེས་པ། (sgo nga las skyes pa)",definition:"A category of beings born from eggs."},{term:"Emptiness",sanskrit:"śūnyatā",tibetan:"སྟོང་པ་ཉིད། (stong pa nyid)",definition:"The absence of inherent existence or independent self-nature in all phenomena. This is the central philosophical view of the Prajñāpāramitā literature."},{term:"For what reason?",sanskrit:"tat kasya hetoḥ?",tibetan:"དེ་ཅིའི་ཕྱིར་ཞེ་ན། (de ci'i phyir zhe na)",definition:"A recurring rhetorical question the Buddha uses to introduce an explanation based on the principle of emptiness."},{term:"Form, sound, smell, taste, tangible object, mental object",sanskrit:"rūpa, śabda, gandha, rasa, spraṣṭavya, dharma",tibetan:"གཟུགས། སྒྲ། དྲི། རོ། རེག་བྱ། ཆོས། (gzugs, sgra, dri, ro, reg bya, chos)",definition:"The six sense objects corresponding to the six sense faculties. The sutra teaches not to abide in any of them when practicing giving."},{term:"Ganges River",sanskrit:"gaṅgānadī",tibetan:"གངྒཱའི་ཀླུང༌། (ganggā'i klung)",definition:"The sacred river Ganges, used in analogies for its innumerable grains of sand to represent vast quantities."},{term:"Giving",sanskrit:"dāna",tibetan:"སྦྱིན་པ། (sbyin pa)",definition:"Generosity; the act of giving. It is the primary practice used in the sutra to illustrate the principle of non-abiding."},{term:"Grasping at a self",sanskrit:"ātmagrāha",tibetan:"བདག་ཏུ་འཛིན་པ། (bdag tu 'dzin pa)",definition:"The fundamental cognitive error of grasping at a real, substantial self."},{term:"Great Being",sanskrit:"mahāsattva",tibetan:"སེམས་དཔའ་ཆེན་པོ། (sems dpa' chen po)",definition:"An epithet for an advanced Bodhisattva, one of great courage and capacity."},{term:"Heap of merit",sanskrit:"puṇyaskandha",tibetan:"བསོད་ནམས་ཀྱི་ཕུང་པོ། (bsod nams kyi phung po)",definition:"An accumulation of positive potential from virtuous actions. The sutra shows that the merit from understanding emptiness far surpasses any merit from material generosity."},{term:"Indeed not",sanskrit:"no hīdam",tibetan:"མ་ལགས་སོ། (ma lags so)",definition:`A formal way of saying "It is not so," used by Subhuti in his responses to the Buddha's questions.`},{term:"Instruction",sanskrit:"parīndanā",tibetan:"ཡོངས་སུ་གཏད་པ། (yongs su gtad pa)",definition:"The supreme charge, guidance, and care given by the Buddha to Bodhisattvas."},{term:"Jeta's Grove",sanskrit:"jetavana",tibetan:"རྒྱལ་བྱེད་ཀྱི་ཚལ། (rgyal byed kyi tshal)",definition:"A park in Shravasti where the sutra was taught."},{term:"Life-force",sanskrit:"jīva",tibetan:"སྲོག (srog)",definition:"A life principle or soul. Used synonymously with 'self' as a concept to be deconstructed."},{term:"Mental Attention",sanskrit:"manasikāra",tibetan:"ཡིད་ལ་བྱེད་པ། (yid la byed pa)",definition:"The act of focusing the mind or paying attention, especially in the context of properly considering the Dharma."},{term:"Merit",sanskrit:"puṇya",tibetan:"བསོད་ནམས། (bsod nams)",definition:"Positive karmic potential. The sutra clarifies that true merit is generated from a non-conceptual understanding of emptiness."},{term:"Miraculously born",sanskrit:"aupapāduka",tibetan:"བརྫུས་ཏེ་སྐྱེས་པ། (brdzus te skyes pa)",definition:"A category of beings born miraculously, without parents."},{term:"Moisture-born",sanskrit:"saṃsvedaja",tibetan:"དྲོད་གཤེར་ལས་སྐྱེས་པ། (drod gsher las skyes pa)",definition:"A category of beings born from moisture and heat."},{term:"Morality",sanskrit:"śīla",tibetan:"ཚུལ་ཁྲིམས། (tshul khrims)",definition:"Ethical conduct, a foundational practice for a Bodhisattva."},{term:"Mount Sumeru",sanskrit:"sumeru",tibetan:"རི་རབ། (ri rab)",definition:"The mythical cosmic mountain at the center of a chiliocosm, used as a simile for greatness."},{term:"Nirvana",sanskrit:"nirvāṇa",tibetan:"མྱ་ངན་ལས་འདས་པ། (mya ngan las 'das pa)",definition:'"Passing beyond sorrow." The state of liberation from the cycle of rebirth. The sutra discusses leading beings to Nirvana while understanding no being ultimately attains it.'},{term:"Noble Vajra-Cutter Perfection of Wisdom, The",sanskrit:"ārya vajracchedikā prajñāpāramitā",tibetan:"འཕགས་པ་ཤེས་རབ་ཀྱི་ཕ་རོལ་ཏུ་ཕྱིན་པ་རྡོ་རྗེ་གཅོད་པ། ('phags pa shes rab kyi pha rol tu phyin pa rdo rje gcod pa)",definition:"The full title of the sutra. 'Vajra' means diamond or thunderbolt; 'cchedikā' means cutter. It signifies a wisdom that can cut through all delusion."},{term:"Non-abiding",sanskrit:"apratiṣṭhita",tibetan:"མི་གནས་པ། (mi gnas pa)",definition:"Not established; unattached; not relying on. The core practice of a Bodhisattva."},{term:"Non-arising",sanskrit:"anutpāda",tibetan:"སྐྱེ་བ་མེད་པ། (skye ba med pa)",definition:"Unborn. A quality of ultimate reality, meaning that phenomena do not truly come into existence from a state of non-existence."},{term:"Non-returner",sanskrit:"anāgāmin",tibetan:"ཕྱིར་མི་འོང་བ། (phyir mi 'ong ba)",definition:"The third of the four stages of śrāvaka attainment, a being who will not be reborn in the desire realm."},{term:"Once-returner",sanskrit:"sakṛdāgāmin",tibetan:"ལན་གཅིག་ཕྱིར་འོང་བ། (lan gcig phyir 'ong ba)",definition:"The second of the four stages of śrāvaka attainment, a being who will be reborn only once more in the desire realm."},{term:"Particle",sanskrit:"rajas",tibetan:"རྡུལ། (rdul)",definition:"A minute particle of dust or earth. Used to illustrate vast numbers or the lack of substance in phenomena."},{term:"Patience",sanskrit:"kṣānti",tibetan:"བཟོད་པ། (bzod pa)",definition:"Forbearance; acceptance. The story of the King of Kalinga is used to illustrate the perfection of patience."},{term:"Perception",sanskrit:"saṃjñā",tibetan:"འདུ་ཤེས། ('du shes)",definition:"A concept, notion, or sign. The mental act of labeling or identifying, which the sutra teaches is the basis of delusion."},{term:"Perception of a being",sanskrit:"sattvasaṃjñā",tibetan:"སེམས་ཅན་དུ་འདུ་ཤེས། (sems can du 'du shes)",definition:"The idea of a being as a discrete, real entity. One of the four perceptions to be abandoned."},{term:"Perception of a life-soul",sanskrit:"jīvasaṃjñā",tibetan:"སྲོག་ཏུ་འདུ་ཤེས། (srog tu 'du shes)",definition:"The idea of an enduring life-principle or soul. One of the four perceptions to be abandoned."},{term:"Perception of a person",sanskrit:"pudgalasaṃjñā",tibetan:"གང་ཟག་ཏུ་འདུ་ཤེས། (gang zag tu 'du shes)",definition:"The idea of an individual person as a substantial entity. One of the four perceptions to be abandoned."},{term:"Perception of a self",sanskrit:"ātmasaṃjñā",tibetan:"བདག་ཏུ་འདུ་ཤེས། (bdag tu 'du shes)",definition:'The idea of a permanent, independent "I". The primary of the four perceptions to be abandoned.'},{term:"Perfection",sanskrit:"pāramitā",tibetan:"ཕ་རོལ་ཏུ་ཕྱིན་པ། (pha rol tu phyin pa)",definition:'A transcendent practice that "reaches the other shore." The six primary perfections are giving, morality, patience, effort, concentration, and wisdom.'},{term:"Perfection of Wisdom",sanskrit:"prajñāpāramitā",tibetan:"ཤེས་རབ་ཀྱི་ཕ་རོལ་ཏུ་ཕྱིན་པ། (shes rab kyi pha rol tu phyin pa)",definition:"Transcendent wisdom that directly understands emptiness. It is both the name of the teaching and the ultimate goal."},{term:"Perfectly and Completely Awakened One",sanskrit:"samyaksaṃbuddha",tibetan:"ཡང་དག་པར་རྫོགས་པའི་སངས་རྒྱས། (yang dag par rdzogs pa'i sangs rgyas)",definition:"A perfect Buddha who has achieved the highest enlightenment."},{term:"Person",sanskrit:"pudgala",tibetan:"གང་ཟག (gang zag)",definition:"An individual. Like 'self,' this concept is deconstructed to show its lack of inherent existence."},{term:"Physical eye, divine eye, wisdom eye, dharma eye, and buddha eye",sanskrit:"māṃsacakṣus, divyacakṣus, prajñācakṣus, dharmacakṣus, buddhacakṣus",tibetan:"ཤའི་སྤྱན། ལྷའི་སྤྱན། ཤེས་རབ་ཀྱི་སྤྱན། ཆོས་ཀྱི་སྤྱན། སངས་རྒྱས་ཀྱི་སྤྱན། (sha'i spyan, lha'i spyan, shes rab kyi spyan, chos kyi spyan, sangs rgyas kyi spyan)",definition:"The five types of vision possessed by a Buddha, representing progressively deeper levels of perception from the physical to the omniscient."},{term:"Possession of Marks",sanskrit:"lakṣaṇasampadā",tibetan:"མཚན་ཕུན་སུམ་ཚོགས་པ། (mtshan phun sum tshogs pa)",definition:"The thirty-two major physical marks of a Great Being. The sutra clarifies that a Buddha cannot be truly defined by these marks."},{term:"Raft",sanskrit:"kola",tibetan:"གཟིངས། (gzings)",definition:"Used in the simile 'the Dharma is like a raft': it is a tool to be used for crossing to liberation and then abandoned, not clung to as a possession."},{term:"Realm of Nirvana without remaining aggregates",sanskrit:"anupadhiśeṣa-nirvāṇadhātu",tibetan:"ཕུང་པོ་ལྷག་མ་མེད་པའི་མྱ་ངན་ལས་འདས་པའི་དབྱིངས། (phung po lhag ma med pa'i mya ngan las 'das pa'i dbyings)",definition:"The state of complete extinction at the death of an Arhat, where no psycho-physical aggregates remain."},{term:"Rūpakāya",sanskrit:"rūpakāya",tibetan:"གཟུགས་ཀྱི་སྐུ། (gzugs kyi sku)",definition:"The Form-Body; the physical manifestation of a Buddha."},{term:"Self",sanskrit:"ātman",tibetan:"བདག (bdag)",definition:"An enduring, independent, and singular self or soul, the existence of which is refuted by the teaching on emptiness."},{term:"Shravasti",sanskrit:"śrāvastī",tibetan:"མཉན་ཡོད། (mnyan yod)",definition:"The city where the Buddha often taught and the setting for this sutra."},{term:"Sign",sanskrit:"nimitta / lakṣaṇa",tibetan:"མཚན་མ། (mtshan ma)",definition:"A mark, characteristic, or attribute. A key aspect of the teaching is to act without abiding in signs."},{term:"Space",sanskrit:"ākāśa",tibetan:"ནམ་མཁའ། (nam mkha')",definition:"Used as a metaphor for that which is immeasurable and boundless, like the merit of non-abiding generosity."},{term:"Stars, fault of vision, lamp, illusion, dewdrop, bubble, dream, lightning flash, cloud",sanskrit:"tārakā, timiraṃ, dīpo, māyā, avaśyāya, budbudam, supinaṃ, vidyut, abhraṃ",tibetan:"སྐར་མ། རབ་རིབ། མར་མེ། སྒྱུ་མ། ཟིལ་པ། ཆུ་བུར། རྨི་ལམ། གློག སྤྲིན། (skar ma, rab rib, mar me, sgyu ma, zil pa, chu bur, rmi lam, glog, sprin)",definition:"The nine similes in the final verse used to illustrate the ephemeral and illusory nature of all compounded things."},{term:"Stream-enterer",sanskrit:"srotāpanna",tibetan:"རྒྱུན་དུ་ཞུགས་པ། (rgyun du zhugs pa)",definition:"The first of four stages of śrāvaka attainment, signifying one who has entered the stream to nirvana."},{term:"Subhuti",sanskrit:"subhūti",tibetan:"རབ་འབྱོར། (rab 'byor)",definition:"A principal disciple of the Buddha, renowned for his understanding of emptiness, who serves as the main questioner in this sutra."},{term:"Thirty-two marks of a great being, The",sanskrit:"dvātriṃśanmahāpuruṣalakṣaṇāni",tibetan:"མཚན་སུམ་ཅུ་རྩ་གཉིས། (mtshan sum cu rtsa gnyis)",definition:"The thirty-two major physical marks of a Great Being, such as a Buddha."},{term:"Thus have I heard",sanskrit:"evaṃ mayā śrutam",tibetan:"འདི་སྐད་བདག་གིས་ཐོས་པ། ('di skad bdag gis thos pa)",definition:"The traditional opening line of a Buddhist sutra, indicating that the following teaching was directly heard from the Buddha by his disciple Ananda."},{term:"To generate the thought of enlightenment",sanskrit:"cittam utpādayati",tibetan:"སེམས་བསྐྱེད་པ། (sems bskyed pa)",definition:"To arouse Bodhicitta, the compassionate intention to attain awakening for the benefit of all beings."},{term:"To slander",sanskrit:"abhyācakṣīta",tibetan:"སྐུར་བ་འདེབས་པ། (skur ba 'debs pa)",definition:"To wrongly accuse or misrepresent, especially in the context of claiming the Buddha taught a fixed, substantial doctrine."},{term:"To take up, bear in mind, recite, and master completely",sanskrit:"udgṛhṇīyāt, dhārayet, vācayet, paryavāpnuyāt",tibetan:"གཟུང་བ། འཛིན་པ། ཀློག་པ། ཀུན་ཆུབ་པར་བྱེད་པ། (gzung ba, 'dzin pa, klog pa, kun chub par byed pa)",definition:"A recurring set of verbs describing the proper way to engage with the sutra for maximum benefit."},{term:"To teach / to illuminate fully",sanskrit:"deśayati / saṃprakāśayati",tibetan:"བཤད་པ། / རབ་ཏུ་སྟོན་པ། (bshad pa / rab tu ston pa)",definition:"Verbs used to describe the act of explaining the Dharma to others."},{term:"Trichiliocosm",sanskrit:"trisāhasra-mahāsāhasra-lokadhātu",tibetan:"སྟོང་གསུམ་གྱི་སྟོང་ཆེན་པོའི་འཇིག་རྟེན་གྱི་ཁམས། (stong gsum gyi stong chen po'i 'jig rten gyi khams)",definition:'A "three-thousand-great-thousand world system," representing one billion worlds. The largest cosmological unit, used to create a sense of vast scale.'},{term:"True Suchness",sanskrit:"bhūtatathatā",tibetan:"ཡང་དག་པ་དེ་བཞིན་ཉིད། (yang dag pa de bzhin nyid)",definition:'Ultimate reality as it is, free from conceptual fabrication. The sutra states that "Tathagata" is an epithet for this reality.'},{term:"Unconditioned",sanskrit:"asaṃskṛta",tibetan:"འདུས་མ་བྱས། ('dus ma byas)",definition:"Uncompounded; that which is beyond cause and effect, like nirvana. The sutra states that noble individuals are distinguished by their realization of the unconditioned."},{term:"Unexcelled, Perfect, and Complete Awakening",sanskrit:"anuttarā samyaksaṃbodhi",tibetan:"བླ་ན་མེད་པ་ཡང་དག་པར་རྫོགས་པའི་བྱང་ཆུབ། (bla na med pa yang dag par rdzogs pa'i byang chub)",definition:'The highest, perfect and complete enlightenment of a Buddha, which the sutra clarifies is not a "thing" to be attained.'},{term:"Vehicle",sanskrit:"yāna",tibetan:"ཐེག་པ། (theg pa)",definition:"A path or approach to enlightenment (e.g., the Bodhisattva Vehicle, bodhisattvayāna)."},{term:"Venerable",sanskrit:"āyuṣmān",tibetan:"ཚེ་དང་ལ
